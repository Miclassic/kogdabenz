<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>КогдаБенз — когда лучше заправиться?</title>

<style>

:root {
  --bg: #f6f8fd;
  --card: #ffffff;
  --text: #14213d;
  --muted: #71809c;
  --blue: #397cff;
  --blue-light: #edf4ff;
  --green: #19b77a;
  --green-light: #eafaf4;
  --red: #ef5350;
  --yellow: #f5b82e;
  --border: #e6ebf4;
  --shadow: 0 12px 35px rgba(38, 69, 120, .09);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 85% 0%, rgba(79, 139, 255, .13), transparent 30%),
    radial-gradient(circle at 0% 35%, rgba(57, 199, 151, .08), transparent 28%),
    linear-gradient(145deg, #fbfcff 0%, #f3f7ff 100%);
}

button, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.page {
  width: min(100%, 760px);
  margin: 0 auto;
  padding: calc(16px + env(safe-area-inset-top)) 16px 35px;
}

/* =========================
   HEADER
========================= */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 28px;
}
.logo-wrap { display: flex; align-items: center; gap: 11px; }
.logo {
  width: 48px; height: 48px;
  display: grid; place-items: center;
  border-radius: 17px;
  background: linear-gradient(145deg, #ffffff, #edf4ff);
  box-shadow: 0 8px 22px rgba(55, 100, 180, .12);
  font-size: 26px;
}
.logo-title { font-size: 21px; font-weight: 850; letter-spacing: -.6px; }
.logo-subtitle { margin-top: 2px; color: var(--muted); font-size: 12px; }
.location {
  border: 1px solid var(--border);
  background: rgba(255,255,255,.85);
  color: var(--text);
  border-radius: 18px;
  padding: 11px 14px;
  font-size: 13px; font-weight: 700;
  box-shadow: 0 7px 20px rgba(50,80,130,.06);
  cursor: pointer;
}

/* =========================
   HERO
========================= */
.hero { margin-bottom: 20px; }
.hero h1 { margin: 0; max-width: 600px; font-size: clamp(42px, 10vw, 66px); line-height: .96; letter-spacing: -3px; font-weight: 900; }
.hero h1 span { display: block; color: var(--blue); }
.hero-text { max-width: 570px; margin: 18px 0 19px; color: #647491; font-size: 16px; line-height: 1.45; }

/* =========================
   SEARCH
========================= */
.search {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 8px 7px 15px;
  background: rgba(255,255,255,.94);
  border: 1px solid rgba(226,232,244,.95);
  border-radius: 23px;
  box-shadow: var(--shadow);
}
.search-icon { color: #7890b4; font-size: 24px; line-height: 1; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 16px; }
.search input::placeholder { color: #94a1b7; }
.search-button {
  width: 47px; height: 47px; border: 0; border-radius: 17px;
  background: linear-gradient(135deg, #4385ff, #2465ee);
  color: white; font-size: 23px; cursor: pointer;
  box-shadow: 0 8px 18px rgba(57,124,255,.25);
}

/* =========================
   STATUS
========================= */
.status {
  margin-top: 16px; padding: 18px; border-radius: 20px;
  background: rgba(255,255,255,.85); border: 1px solid var(--border);
  color: var(--muted); text-align: center; box-shadow: var(--shadow);
}

/* =========================
   STATION CARD
========================= */
.station {
  margin-top: 17px; padding: 15px;
  background: rgba(255,255,255,.96);
  border: 1px solid rgba(228,234,245,.95);
  border-radius: 28px; box-shadow: var(--shadow);
}
.station-header { display: flex; align-items: center; gap: 11px; margin-bottom: 13px; }
.station-logo {
  width: 51px; height: 51px; flex: 0 0 auto;
  display: grid; place-items: center;
  border-radius: 16px; background: #ffffff;
  border: 1px solid #eef2f8; font-size: 23px; overflow: hidden; padding: 6px;
}
.station-logo img { width: 100%; height: 100%; object-fit: contain; }
.station-info { min-width: 0; flex: 1; }
.station-name { font-size: 20px; font-weight: 850; letter-spacing: -.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.station-address { margin-top: 3px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.favorite { width: 39px; height: 39px; border: 0; border-radius: 14px; background: #f5f7fb; color: #7487a7; font-size: 19px; cursor: pointer; }

/* =========================
   FUEL STATUS
========================= */
.fuels { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:5px; border-radius:16px; background:#f5f8fc; }
.fuel { padding:8px 4px; text-align:center; border-radius:12px; background:#fff; }
.fuel-name { font-size:12px; font-weight:800; }
.fuel-status { display:flex; align-items:center; justify-content:center; gap:4px; margin-top:4px; font-size:11px; font-weight:700; }
.fuel-conf { margin-top:2px; color:#93a1b8; font-size:10px; font-weight:600; }
.dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
.dot.green { background:#1bb978; }
.dot.red { background:#ef5350; }
.dot.gray { background:#a7b1c1; }
.yes { color:#168d61; }
.no { color:#d64d51; }
.unknown { color:#7c899e; }

/* =========================
   FORECAST
========================= */
.forecast { position:relative; margin-top:9px; padding:12px; border-radius:18px; background:linear-gradient(135deg,#eafaf4,#edf4ff); border:1px solid #d9eae7; display:grid; grid-template-columns:1fr 1fr; gap:10px; overflow:hidden; }
.forecast-left { min-width:0; }
.forecast-top { display:flex; align-items:center; gap:6px; }
.forecast-icon { width:26px; height:26px; display:grid; place-items:center; border-radius:9px; background:#d8f5e9; color:#15966c; font-size:14px; }
.forecast-label { color:#168d67; font-size:10px; font-weight:850; text-transform:uppercase; letter-spacing:.5px; }
.forecast-title { margin-top:8px; color:#627593; font-size:10px; }
.forecast-time { margin-top:2px; font-size:21px; line-height:1.05; font-weight:900; letter-spacing:-1px; }
.forecast-confidence { margin-top:6px; color:#657694; font-size:10px; }
.forecast-confidence strong { color:var(--text); }
.confidence-bar { height:5px; margin-top:5px; overflow:hidden; border-radius:99px; background:#d7e8e4; }
.confidence-bar span { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#21b986,#4284ff); }
.forecast-right { min-width:0; display:flex; flex-direction:column; }
.graph-title { font-size:10px; font-weight:800; color:#5b6b86; }
.chart { position:relative; flex:1; min-height:54px; display:flex; align-items:flex-end; gap:3px; margin-top:6px; padding:0 1px; border-bottom:1px solid #e9edf5; }
.bar-wrap { position:relative; flex:1; height:100%; display:flex; align-items:flex-end; justify-content:center; }
.bar { width:100%; max-width:9px; min-height:4px; border-radius:4px 4px 2px 2px; background:linear-gradient(180deg,#78a4ff,#d6e3ff); }
.bar.good { background:linear-gradient(180deg,#35c894,#b9eedc); }
.bar.bad { background:linear-gradient(180deg,#ff9f9a,#ffd7d4); }
.bar.current { background:linear-gradient(180deg,#397cff,#8eb4ff); box-shadow:0 0 0 2px rgba(57,124,255,.12); }
.chart-axis { display:flex; justify-content:space-between; margin-top:3px; color:#8998ae; font-size:8px; }
.soon-badge { position:absolute; top:-4px; left:50%; transform:translateX(-50%); background:#2465ee; color:#fff; font-size:8px; font-weight:800; padding:2px 6px; border-radius:8px; white-space:nowrap; }

/* =========================
   INFO
========================= */
.info-row { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px; }
.info { padding:8px 9px; border-radius:13px; background:#f7f9fc; min-width:0; }
.info-label { color:#8291a9; font-size:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.info-value { margin-top:3px; color:var(--text); font-size:11px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* =========================
   FEEDBACK
========================= */
.feedback { margin-top:8px; padding:10px 12px; border-radius:16px; background:linear-gradient(135deg,#eafaf5,#eff5ff); border:1px solid #dcebe9; }
.feedback-header { display:flex; align-items:center; gap:9px; }
.feedback-icon { width:32px; height:32px; display:grid; place-items:center; flex:0 0 auto; border-radius:11px; background:#d7f5e9; color:#15976d; font-size:16px; font-weight:700; }
.feedback-title { font-size:12px; font-weight:850; }
.feedback-sub { margin-top:2px; color:#7485a0; font-size:9px; line-height:1.3; }
.feedback-button { margin-left:auto; flex:0 0 auto; border:0; border-radius:13px; padding:9px 12px; background:linear-gradient(135deg,#20b989,#397cff); color:#fff; font-size:11px; font-weight:850; cursor:pointer; box-shadow:0 5px 12px rgba(54,139,198,.16); }
.feedback-panel { display:none; margin-top:8px; padding:8px; border:1px solid #e4eaf3; border-radius:14px; background:#fff; }
.feedback-panel.open { display:block; }
.feedback-question { margin:2px 2px 7px; font-size:11px; font-weight:850; }
.feedback-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
.feedback-option { padding:8px 5px; border:1px solid #e0e6ef; border-radius:12px; background:#f8fafc; color:#33445f; font-size:10px; font-weight:700; cursor:pointer; }
.feedback-option:active, .feedback-option.selected { background:#e7f8f1; border-color:#8bd8ba; color:#13845e; }
.recent { margin-top:7px; color:#8492a8; font-size:9px; line-height:1.4; }

/* =========================
   EMPTY
========================= */
.empty-search { padding: 25px; margin-top: 15px; border-radius: 22px; background: rgba(255,255,255,.8); border: 1px solid var(--border); text-align: center; color: var(--muted); }

/* =========================
   CITY PULSE LIGHT PREMIUM
========================= */
.pulse { position:relative; margin-top:20px; padding:18px 16px 16px; border-radius:28px; background:linear-gradient(165deg,#ffffff 0%,#fbfcff 55%,#f6f9ff 100%); border:1px solid #e8edf7; box-shadow:0 18px 50px rgba(38,69,120,.10), inset 0 1px 0 #fff; overflow:hidden; }
.pulse::before { content:""; position:absolute; inset:0; background:radial-gradient(520px 200px at 88% -12%, rgba(64,130,255,.07), transparent 60%), radial-gradient(420px 180px at 6% 112%, rgba(25,183,122,.06), transparent 60%); pointer-events:none; }
.pulse::after { content:""; position:absolute; top:0; left:24px; right:24px; height:1px; background:linear-gradient(90deg,transparent,rgba(124,109,255,.35),rgba(25,183,122,.3),transparent); }
.pulse-head { position:relative; display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.pulse-title { color:#14213d; font-size:16px; font-weight:850; letter-spacing:.1px; }
.pulse-sub { margin-top:3px; color:#93a1b8; font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:1.4px; }
.pulse-tabs { display:flex; background:#eef2f9; border:1px solid #e6ebf4; border-radius:12px; padding:3px; }
.pulse-tab { border:0; background:transparent; color:#7487a7; border-radius:9px; padding:6px 12px; font-size:11px; font-weight:800; cursor:pointer; transition:.2s; }
.pulse-tab.active { background:#fff; color:#2465ee; box-shadow:0 4px 12px rgba(38,69,120,.12); }
.pulse-kpis { position:relative; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
.pulse-kpi { padding:10px 10px 9px; border-radius:16px; background:#fff; border:1px solid #edf1f8; box-shadow:0 6px 16px rgba(38,69,120,.05); }
.pulse-kpi-label { color:#93a1b8; font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:.9px; }
.pulse-kpi-value { margin-top:4px; color:#14213d; font-size:17px; font-weight:900; letter-spacing:-.4px; }
.pulse-kpi-value small { font-size:10px; font-weight:700; color:#93a1b8; }
.pulse-chart { position:relative; margin-top:10px; }
.pulse-svg { width:100%; height:240px; display:block; }
.pulse-tip { position:absolute; pointer-events:none; background:rgba(255,255,255,.96); backdrop-filter:blur(8px); border:1px solid #e6ebf4; color:#33445f; border-radius:14px; padding:9px 12px; font-size:10px; line-height:1.55; opacity:0; transform:translate(-50%,-115%); transition:opacity .18s; white-space:nowrap; z-index:5; box-shadow:0 14px 34px rgba(38,69,120,.16); }
.pulse-tip b { color:#14213d; }
.pulse-legend { position:relative; display:flex; gap:7px; flex-wrap:wrap; margin-top:12px; }
.pulse-legend span { display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:99px; background:#fff; border:1px solid #edf1f8; color:#647491; font-size:10px; font-weight:700; }
.pulse-legend i { width:8px; height:8px; border-radius:50%; display:inline-block; }
.pulse-legend i.band { width:10px; height:12px; border-radius:3px; }
.pulse-insight { position:relative; margin-top:11px; padding:11px 13px; border-radius:16px; background:linear-gradient(135deg,#eafaf5,#eff5ff); border:1px solid #dcebe9; color:#33445f; font-size:11px; line-height:1.55; }
.pulse-line { stroke-dasharray:1; stroke-dashoffset:1; animation:drawLine 1.3s .15s ease forwards; }
@keyframes drawLine { to { stroke-dashoffset:0; } }
.pulse-area { opacity:0; animation:fadeArea .8s .6s ease forwards; }
@keyframes fadeArea { to { opacity:1; } }
.now-halo { animation:nowPulse 2.2s ease-in-out infinite; }
@keyframes nowPulse { 0%,100% { opacity:.25; } 50% { opacity:.75; } }

.fb-extra { margin-top:9px; }
.fb-text { width:100%; margin-top:8px; padding:10px 12px; border:1px solid #e0e6ef; border-radius:12px; background:#f8fafc; color:#33445f; font-size:12px; outline:none; }
.fb-send { width:100%; margin-top:8px; padding:11px 14px; border:0; border-radius:14px; background:linear-gradient(135deg,#20b989,#397cff); color:#fff; font-size:12px; font-weight:850; cursor:pointer; }
.station-logo img { width:100%; height:100%; object-fit:contain; border-radius:inherit; background:#fff; padding:6px; }

/* =========================
   STATION ROWS (гибрид)
========================= */
.trust { display:flex; gap:7px; flex-wrap:wrap; margin:14px 0 4px; }
.trust span { padding:7px 11px; border-radius:99px; background:rgba(255,255,255,.85); border:1px solid var(--border); color:#647491; font-size:10px; font-weight:800; }
.srow-wrap { margin-top:12px; }
.srow { width:100%; display:flex; gap:0; text-align:left; padding:0; background:rgba(255,255,255,.96); border:1px solid rgba(228,234,245,.95); border-radius:22px; box-shadow:var(--shadow); cursor:pointer; overflow:hidden; }
.sbar { width:10px; align-self:stretch; flex:0 0 auto; }
.srow-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; padding:13px 14px 12px 12px; }
.srow-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.srow-name { font-size:16px; font-weight:850; letter-spacing:-.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sbadge { flex:0 0 auto; font-size:9px; font-weight:850; text-transform:uppercase; letter-spacing:.6px; padding:5px 9px; border-radius:99px; }
.sbadge.open { background:#e5f8ef; color:#12855c; }
.sbadge.soon { background:#efeaff; color:#6a4fd8; }
.sbadge.none { background:#fff2e8; color:#c26a2a; }
.sbadge.late { background:#f2f4f9; color:#7c89a0; }
.srow-addr { color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.srow-cols { display:grid; grid-template-columns:1.1fr 1.2fr .9fr; gap:8px; align-items:end; }
.scol { display:flex; flex-direction:column; gap:2px; min-width:0; }
.scol-l { color:#93a1b8; font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:.8px; }
.scol-v { font-size:12px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.scol-v.yes { color:#168d61; }
.scol-v.no { color:#d64d51; }
.scol-v.unknown { color:#7c899e; }
.scol-s { color:#93a1b8; font-size:9px; font-weight:700; }
.scol-r { align-items:flex-end; }
.spark { width:64px; height:22px; }
.srow-sub { color:#93a1b8; font-size:9px; font-weight:700; }
.srow-full { margin-top:10px; }
.srow-full .station { margin-top:0; }

/* =========================
   APP SHELL (один экран)
========================= */
html, body { height:100%; }
body { overflow:hidden; }
.page { height:100dvh; display:flex; flex-direction:column; max-width:560px; padding:calc(10px + env(safe-area-inset-top)) 12px 0; margin:0 auto; }
.header { margin-bottom:8px; }
.logo { width:40px; height:40px; border-radius:14px; font-size:21px; }
.logo-title { font-size:17px; }
.logo-subtitle { font-size:10px; }
.location { padding:8px 11px; font-size:11px; border-radius:14px; }
#app { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:calc(14px + env(safe-area-inset-bottom)); }

.nowcard { margin-top:2px; padding:14px; border-radius:24px; background:#fff; border:1px solid #eceff5; box-shadow:0 10px 30px rgba(38,69,120,.08); }
.nowcard-title { font-size:19px; font-weight:900; letter-spacing:-.6px; }
.nowcard-sub { margin-top:4px; color:#71809c; font-size:11px; font-weight:600; }
.nowcard-chart { margin-top:6px; }
.nowcard-chart .pulse-svg { height:110px; }
.nowcard-chart .pulse { margin-top:0; padding:0; border:0; box-shadow:none; background:transparent; overflow:visible; }
.nowcard-chart .pulse::before, .nowcard-chart .pulse::after { display:none; }
.nowcard-chart .pulse-head, .nowcard-chart .pulse-kpis, .nowcard-chart .pulse-legend, .nowcard-chart .pulse-insight, .nowcard-chart .pulse-tabs { display:none; }
.nowcard-chart .pulse-chart { margin-top:0; }
.nkpi-row { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
.nkpi { padding:8px 10px; border-radius:12px; background:#f7f9fc; }
.nkpi-l { color:#93a1b8; font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:.8px; }
.nkpi-v { margin-top:3px; color:#14213d; font-size:14px; font-weight:850; }
.nowcard-cta { display:flex; gap:8px; margin-top:10px; }
.cta-btn { flex:1; border:0; border-radius:16px; padding:12px; background:linear-gradient(135deg,#4385ff,#2465ee); color:#fff; font-size:12px; font-weight:850; cursor:pointer; box-shadow:0 8px 18px rgba(57,124,255,.25); }
.cta-btn.ghost { background:#f2f4f9; color:#33445f; box-shadow:none; }
.search { margin-top:10px; border-radius:18px; padding:5px 6px 5px 12px; }
.search input { font-size:14px; }
.search-button { width:38px; height:38px; border-radius:13px; font-size:18px; }
.listhead { display:flex; align-items:center; justify-content:space-between; margin:12px 2px 2px; color:#14213d; font-size:13px; font-weight:850; }
.listhead small { color:#93a1b8; font-weight:700; }
.srow { border-radius:18px; }
.srow-wrap { margin-top:8px; }
.srow-main { padding:10px 12px 9px 10px; gap:4px; }
.srow-name { font-size:14px; }
.srow-addr { font-size:10px; }
.scol-v { font-size:11px; }
.srow-sub { display:none; }

/* =========================
   BOTTOM SHEET (iOS-шторка)
========================= */
.sheet-backdrop { position:fixed; inset:0; background:rgba(15,27,51,.35); backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:.25s; z-index:40; }
.sheet-backdrop.open { opacity:1; pointer-events:auto; }
.sheet { position:fixed; left:0; right:0; bottom:0; max-height:86dvh; overflow-y:auto; background:#f6f8fd; border-radius:28px 28px 0 0; padding:10px 12px calc(16px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:.3s cubic-bezier(.2,.8,.2,1); z-index:41; box-shadow:0 -20px 60px rgba(15,27,51,.25); }
.sheet.open { transform:translateY(0); }
.sheet-grab { width:44px; height:5px; border-radius:99px; background:#d7dde8; margin:4px auto 10px; }
.sheet-close { position:sticky; top:0; float:right; margin:2px 2px 6px auto; width:32px; height:32px; border:0; border-radius:12px; background:#e9edf5; color:#5b6b86; font-size:16px; cursor:pointer; z-index:5; }
.sheet .station { margin-top:0; }

@media(max-width:520px){
  .page { padding-left: 12px; padding-right: 12px; }
  .header { margin-bottom: 23px; }
  .logo { width: 45px; height: 45px; border-radius: 15px; }
  .logo-title { font-size: 18px; }
  .logo-subtitle { font-size: 10px; }
  .location { padding: 9px 11px; font-size: 11px; }
  .hero h1 { font-size: 42px; letter-spacing: -2px; }
  .hero-text { margin-top: 15px; font-size: 14px; }
  .station { padding: 12px; border-radius: 24px; }
  .station-logo { width: 47px; height: 47px; }
  .station-name { font-size: 18px; }
  .fuels { gap: 4px; }
  .fuel-name { font-size: 12px; }
  .forecast { padding: 15px; }
  .forecast-time { font-size: 29px; }
  .graph { padding: 12px; }
  .bar { max-width: 19px; }
}

</style>
</head>

<body>

<div class="page">

  <header class="header">
    <div class="logo-wrap">
      <div class="logo">⛽</div>
      <div>
        <div class="logo-title">КогдаБенз</div>

async function dbQuery(path) {
  const r = await fetch(SUPABASE_URL + path, {
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);

}

async function dbInsert(table, rows) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + table, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      Prefer: 'return=minimal'

    body: JSON.stringify(rows)

/* =====================================================
   HELPERS
===================================================== */
function escapeHtml(value) {
  return String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function fuelHtml(ok) {
  if (ok === null || ok === undefined) {
    return '<span class="unknown"><span class="dot gray"></span>нет данных</span>';
  }
  if (ok) return '<span class="yes"><span class="dot green"></span>есть</span>';
  return '<span class="no"><span class="dot red"></span>нет</span>';
}

function freshnessText(obs) {
  if (obs && obs.data_freshness_minutes !== null && obs.data_freshness_minutes !== undefined) {
    const m = obs.data_freshness_minutes;
    if (m < 1) return 'только что';
    if (m < 60) return m + ' мин назад';
    if (m < 1440) return Math.round(m / 60) + ' ч назад';
    return Math.round(m / 1440) + ' дн назад';
  }
  if (!obs || !obs.timestamp) return 'нет данных';
  const t = new Date(obs.timestamp).getTime();
  if (!Number.isFinite(t)) return 'нет данных';
  const min = Math.max(0, Math.round((Date.now() - t) / 60000));
  if (min < 1) return 'только что';
  if (min < 60) return min + ' мин назад';
  if (min < 1440) return Math.round(min / 60) + ' ч назад';
  return Math.round(min / 1440) + ' дн назад';
}

function time5(value) {
  if (!value) return '—';
  const s = String(value);
  return s.length >= 5 ? s.substring(0,5) : s;
}

/* =====================================================
   PREDICTION
===================================================== */
function getPrediction(pred) {
  if (!pred) return { time: 'Пока нет прогноза', confidence: 0, note: 'Нужно больше наблюдений, чтобы понять ритм этой АЗС.', eta: null };
  const confidence = Math.max(0, Math.min(100, Math.round((pred.confidence || 0) * 100)));
  const src = pred.prediction_source || (pred.algorithm_version || '').split('|')[1] || 'own';
  const stationsN = pred.based_on_stations || 1;
  const obsN = pred.based_on_observations || 0;
  let note = 'На основе ';
  if (src === 'own') note += obsN + ' наблюдений этой АЗС.';
  else if (src === 'brand') note += obsN + ' наблюдений ' + stationsN + ' похожих АЗС того же бренда.';
  else if (src === 'city') note += obsN + ' наблюдений ' + stationsN + ' АЗС Новороссийска.';
  else note += obsN + ' наблюдений.';
  let eta = null;
  if (pred.expected_restore_at) {
    const t = new Date(pred.expected_restore_at);
    const now = new Date();
    const diffMin = Math.round((t.getTime() - now.getTime()) / 60000);
    if (diffMin > 0) {
      if (diffMin < 60) eta = 'через ' + diffMin + ' мин';
      else if (diffMin < 1440) eta = 'через ~' + Math.round(diffMin / 60) + ' ч';
      else eta = 'через ~' + Math.round(diffMin / 1440) + ' дн';
    } else eta = 'ожидалось только что';
  }
  return { time: time5(pred.from_time) + ' — ' + time5(pred.to_time), confidence, note, eta };
}

const BRAND_LOGOS = {
  lukoil: 'lukoil.png', rosneft: 'rosneft.png', ufimneft: 'ufimneft.png',
  gazpromneft: 'gazpromneft.png', rusoil: 'rusoil.png', pnb: 'pnb.png',
  tnk: 'tnk.png', export: 'export.png', petrol: 'petrol.png'
};

function brandKey(st) {
  const t = String(st.brand || st.name || '').toLowerCase();
  if (t.includes('лукойл') || t.includes('lukoil')) return 'lukoil';
  if (t.includes('газпром') || t.includes('gazprom')) return 'gazpromneft';
  if (t.includes('роснефть') || t.includes('rosneft')) return 'rosneft';
  if (t.includes('русойл') || t.includes('rusoil')) return 'rusoil';
  if (t.includes('пнб') || t.includes('pnb')) return 'pnb';
  if (t.includes('уфимнефть') || t.includes('ufimneft')) return 'ufimneft';
  if (t.includes('тнк') || t.includes('татнефть') || t.includes('tnk') || t.includes('tatneft')) return 'tnk';
  if (t.includes('экспорт') || t.includes('export')) return 'export';
  if (t.includes('петрол') || t.includes('petrol')) return 'petrol';
  return null;
}

function stationLogo(st) {
  const k = brandKey(st);
  if (!k || !BRAND_LOGOS[k]) return stationEmoji(st);
  return '<img src="' + BRAND_LOGOS[k] + '" alt="" onerror="this.outerHTML=\'' + stationEmoji(st) + '\'">';
}

function stationEmoji(st) {
  const text = String(st.brand || st.name || '').toLowerCase();
  if (text.includes('лукойл')) return '🟥';
  if (text.includes('газпром')) return '🔵';
  if (text.includes('роснефть')) return '🟡';
  if (text.includes('тнк')) return '🟠';
  return '⛽';
}

function getLastObservations() {
  const result = {};
  for (const o of allObservations) {
    if (!result[o.station_id]) result[o.station_id] = o;
  }
  return result;
}

function stationHistory(stationId) {
  return allObservations.filter(o => o.station_id === stationId && o.timestamp)
    .sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
}

function createGraph(stationId) {
  const rows = allHourly.filter(h => h.station_id === stationId)
    .sort((a, b) => new Date(a.hour) - new Date(b.hour)).slice(-14);
  const points = rows.length ? rows : Array.from({ length: 14 }, (_, i) => ({
    hour: new Date(Date.now() - (13 - i) * 3600000).toISOString(), total: 0, available_95: 0
  }));
  const ratios = points.map(p => p.total ? p.available_95 / p.total : 0);
  const max = Math.max(1, ...ratios);
  return points.map((p, index) => {
    const ratio = p.total ? p.available_95 / p.total : 0;
    const height = p.total ? Math.max(6, Math.round(ratio / max * 46)) : 5;
    let cls = 'bar';
    if (p.total && ratio >= .7) cls += ' good';
    if (p.total && ratio <= .3) cls += ' bad';
    if (index === points.length - 1 && p.total) cls += ' current';
    return '<div class="bar-wrap"><div class="' + cls + '" style="height:' + height + 'px"></div></div>';
  }).join('');
}

function recentFeedback(stationId) {
  const items = allFeedback.filter(f => f.station_id === stationId).slice(0,3);
  if (!items.length) return 'Пока отметок нет.';
  const labels = {

  return items.map(f => {
    const date = new Date(f.created_at);

let fbDraft = {};

function fbPick(stationId, type, btn) {
  const panel = btn.closest('.feedback-panel');
  panel.querySelectorAll('.feedback-grid')[0].querySelectorAll('.feedback-option').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');

      ['92', '95', 'diesel', 'all'].map(f =>

  document.getElementById('fb-send-' + stationId).style.display = 'block';
}

function fbChip(stationId, kind, value, btn) {
  btn.closest('.feedback-grid').querySelectorAll('.feedback-option').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  fbDraft[stationId][kind] = value;

async function fbSend(stationId) {
  const d = fbDraft[stationId];
  if (!d) return;
  const key = 'fb_' + stationId;
  const history = JSON.parse(localStorage.getItem(key) || '[]');
  const now = Date.now();
  const recent = history.filter(t => now - t < 30 * 60 * 1000);
  if (recent.length >= 3) { alert('Слишком много отметок. Попробуйте через полчаса.'); return; }
  const comment = (document.getElementById('fb-text-' + stationId).value || '').trim();
  const sendBtn = document.getElementById('fb-send-' + stationId);
  sendBtn.disabled = true;
  const ok = await dbInsert('user_feedback', [{
    station_id: stationId, feedback_type: d.type, fuel_type: d.fuel,
    queue_size: d.queue, comment_text: comment || null, device_id: deviceId
  }]);
  if (!ok) { sendBtn.disabled = false; alert('Не удалось отправить отметку.'); return; }
  recent.push(now);
  localStorage.setItem(key, JSON.stringify(recent));
  allFeedback.unshift({ station_id: stationId, feedback_type: d.type, fuel_type: d.fuel, queue_size: d.queue, created_at: new Date().toISOString() });
  const station = sendBtn.closest('.station');
  const recentElement = station && station.querySelector('.recent');
  if (recentElement) recentElement.textContent = '✓ Спасибо! Ваша отметка учтена в данных.';
  fbDraft[stationId] = null;
  document.getElementById('fb-extra-' + stationId).style.display = 'none';
  document.getElementById('fb-text-' + stationId).style.display = 'none';
  sendBtn.style.display = 'none';
  sendBtn.disabled = false;
  station.querySelectorAll('.feedback-option').forEach(b => b.classList.remove('selected'));
}

function confPercent(obs) {
  if (!obs || obs.data_freshness_minutes === null || obs.data_freshness_minutes === undefined) return null;
  return Math.max(8, Math.round(95 * Math.exp(-obs.data_freshness_minutes / 720)));
}

function fuelConfLine(obs, status) {
  const c = confPercent(obs);
  if (status === null || status === undefined) {
    if (!obs || obs.data_freshness_minutes === null || obs.data_freshness_minutes === undefined) return '—';
    const m = obs.data_freshness_minutes;
    const t = m < 60 ? m + ' мин' : m < 1440 ? Math.round(m / 60) + ' ч' : Math.round(m / 1440) + ' дн';
    return 'отметка ' + t + ' назад';
  }
  return '≈ ' + (status ? c : Math.max(3, 100 - c)) + '%';
}

function lastRestoration(id) {
  const ev = (allEvents || []).filter(e => e.station_id === id)
    .sort((a,b) => new Date(b.detected_at) - new Date(a.detected_at))[0];
  if (!ev || !ev.detected_at) return 'ещё не было';
  const t0 = new Date(ev.detected_at).getTime();
  if (!Number.isFinite(t0)) return 'ещё не было';
  const d = new Date(t0);
  const days = Math.floor((Date.now() - d.getTime()) / 86400000);
  const hh = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  if (days <= 0) return 'сегодня, ' + hh;
  if (days === 1) return 'вчера, ' + hh;
  return days + ' дн назад, ' + hh;
}

function accuracyLabel(id) {
  const v = allPredictions.filter(p => p.station_id === id && p.is_verified);
  if (v.length < 10) return 'мало данных';
  const s = v.filter(p => p.result === 'SUCCESS').length;
  return Math.round(s / v.length * 100) + '%';
}

function isSoon(pred) {
  if (!pred || !pred.from_time) return false;
  const [h, m] = pred.from_time.split(':').map(Number);
  const now = new Date();
  const diff = (h * 60 + m) - (now.getHours() * 60 + now.getMinutes());
  return diff <= 120 && diff >= -60;
}

function fuelLabel(f) {
  return f === '92' ? 'АИ-92' : f === '95' ? 'АИ-95' : f === 'diesel' ? 'дизель' : 'топливо';
}

function pickPrediction(stationId, obs) {
  const preds = allPredictions.filter(p => p.station_id === stationId && p.result === 'PENDING');
  if (!preds.length) return null;
  const missing = [];
  if (obs && obs.fuel_92_status === false) missing.push('92');
  if (obs && obs.fuel_95_status === false) missing.push('95');
  if (obs && obs.diesel_status === false) missing.push('diesel');
  for (const f of missing) {
    const p = preds.find(x => x.fuel_type === f);
    if (p) return p;
  }
  return preds.find(x => x.fuel_type === '95') || preds[0];
}

}

};

function sparkline(stationId) {
  const rows = allHourly.filter(h => h.station_id === stationId)
    .sort((a, b) => new Date(a.hour) - new Date(b.hour)).slice(-24);
  if (rows.length < 2) return '';
  const vals = rows.map(r => r.total ? r.available_95 / r.total : 0);
  const W = 64, H = 22;
  const d = vals.map((v, i) =>
    (i ? 'L' : 'M') + (i / (vals.length - 1) * W).toFixed(1) + ',' + (H - 2 - v * (H - 4)).toFixed(1)
  ).join('');
  const last = vals[vals.length - 1];
  const col = last >= .5 ? '#19b77a' : last > 0 ? '#f5b82e' : '#ef5350';
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '"><path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="1.6" stroke-linecap="round"/></svg>';
}

function rowBadge(pred, obs) {
  if (!pred) return { cls: 'none', text: 'нет окна', sub: 'копим данные для прогноза' };
  const today = new Date(Date.now() + 3 * 3600 * 1000).toISOString().slice(0, 10);
  if (pred.target_date && pred.target_date > today) {
    return { cls: 'soon', text: 'окно завтра', sub: time5(pred.from_time) + '–' + time5(pred.to_time) };
  }
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  const fp = pred.from_time.split(':'), tp = pred.to_time.split(':');
  const f = Number(fp[0]) * 60 + Number(fp[1]), t = Number(tp[0]) * 60 + Number(tp[1]);
  if (mins >= f && mins <= t) return { cls: 'open', text: 'есть окно', sub: 'сейчас выгоднее всего' };
  if (f - mins > 0 && f - mins <= 120) return { cls: 'soon', text: 'скоро будет', sub: 'окно через ~' + (f - mins) + ' мин' };
  if (mins > t) return { cls: 'late', text: 'окно прошло', sub: 'ждём новый прогноз' };
  return { cls: 'soon', text: 'окно в ' + time5(pred.from_time), sub: 'сегодня' };
}

function accuracyShort(id) {
  const v = allPredictions.filter(p => p.station_id === id && p.is_verified);
  if (v.length < 10) return 'мало данных';
  return Math.round(v.filter(p => p.result === 'SUCCESS').length / v.length * 100) + '%';
}

function stationRow(station, obs, pred) {
  const b = rowBadge(pred, obs);
  const color = BRAND_COLORS[brandKey(station)] || '#7c89a0';
  const fuelFocus = pred ? pred.fuel_type : (obs && obs.fuel_95_status === false ? '95' : '95');
  const col = fuelFocus === '92' ? 'fuel_92_status' : fuelFocus === '95' ? 'fuel_95_status' : 'diesel_status';
  const st = obs ? obs[col] : null;
  const stTxt = st === true ? 'есть' : st === false ? 'нет' : 'нет данных';
  const stCls = st === true ? 'yes' : st === false ? 'no' : 'unknown';
  const conf = pred ? Math.round((pred.confidence || 0) * 100) : null;

  return `
    <div class="srow-wrap">
      <button class="srow" onclick="toggleRow('${station.id}', this)">
        <span class="sbar" style="background:${color}"></span>
        <span class="srow-main">
          <span class="srow-top">
            <span class="srow-name">${escapeHtml(station.name || 'АЗС')}</span>
            <span class="sbadge ${b.cls}">${b.text}</span>
          </span>
          <span class="srow-addr">${escapeHtml(station.address || '')}</span>
          <span class="srow-cols">
            <span class="scol">
              <span class="scol-l">факт</span>
              <span class="scol-v ${stCls}">${fuelLabel(fuelFocus)}: ${stTxt}</span>
            </span>
            <span class="scol">
              <span class="scol-l">прогноз</span>
              <span class="scol-v">${pred ? time5(pred.from_time) + '–' + time5(pred.to_time) : '—'}</span>
              ${conf !== null ? '<span class="scol-s">' + conf + '% вероятность</span>' : ''}
            </span>
            <span class="scol scol-r">
              ${sparkline(station.id)}
              <span class="scol-s">${accuracyShort(station.id)}</span>
            </span>
          </span>
          <span class="srow-sub">${b.sub}</span>
        </span>
      </button>
    </div>`;
}

function closeSheet() {
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('sheetBack').classList.remove('open');
}

function ctaDigest() {
  const since = Date.now() - 24 * 3600 * 1000;
  const ev = pulseEv.filter(e => e.t.getTime() > since);
  const rest = ev.filter(e => e.type === 'fuel_restored').length;
  const dis = ev.filter(e => e.type === 'fuel_disappeared').length;
  const hours = {};
  for (const e of ev) if (e.type === 'queue_appeared') { const h = e.t.getHours(); hours[h] = (hours[h] || 0) + 1; }
  const peak = Object.entries(hours).sort((a, b) => b[1] - a[1])[0];
  document.getElementById('sheetBody').innerHTML =
    '<div class="station"><div class="station-header"><div class="station-logo">🌅</div><div class="station-info">' +
    '<div class="station-name">Дайджест за 24 часа</div>' +
    '<div class="station-address">Новороссийск · события города</div></div></div>' +
    '<div class="info-row"><div class="info"><div class="info-label">вернулось</div><div class="info-value">' + rest + '</div></div>' +
    '<div class="info"><div class="info-label">кончилось</div><div class="info-value">' + dis + '</div></div>' +
    '<div class="info"><div class="info-label">пик очередей</div><div class="info-value">' + (peak ? String(peak[0]).padStart(2, '0') + ':00' : '—') + '</div></div></div>' +
    '<div class="recent">Полный дайджест приходит в Telegram каждое утро в 08:00.</div></div>';
  document.getElementById('sheet').classList.add('open');
  document.getElementById('sheetBack').classList.add('open');
}

function renderNow() {
  const title = document.getElementById('nowTitle');
  const sub = document.getElementById('nowSub');
  const cta = document.getElementById('ctaBest');
  if (!title || !allStations.length) return;
  const last = getLastObservations();
  let q = 0, tot = 0, avail = 0, known = 0, deficit = 0;
  let best = null, bestSoon = null;
  const nowM = new Date().getHours() * 60 + new Date().getMinutes();
  for (const s of allStations) {
    if (!localIdsGlobal.includes(s.id)) continue;
    const o = last[s.id];
    if (!o) continue;
    tot++;
    if (o.queue_level === 'high') q++;
    if (o.fuel_95_status === true) { avail++; known++; }
    else if (o.fuel_95_status === false) { known++; deficit++; }
    const p = pickPrediction(s.id, o);
    if (p) {
      const fp = p.from_time.split(':'), tp = p.to_time.split(':');
      const f = Number(fp[0]) * 60 + Number(fp[1]), t = Number(tp[0]) * 60 + Number(tp[1]);
      if (!best && nowM >= f && nowM <= t) best = s;
      if (!bestSoon && f - nowM > 0 && f - nowM <= 180) bestSoon = s;
    }
  }
  const qPct = tot ? Math.round(100 * q / tot) : 0;
  const aPct = known ? Math.round(100 * avail / known) : 0;
  let verdict;
  if (tot && qPct >= 25) verdict = 'Город в очередях';
  else if (known && deficit >= known * 0.5) verdict = 'В городе дефицит топлива';
  else if (qPct <= 6 && aPct >= 40) verdict = 'Сейчас спокойное время заправиться';
  else verdict = 'Ситуация ровная';
  title.textContent = verdict;
  sub.textContent = 'очереди на ' + qPct + '% АЗС · АИ-95 есть на ' + aPct + '% · отслеживаем ' + tot;
  if (cta) {
    const target = best || bestSoon;
    if (target) {
      cta.textContent = '🔮 Куда ехать: ' + (target.name || 'АЗС');
      cta.onclick = () => openSheet(target.id);
    } else {
      cta.textContent = '🔮 Прогнозы созревают';
      cta.onclick = () => document.getElementById('app').scrollTo({ top: 0 });
    }
  }
}

/* =====================================================
   RENDER
===================================================== */
function renderStations(stations, keepOrder) {
  const app = document.getElementById('app');
  const lastObs = getLastObservations();
  if (!stations.length) {
    app.innerHTML = '<div class="empty-search">🔎 Ничего не нашли.<br><br><small>Попробуйте другое название АЗС или адрес.</small></div>';
    return;
  }
  const scored = stations.map(station => {
    const obs = lastObs[station.id];
    const pred = pickPrediction(station.id, obs);
    const freshMin = obs?.data_freshness_minutes;
    const trusted = freshMin !== null && freshMin !== undefined && freshMin <= 360;
    const f95 = trusted ? obs.fuel_95_status : null;
    let score = 1;
    if (pred && f95 === false) score = 4;
    else if (pred) score = 3;
    else if (f95 === true) score = 2;
    return { station, obs, pred, score, freshMin };
  }).sort((a,b) => keepOrder ? 0 :
    (isFavorite(b.station.id) - isFavorite(a.station.id)) ||
    (b.score - a.score) ||
    ((a.freshMin ?? 1e9) - (b.freshMin ?? 1e9)));

  app.innerHTML = scored.map(item => stationRow(item.station, item.obs, item.pred)).join('');
  const lc = document.getElementById('listCount');
  if (lc) lc.textContent = stations.length + ' станций';
  renderNow();
}

   START
===================================================== */
async function start() {
  const app = document.getElementById('app');
  try {
    const stations = await dbQuery('/rest/v1/stations?select=*');
    const ownBox = { lat1: 44.60, lat2: 44.85, lon1: 37.55, lon2: 38.05 };
    const localIds = stations
      .filter(s => s.lat >= ownBox.lat1 && s.lat <= ownBox.lat2 && s.lon >= ownBox.lon1 && s.lon <= ownBox.lon2)
      .map(s => s.id);
    localIdsGlobal = localIds;
    const sinceH = new Date(Date.now() - 24 * 3600 * 1000).toISOString();

    const [observations, counts, predictions, events, feedback, hourly] = await Promise.all([
      dbQuery('/rest/v1/observations?order=timestamp.desc&limit=1000&select=station_id,timestamp,fuel_92_status,fuel_95_status,diesel_status,queue_level,data_freshness_minutes'),
      dbQuery('/rest/v1/station_counts?select=station_id,total'),
      dbQuery('/rest/v1/predictions?select=*'),
      dbQuery('/rest/v1/events?event_type=eq.fuel_restored&order=detected_at.desc&limit=1000&select=station_id,event_type,detected_at'),
      dbQuery('/rest/v1/user_feedback?order=created_at.desc&limit=300'),
      dbQuery('/rest/v1/station_hourly?select=station_id,hour,total,available_95&hour=gte.' + sinceH + '&station_id=in.(' + localIds.map(i => '"' + i + '"').join(',') + ')')
    ]);

    allStations = stations;
    allObservations = observations;
    allCounts = counts;
    allPredictions = predictions;
    allEvents = events;
    allFeedback = feedback;
    allHourly = hourly;

    if (!stations.length) {
      app.innerHTML = '<div class="status">✅ База подключена.<br><small>Но в ней пока нет АЗС.</small></div>';
      return;
    }
    renderStations(stations.filter(s => localIds.includes(s.id)));
  } catch (e) {
    app.innerHTML = '<div class="status">❌ Не удалось загрузить данные<br><br><small>' + escapeHtml(e.message) + '</small></div>';
  }
}

async function sendFeedback(stationId, type, button) {
  const key = 'fb_' + stationId;
  const history = JSON.parse(localStorage.getItem(key) || '[]');
  const now = Date.now();
  const recent = history.filter(t => now - t < 30 * 60 * 1000);
  if (recent.length >= 3) { alert('Слишком много отметок. Попробуйте через полчаса.'); return; }
  button.disabled = true;
  button.classList.add('selected');
  const ok = await dbInsert('user_feedback', [{ station_id: stationId, feedback_type: type, device_id: deviceId }]);
  if (!ok) { button.disabled = false; button.classList.remove('selected'); alert('Не удалось отправить отметку.'); return; }
  recent.push(now);
  localStorage.setItem(key, JSON.stringify(recent));
  allFeedback.unshift({ station_id: stationId, feedback_type: type, created_at: new Date().toISOString() });
  const station = button.closest('.station');
  const recentElement = station?.querySelector('.recent');
  if (recentElement) recentElement.textContent = '✓ Спасибо! Ваша отметка учтена в данных.';
  setTimeout(() => { button.disabled = false; button.classList.remove('selected'); }, 1800);
}

function getFavorites() { return JSON.parse(localStorage.getItem('favorites') || '[]'); }
function isFavorite(id) { return getFavorites().includes(id); }
function toggleFavorite(button) {
  const id = button.dataset.stationId;
  let favs = getFavorites();
  if (favs.includes(id)) { favs = favs.filter(x => x !== id); button.textContent = '♡'; }
  else { favs.push(id); button.textContent = '♥'; }
  localStorage.setItem('favorites', JSON.stringify(favs));
}

function searchStations() {
  const input = document.getElementById('searchInput');
  const query = input.value.trim().toLowerCase();
  if (!query) { renderStations(allStations); return; }
  const filtered = allStations.filter(station => {
    const text = [station.name || '', station.brand || '', station.address || ''].join(' ').toLowerCase();
    return text.includes(query);
  });
  renderStations(filtered);
}

function findNearby() {
  if (!navigator.geolocation) { alert('Ваш браузер не поддерживает определение местоположения.'); return; }
  navigator.geolocation.getCurrentPosition(position => {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;
    const sorted = allStations.map(station => {
      const sLat = Number(station.lat ?? station.latitude);
      const sLon = Number(station.lon ?? station.lng ?? station.longitude);
      if (!Number.isFinite(sLat) || !Number.isFinite(sLon)) return { station, distance: Infinity };
      const dLat = (sLat - lat) * 111;
      const dLon = (sLon - lon) * 111 * Math.cos(lat * Math.PI / 180);
      const distance = Math.sqrt(dLat*dLat + dLon*dLon);
      return { station, distance };
    }).sort((a,b) => a.distance - b.distance).map(x => x.station);
    renderStations(sorted, true);
    document.getElementById('app').scrollTo({ top: 0, behavior: 'smooth' });
  }, () => { alert('Не удалось определить местоположение.'); });
}

document.getElementById('searchInput').addEventListener('keydown', event => {
  if (event.key === 'Enter') searchStations();
});

/* =====================================================
   CITY PULSE
===================================================== */
let pulseRaw = [];
let pulseEv = [];
let pulseRangeH = 24;

async function loadPulse() {
  const since = new Date(Date.now() - 7 * 24 * 3600 * 1000).toISOString();
  const [hourly, events] = await Promise.all([
    dbQuery('/rest/v1/city_hourly?select=hour,marks,queue_marks,avail95,known95&hour=gte.' + since + '&order=hour.asc&limit=1000'),
    dbQuery('/rest/v1/events?select=event_type,detected_at&detected_at=gte.' + since + '&event_type=in.(fuel_disappeared,fuel_restored)&limit=1000')
  ]);
  pulseRaw = hourly.map(h => ({
    t: new Date(h.hour), marks: h.marks,
    queuePct: h.marks ? Math.round(100 * h.queue_marks / h.marks) : 0,
    availPct: h.known95 ? Math.round(100 * h.avail95 / h.known95) : null
  }));
  pulseEv = events.map(e => ({ t: new Date(e.detected_at), type: e.event_type }));
  renderPulse();
}

function pulseRange(r, btn) {
  pulseRangeH = r;
  document.querySelectorAll('.pulse-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPulse();
}

function sameBucket(t, b, isDay) {
  const sameDay = t.getFullYear() === b.t.getFullYear() && t.getMonth() === b.t.getMonth() && t.getDate() === b.t.getDate();
  return isDay ? sameDay : sameDay && t.getHours() === b.t.getHours();
}

function smoothPath(pts) {
  if (pts.length < 2) return '';
  let d = 'M' + pts[0][0] + ',' + pts[0][1];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += 'C' + c1x + ',' + c1y + ',' + c2x + ',' + c2y + ',' + p2[0] + ',' + p2[1];
  }
  return d;
}

function renderPulse() {
  const svg = document.getElementById('pulseSvg');
  const insight = document.getElementById('pulseInsight');
  const kpis = document.getElementById('pulseKpis');
  if (!svg) return;
  const isDay = pulseRangeH !== 24;
  let buckets = [];

  if (!isDay) {
    buckets = pulseRaw.slice(-24).map(r => ({ ...r, label: String(r.t.getHours()).padStart(2, '0') + ':00' }));
  } else {
    const byDay = {};
    for (const r of pulseRaw) {
      const k = r.t.getFullYear() + '-' + r.t.getMonth() + '-' + r.t.getDate();
      if (!byDay[k]) byDay[k] = { t: r.t, label: r.t.getDate() + '.' + String(r.t.getMonth() + 1).padStart(2, '0'), marks: 0, q: 0, aSum: 0, aN: 0 };
      byDay[k].marks += r.marks;
      byDay[k].q += r.queuePct * r.marks;
      if (r.availPct !== null) { byDay[k].aSum += r.availPct; byDay[k].aN++; }
    }
    buckets = Object.values(byDay).sort((a, b) => a.t - b.t).map(b => ({
      t: b.t, label: b.label, marks: b.marks,
      queuePct: b.marks ? Math.round(b.q / b.marks) : 0,
      availPct: b.aN ? Math.round(b.aSum / b.aN) : null
    }));
  }

  if (!buckets.length) {
    if (insight) insight.textContent = 'Данных для графика пока мало.';
    svg.innerHTML = '';
    if (kpis) kpis.innerHTML = '';
    const nkQ = document.getElementById('nkQ'); if (nkQ) nkQ.textContent = '—';
    const nkA = document.getElementById('nkA'); if (nkA) nkA.textContent = '—';
    const nkE = document.getElementById('nkE'); if (nkE) nkE.textContent = '—';
    return;
  }

  const W = Math.max(320, Math.round(svg.clientWidth || 640)), H = 240, PADL = 30, PADR = 12, BASE = H - 24, TOP = 26;
  const n = buckets.length;
  const xAt = i => PADL + (W - PADL - PADR) * (n === 1 ? 0.5 : i / (n - 1));
  const yAt = v => BASE - Math.max(0, Math.min(100, v)) / 100 * (BASE - TOP);
  const step = (W - PADL - PADR) / Math.max(1, n - 1);

  const qPts = [], aPts = [];
  buckets.forEach((b, i) => {
    const x = xAt(i);
    qPts.push([x, yAt(b.queuePct)]);
    if (b.availPct !== null) aPts.push([x, yAt(b.availPct)]);
  });

  const qLine = smoothPath(qPts);
  const qArea = qLine ? qLine + 'L' + qPts[qPts.length - 1][0] + ',' + BASE + 'L' + qPts[0][0] + ',' + BASE + 'Z' : '';
  const aLine = smoothPath(aPts);
  const aArea = aLine ? aLine + 'L' + aPts[aPts.length - 1][0] + ',' + BASE + 'L' + aPts[0][0] + ',' + BASE + 'Z' : '';

  let grid = '';
  [0, 25, 50, 75, 100].forEach(v => {
    const y = yAt(v);
    grid += '<line x1="' + PADL + '" y1="' + y + '" x2="' + (W - PADR) + '" y2="' + y + '" stroke="#eef1f7"/>' +
            '<text x="' + (PADL - 7) + '" y="' + (y + 3) + '" font-size="8" fill="#9aa7bd" text-anchor="end">' + v + '</text>';
  });

  let bands = '';
  buckets.forEach((b, i) => {
    const x = xAt(i);
    const dis = pulseEv.filter(e => e.type === 'fuel_disappeared' && sameBucket(e.t, b, isDay)).length;
    const res = pulseEv.filter(e => e.type === 'fuel_restored' && sameBucket(e.t, b, isDay)).length;
    const w = step * 0.7;
    if (dis && res) {
      bands += '<rect x="' + (x - w / 2) + '" y="' + TOP + '" width="' + (w / 2) + '" height="' + (BASE - TOP) + '" fill="url(#bandR)"/>';
      bands += '<rect x="' + x + '" y="' + TOP + '" width="' + (w / 2) + '" height="' + (BASE - TOP) + '" fill="url(#bandG)"/>';
    } else if (dis) {
      bands += '<rect x="' + (x - w / 2) + '" y="' + TOP + '" width="' + w + '" height="' + (BASE - TOP) + '" fill="url(#bandR)"/>';
    } else if (res) {
      bands += '<rect x="' + (x - w / 2) + '" y="' + TOP + '" width="' + w + '" height="' + (BASE - TOP) + '" fill="url(#bandG)"/>';
    }
  });

  let nowG = '';
  const nowI = buckets.findIndex(b => sameBucket(new Date(), b, isDay));
  if (nowI >= 0) {
    const x = xAt(nowI), y = qPts[nowI][1];
    const px = Math.min(W - PADR - 34, Math.max(PADL + 34, x));
    nowG =
      '<line x1="' + x + '" y1="' + TOP + '" x2="' + x + '" y2="' + BASE + '" stroke="url(#gnow)" stroke-width="1.4"/>' +
      '<circle class="now-halo" cx="' + x + '" cy="' + y + '" r="8" fill="rgba(124,109,255,.18)"/>' +
      '<circle cx="' + x + '" cy="' + y + '" r="4.5" fill="#7c6dff" stroke="#fff" stroke-width="2"/>' +
      '<rect x="' + (px - 31) + '" y="' + (TOP - 17) + '" width="62" height="18" rx="9" fill="#fff" stroke="#e3e9f4"/>' +
      '<text x="' + px + '" y="' + (TOP - 4) + '" font-size="9" font-weight="800" fill="#2465ee" text-anchor="middle" letter-spacing="1">СЕЙЧАС</text>';
  }

  let axis = '';
  buckets.forEach((b, i) => {
    if (isDay || b.t.getHours() % 6 === 0) axis += '<text x="' + xAt(i) + '" y="' + (H - 6) + '" font-size="9" fill="#9aa7bd" text-anchor="middle">' + b.label + '</text>';
  });

  let hits = '';
  buckets.forEach((b, i) => {
    hits += '<rect data-i="' + i + '" x="' + (xAt(i) - step / 2) + '" y="0" width="' + step + '" height="' + H + '" fill="transparent"/>';
  });

  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.innerHTML =
    '<defs>' +
      '<linearGradient id="gq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c6dff" stop-opacity=".28"/><stop offset="1" stop-color="#7c6dff" stop-opacity="0"/></linearGradient>' +
      '<linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#19b77a" stop-opacity=".20"/><stop offset="1" stop-color="#19b77a" stop-opacity="0"/></linearGradient>' +
      '<linearGradient id="gnow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(124,109,255,.85)"/><stop offset="1" stop-color="rgba(124,109,255,0)"/></linearGradient>' +
      '<linearGradient id="bandR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(239,83,80,.22)"/><stop offset="1" stop-color="rgba(239,83,80,.03)"/></linearGradient>' +
      '<linearGradient id="bandG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(25,183,122,.22)"/><stop offset="1" stop-color="rgba(25,183,122,.03)"/></linearGradient>' +
      '<filter id="softQ" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7c6dff" flood-opacity=".22"/></filter>' +
      '<filter id="softA" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#19b77a" flood-opacity=".20"/></filter>' +
    '</defs>' +
    bands + grid +
    (qArea ? '<path class="pulse-area" d="' + qArea + '" fill="url(#gq)"/>' : '') +
    (aArea ? '<path class="pulse-area" d="' + aArea + '" fill="url(#ga)"/>' : '') +
    (qLine ? '<path class="pulse-line" pathLength="1" d="' + qLine + '" fill="none" stroke="#7c6dff" stroke-width="2.4" stroke-linecap="round" filter="url(#softQ)"/>' : '') +
    (aLine ? '<path class="pulse-line" pathLength="1" d="' + aLine + '" fill="none" stroke="#19b77a" stroke-width="2.2" stroke-linecap="round" filter="url(#softA)"/>' : '') +
    nowG + axis + hits;

  svg.onclick = e => {
    const i = e.target && e.target.dataset ? Number(e.target.dataset.i) : NaN;
    const tip = document.getElementById('pulseTip');
    if (!Number.isFinite(i) || !buckets[i]) { tip.style.opacity = 0; return; }
    const b = buckets[i];
    const box = svg.getBoundingClientRect();
    tip.style.left = (xAt(i) / W * box.width) + 'px';
    tip.style.top = (qPts[i][1] / H * box.height) + 'px';
    tip.innerHTML = '<b>' + b.label + '</b><br>очереди: ' + b.queuePct + '% АЗС<br>АИ-95: ' + (b.availPct === null ? 'нет данных' : b.availPct + '%') + '<br>отметок: ' + b.marks;
    tip.style.opacity = 1;
  };

  const lastB = buckets[buckets.length - 1], prevB = buckets[buckets.length - 2];
  const ev24 = pulseEv.filter(e => Date.now() - e.t.getTime() < 24 * 3600 * 1000).length;
  const qTrend = prevB ? lastB.queuePct - prevB.queuePct : 0;
  if (kpis) kpis.innerHTML =
    '<div class="pulse-kpi"><div class="pulse-kpi-label">очереди сейчас</div><div class="pulse-kpi-value">' + lastB.queuePct + '% <small>' + (qTrend > 0 ? '↑' : qTrend < 0 ? '↓' : '→') + '</small></div></div>' +
    '<div class="pulse-kpi"><div class="pulse-kpi-label">АИ-95 в городе</div><div class="pulse-kpi-value">' + (lastB.availPct === null ? '—' : lastB.availPct + '%') + '</div></div>' +
    '<div class="pulse-kpi"><div class="pulse-kpi-label">события · 24 ч</div><div class="pulse-kpi-value">' + ev24 + '</div></div>';

  const nkQ = document.getElementById('nkQ'); if (nkQ) nkQ.textContent = lastB.queuePct + '%';
  const nkA = document.getElementById('nkA'); if (nkA) nkA.textContent = lastB.availPct === null ? '—' : lastB.availPct + '%';
  const nkE = document.getElementById('nkE'); if (nkE) nkE.textContent = ev24;

  const wm = buckets.filter(b => b.marks > 0);
  if (wm.length) {
    const peak = wm.reduce((a, b) => b.queuePct > a.queuePct ? b : a);
    const kn = wm.filter(b => b.availPct !== null);
    const low = kn.length ? kn.reduce((a, b) => b.availPct < a.availPct ? b : a) : null;
    let txt = '🚗 Пик очередей: ' + peak.label + ' (' + peak.queuePct + '% АЗС).';
    if (low) txt += ' ⛽ Реже всего АИ-95: ' + low.label + ' (' + low.availPct + '%).';
    txt += ' По ' + pulseRaw.reduce((s, r) => s + r.marks, 0) + ' отметкам за 7 дней.';
    if (insight) insight.textContent = txt;
  } else if (insight) insight.textContent = 'Данных для выводов пока мало.';
}

start();
loadPulse().catch(e => console.log('pulse: ' + e.message));

let pulseResizeTick = false;
window.addEventListener('resize', () => {
  if (pulseResizeTick) return;
  pulseResizeTick = true;
  setTimeout(() => { pulseResizeTick = false; renderPulse(); }, 200);
});

</script>

</body>
</html>
