<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Когда лучше заправиться?</title>
<style>
  body { font-family: Arial, sans-serif; background: linear-gradient(135deg,#667eea,#764ba2); min-height:100vh; padding:16px; color:#333; }
  h1 { color:#fff; text-align:center; }
  .sub { color:#eee; text-align:center; margin-bottom:20px; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 4px 10px rgba(0,0,0,.15); }
  .name { font-size:18px; font-weight:700; }
  .brand { color:#777; font-size:13px; margin-bottom:10px; }
  .fuels { display:flex; gap:8px; margin-bottom:10px; }
  .fuel { flex:1; text-align:center; background:#f5f5f7; border-radius:8px; padding:8px 4px; font-size:13px; }
  .yes { color:#0a8f4d; font-weight:700; }
  .no { color:#d33; font-weight:700; }
  .pred { background:#eef6ff; border:1px solid #bcd7ff; border-radius:8px; padding:10px; font-size:14px; }
  .status { color:#fff; text-align:center; padding:14px; background:rgba(0,0,0,.25); border-radius:10px; }
</style>
</head>
<body>
<h1>⛽ Когда лучше заправиться?</h1>
<p class="sub">Прогноз наличия топлива по истории наблюдений</p>
<div id="app"><div class="status">⏳ Подключаюсь к базе данных...</div></div>

<script>
// ===== НАСТРОЙКИ (твои ключи уже вставлены) =====
const SUPABASE_URL = 'https://tiargqbjtraqaooxjafy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpYXJncWJqdHJhcWFvb3hqYWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzOTQ2NjYsImV4cCI6MjEwNDk3MDY2Nn0.eVra5X-9Y3aoQJsZf1uPn9D1m14A3GsiIC5QPa-o31E';

// Запрос к базе БЕЗ внешних библиотек
async function dbQuery(table) {
  const response = await fetch(SUPABASE_URL + '/rest/v1/' + table + '?select=*', {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY
    }
  });
  if (!response.ok) {
    const text = await response.text();
    throw new Error('HTTP ' + response.status + ' → ' + text);
  }
  return response.json();
}

function fuelHtml(ok) {
  return ok ? '<span class="yes">✓ есть</span>' : '<span class="no">✗ нет</span>';
}

async function start() {
  const app = document.getElementById('app');
  try {
    const stations = await dbQuery('stations');
    const observations = await dbQuery('observations');
    const predictions = await dbQuery('predictions');

    if (stations.length === 0) {
      app.innerHTML = '<div class="status">✅ Подключение работает! Но в базе пока нет ни одной АЗС.</div>';
      return;
    }

    let html = '';
    for (const st of stations) {
      const obs = observations
        .filter(o => o.station_id === st.id)
        .sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp))[0];
      const pred = predictions.find(p => p.station_id === st.id && p.fuel_type === '95');

      html += '<div class="card">';
      html += '<div class="name">' + st.name + '</div>';
      html += '<div class="brand">' + (st.brand || 'АЗС') + ' · ' + (st.address || '') + '</div>';
      html += '<div class="fuels">';
      html += '<div class="fuel">АИ-92<br>' + (obs ? fuelHtml(obs.fuel_92_status) : '—') + '</div>';
      html += '<div class="fuel">АИ-95<br>' + (obs ? fuelHtml(obs.fuel_95_status) : '—') + '</div>';
      html += '<div class="fuel">Дизель<br>' + (obs ? fuelHtml(obs.diesel_status) : '—') + '</div>';
      html += '</div>';
      if (pred) {
        html += '<div class="pred">🔮 Пополнение АИ-95: <b>' + pred.from_time.substring(0,5) + ' – ' + pred.to_time.substring(0,5) + '</b><br>🎯 Надёжность: <b>' + Math.round(pred.confidence*100) + '%</b> · наблюдений: ' + (pred.based_on_observations||0) + '</div>';
      } else {
        html += '<div class="pred">⚠️ Пока мало данных для прогноза</div>';
      }
      html += '</div>';
    }
    app.innerHTML = html;
  } catch (e) {
    app.innerHTML = '<div class="status">❌ Ошибка: ' + e.message + '</div>';
  }
}

start();
</script>
</body>
</html>
