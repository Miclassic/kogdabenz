<!DOCTYPE html>
<html lang="ru">
<head>

<style>

:root {
  --bg: #f6f8fd;

  --text: #14213d;

* {

}

html {

}

body {

========================= */

/* =========================

/* =========================

/* =========================

.no {

/* =========================

========================= */

.forecast {

}

.forecast::after {

.forecast-title {

/* =========================

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =

const SUPABASE_KEY =
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpYXJncWJqdHJhcWFvb3hqYWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzOTQ2NjYsImV4cCI6MjEwNDk3MDY2Nn0.eVra5X-9Y3aoQJsZf1uPn9D1m14A3GsiIC5QPa-o31E';


/* =====================================================
   DEVICE ID
===================================================== */

let deviceId =
  localStorage.getItem('deviceId');

if (!deviceId) {

  deviceId =
    'dev_' +
    Math.random()
      .toString(36)
      .slice(2) +
    Date.now()
      .toString(36);

  localStorage.setItem(
    'deviceId',
    deviceId
  );
}


/* =====================================================
   LOCAL DATA
===================================================== */

let allStations = [];
let allObservations = [];
let allPredictions = [];
let allFeedback = [];


/* =====================================================
   DATABASE
===================================================== */

async function dbQuery(path) {

  const r =
    await fetch(
      SUPABASE_URL + path,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization:
            'Bearer ' + SUPABASE_KEY
        }
      }
    );

  if (!r.ok) {
    throw new Error(
      'HTTP ' + r.status
    );
  }

  return r.json();
}


async function dbInsert(
  table,
  rows
) {

  const r =
    await fetch(
      SUPABASE_URL +
      '/rest/v1/' +
      table,
      {
        method: 'POST',

        headers: {
          apikey: SUPABASE_KEY,

          Authorization:
            'Bearer ' +
            SUPABASE_KEY,

          'Content-Type':
            'application/json',

          Prefer:
            'return=minimal'
        },

        body:
          JSON.stringify(rows)
      }
    );

  return r.ok;
}


/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}


function fuelHtml(ok) {

  if (
    ok === null ||
    ok === undefined
  ) {

    return `
      <span class="unknown">
        <span class="dot gray"></span>
        нет данных
      </span>
    `;
  }

  if (ok) {

    return `
      <span class="yes">
        <span class="dot green"></span>
        есть
      </span>
    `;

  }

  return `
    <span class="no">
      <span class="dot red"></span>
      нет
    </span>
  `;
}


function freshnessText(obs) {

  if (
    obs &&
    obs.data_freshness_minutes !== null &&
    obs.data_freshness_minutes !== undefined
  ) {
    const m = obs.data_freshness_minutes;
    if (m < 1) return 'только что';
    if (m < 60) return m + ' мин назад';
    if (m < 1440) return Math.round(m / 60) + ' ч назад';
    return Math.round(m / 1440) + ' дн назад';
  }

  if (
    !obs ||
    !obs.timestamp
  ) {
    return 'нет данных';
  }

  const t =
    new Date(
      obs.timestamp
    ).getTime();

  if (!Number.isFinite(t)) {
    return 'нет данных';
  }

  const min =
    Math.max(
      0,
      Math.round(
        (Date.now() - t) /
        60000
      )
    );

  if (min < 1) {
    return 'только что';
  }

  if (min < 60) {
    return min + ' мин назад';
  }

  if (min < 1440) {
    return (
      Math.round(min / 60) +
      ' ч назад'
    );
  }

  return (
    Math.round(min / 1440) +
    ' дн назад'
  );
}


function time5(value) {

  if (!value) {
    return '—';
  }

  const s =
    String(value);

  return s.length >= 5
    ? s.substring(0,5)
    : s;
}


/* =====================================================
   PREDICTION
===================================================== */

function getPrediction(pred) {

  if (!pred) {

    return {
      time: 'Пока нет прогноза',

      confidence: 0,

      note:
        'Нужно больше наблюдений, чтобы понять ритм этой АЗС.'
    };
  }

  const confidence =
    Math.max(
      0,
      Math.min(
        100,
        Math.round(
          (pred.confidence || 0) * 100
        )
      )
    );

  return {

    time:
      time5(pred.from_time) +
      ' — ' +
      time5(pred.to_time),

    confidence,

    note:
      'Расчёт основан на ' +
      (pred.based_on_observations || 0) +
      ' наблюдениях.'
  };
}


/* =====================================================
   STATION ICON
===================================================== */

function stationEmoji(st) {

  const text =
    String(
      st.brand ||
      st.name ||
      ''
    ).toLowerCase();

  if (
    text.includes('лукойл')
  ) {
    return '🟥';
  }

  if (
    text.includes('газпром')
  ) {
    return '🔵';
  }

  if (
    text.includes('роснефть')
  ) {
    return '🟡';
  }

  if (
    text.includes('тнк')
  ) {
    return '🟠';
  }

  return '⛽';
}


/* =====================================================
   LAST OBSERVATION
===================================================== */

function getLastObservations() {

  const result = {};

  for (
    const o of allObservations
  ) {

    if (
      !result[o.station_id]
    ) {

      result[o.station_id] = o;

    }

  }

  return result;
}


/* =====================================================
   HISTORY
===================================================== */

function stationHistory(
  stationId
) {

  return allObservations
    .filter(
      o =>
        o.station_id === stationId &&
        o.timestamp
    )
    .sort(
      (a,b) =>
        new Date(a.timestamp) -
        new Date(b.timestamp)
    );
}


/* =====================================================
   GRAPH
===================================================== */

function createGraph(
  stationId
) {

  const history =
    stationHistory(
      stationId
    );

  const hours = {};

  for (
    const obs of history
  ) {

    const date =
      new Date(
        obs.timestamp
      );

    const key =
      date.getFullYear() +
      '-' +
      String(
        date.getMonth()+1
      ).padStart(2,'0') +
      '-' +
      String(
        date.getDate()
      ).padStart(2,'0') +
      '-' +
      String(
        date.getHours()
      ).padStart(2,'0');

    if (!hours[key]) {

      hours[key] = {

        hour:
          date.getHours(),

        available: 0,

        total: 0,

        timestamp:
          date.getTime()

      };

    }

    hours[key].total++;

    if (
      obs.fuel_95_status === true
    ) {

      hours[key].available++;

    }

  }


  let points =
    Object.values(hours)
      .sort(
        (a,b) =>
          a.timestamp -
          b.timestamp
      )
      .slice(-12);


  /*
    Если истории пока мало,
    создаём визуальные пустые точки.
  */

  if (
    points.length === 0
  ) {

    points =
      Array
        .from(
          {length:12},
          (_,i) => ({

            hour:
              (i + 9) % 24,

            available: 0,

            total: 0,

            timestamp: 0

          })
        );

  }


  const ratios =
    points.map(
      p =>
        p.total
          ? p.available / p.total
          : 0
    );


  const max =
    Math.max(
      1,
      ...ratios
    );


  return points
    .map(
      (p,index) => {

        const ratio =
          p.total
            ? p.available /
              p.total
            : 0;

        const height =
          p.total
            ? Math.max(
                10,
                Math.round(
                  ratio /
                  max *
                  82
                )
              )
            : 7;

        let cls =
          'bar';

        if (
          p.total &&
          ratio >= .7
        ) {
          cls +=
            ' good';
        }

        if (
          p.total &&
          ratio <= .3
        ) {
          cls +=
            ' bad';
        }

        if (
          index ===
          points.length - 1
        ) {
          cls +=
            ' current';
        }


        return `

          <div class="bar-wrap">

            <div
              class="${cls}"
              style="
                height:${height}px
              "
            ></div>

            <div class="bar-time">
              ${String(
                p.hour
              ).padStart(2,'0')}:00
            </div>

          </div>

        `;

      }
    )
    .join('');
}


/* =====================================================
   RECENT FEEDBACK
===================================================== */

function recentFeedback(
  stationId
) {

  const items =
    allFeedback
      .filter(
        f =>
          f.station_id ===
          stationId
      )
      .slice(0,3);


  if (!items.length) {

    return 'Пока отметок нет.';

  }


  const labels = {

    delivery:
      '🚚 Привезли',

    available:
      '⛽ Топливо было',

    unavailable:
      '🔴 Топлива не было',

    queue:
      '🚗 Была очередь',

    free:
      '🟢 Было свободно'

  };


  return items
    .map(
      f => {

        const date =
          new Date(
            f.created_at
          );

        const minutes =
          Math.max(
            0,
            Math.round(
              (
                Date.now() -
                date.getTime()
              ) /
              60000
            )
          );

        const ago =
          minutes < 60
            ? minutes + ' мин'
            : Math.round(
                minutes / 60
              ) + ' ч';


        return (
          labels[
            f.feedback_type
          ] ||
          'Отметка'
        ) +
        ' · ' +
        ago +
        ' назад';

      }
    )
    .join('  ·  ');
}

/* =====================================================
   RENDER
===================================================== */

function renderStations(
  stations,
  keepOrder
) {

  const app =
    document.getElementById(
      'app'
    );


  const lastObs =
    getLastObservations();


  if (!stations.length) {

    app.innerHTML = `

      <div class="empty-search">

        🔎 Ничего не нашли.

        <br><br>

        <small>
          Попробуйте другое название
          АЗС или адрес.
        </small>

      </div>

    `;

    return;

  }


  const scored =
    stations
      .map(
        station => {

          const obs =
            lastObs[
              station.id
            ];


          const pred =
            allPredictions.find(
              p =>
                p.station_id ===
                  station.id &&
                p.fuel_type ===
                  '95' &&
                p.result ===
                  'PENDING'
            );


          /*
            Приоритет:
            1. Нет АИ-95 + есть прогноз
            2. Есть АИ-95 + есть прогноз
            3. Просто есть топливо
            4. Остальные
          */

          let score = 1;


          if (
            pred &&
            obs?.fuel_95_status ===
              false
          ) {

            score = 4;

          } else if (
            pred
          ) {

            score = 3;

          } else if (
            obs?.fuel_95_status ===
              true
          ) {

            score = 2;

          }


          return {
            station,
            obs,
            pred,
            score
          };

        }
      )
      .sort(
        (a,b) =>
          keepOrder
            ? 0
            : (isFavorite(b.station.id) -
               isFavorite(a.station.id)) ||
              (b.score - a.score)
      );


  app.innerHTML =
    scored
      .map(
        item =>
          stationCard(
            item.station,
            item.obs,
            item.pred
          )
      )
      .join('');

}


/* =====================================================
   START
===================================================== */

async function start() {

  const app =
    document.getElementById(
      'app'
    );


  try {

    const [
      stations,
      observations,
      predictions,
      feedback
    ] =
      await Promise.all([

        dbQuery(
          '/rest/v1/stations?select=*'
        ),

        dbQuery(
          '/rest/v1/observations?order=timestamp.desc&limit=3000'
        ),

        dbQuery(
          '/rest/v1/predictions?result=eq.PENDING&select=*'
        ),

        dbQuery(
          '/rest/v1/user_feedback?order=created_at.desc&limit=300'
        )

      ]);


    allStations =
      stations;

    allObservations =
      observations;

    allPredictions =
      predictions;

    allFeedback =
      feedback;


    if (
      !stations.length
    ) {

      app.innerHTML = `

        <div class="status">

          ✅ База подключена.

          <br>

          <small>
            Но в ней пока нет АЗС.
          </small>

        </div>

      `;

      return;

    }


    renderStations(
      stations
    );


  } catch(e) {

    app.innerHTML = `

      <div class="status">

        ❌ Не удалось загрузить данные

        <br><br>

        <small>
          ${escapeHtml(
            e.message
          )}
        </small>

      </div>

    `;

  }

}


/* =====================================================
   FEEDBACK OPEN/CLOSE
===================================================== */

function toggleFeedback(
  stationId
) {

  const panel =
    document.getElementById(
      'feedback-' +
      stationId
    );


  if (!panel) {
    return;
  }


  panel.classList.toggle(
    'open'
  );

}


/* =====================================================
   SEND FEEDBACK
===================================================== */

async function sendFeedback(
  stationId,
  type,
  button
) {

  /*
    Антиспам:
    максимум 3 отметки
    за 30 минут на одну АЗС.
  */

  const key =
    'fb_' +
    stationId;


  const history =
    JSON.parse(
      localStorage.getItem(
        key
      ) || '[]'
    );


  const now =
    Date.now();


  const recent =
    history.filter(
      t =>
        now - t <
        30 * 60 * 1000
    );


  if (
    recent.length >= 3
  ) {

    alert(
      'Слишком много отметок. Попробуйте через полчаса.'
    );

    return;

  }


  button.disabled =
    true;

  button.classList.add(
    'selected'
  );


  const ok =
    await dbInsert(
      'user_feedback',
      [
        {
          station_id:
            stationId,

          feedback_type:
            type,

          device_id:
            deviceId
        }
      ]
    );


  if (!ok) {

    button.disabled =
      false;

    button.classList.remove(
      'selected'
    );

    alert(
      'Не удалось отправить отметку.'
    );

    return;

  }


  recent.push(
    now
  );


  localStorage.setItem(
    key,
    JSON.stringify(
      recent
    )
  );


  allFeedback.unshift({

    station_id:
      stationId,

    feedback_type:
      type,

    created_at:
      new Date()
        .toISOString()

  });


  const station =
    button.closest(
      '.station'
    );


  const recentElement =
    station
      ?.querySelector(
        '.recent'
      );


  if (
    recentElement
  ) {

    recentElement.textContent =
      '✓ Спасибо! Ваша отметка учтена в данных.';

  }


  setTimeout(
    () => {

      button.disabled =
        false;

      button.classList.remove(
        'selected'
      );

    },
    1800
  );

}


/* =====================================================
   FAVORITE
===================================================== */

function getFavorites() {
  return JSON.parse(
    localStorage.getItem('favorites') || '[]'
  );
}

function isFavorite(id) {
  return getFavorites().includes(id);
}

function toggleFavorite(
  button
) {
  const id = button.dataset.stationId;
  let favs = getFavorites();

  if (favs.includes(id)) {
    favs = favs.filter(x => x !== id);
    button.textContent = '♡';
  } else {
    favs.push(id);
    button.textContent = '♥';
  }

  localStorage.setItem(
    'favorites',
    JSON.stringify(favs)
  );
}


/* =====================================================
   SEARCH
===================================================== */

function searchStations() {

  const input =
    document.getElementById(
      'searchInput'
    );


  const query =
    input.value
      .trim()
      .toLowerCase();


  if (!query) {

    renderStations(
      allStations
    );

    return;

  }


  const filtered =
    allStations.filter(
      station => {

        const text =
          [
            station.name || '',
            station.brand || '',
            station.address || ''
          ]
          .join(' ')
          .toLowerCase();


        return text.includes(
          query
        );

      }
    );


  renderStations(
    filtered
  );

}


/* =====================================================
   LOCATION
===================================================== */

function findNearby() {

  if (
    !navigator.geolocation
  ) {

    alert(
      'Ваш браузер не поддерживает определение местоположения.'
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    position => {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;


      const sorted =
        allStations
          .map(
            station => {

              const sLat =
                Number(
                  station.lat ??
                  station.latitude
                );


              const sLon =
                Number(
                  station.lon ??
                  station.lng ??
                  station.longitude
                );


              if (
                !Number.isFinite(
                  sLat
                ) ||
                !Number.isFinite(
                  sLon
                )
              ) {

                return {
                  station,
                  distance:
                    Infinity
                };

              }


              const dLat =
                (
                  sLat -
                  lat
                ) * 111;


              const dLon =
                (
                  sLon -
                  lon
                ) *
                111 *
                Math.cos(
                  lat *
                  Math.PI /
                  180
                );


              const distance =
                Math.sqrt(
                  dLat*dLat +
                  dLon*dLon
                );


              return {
                station,
                distance
              };

            }
          )
          .sort(
            (a,b) =>
              a.distance -
              b.distance
          )
          .map(
            x =>
              x.station
          );


      renderStations(
        sorted,
        true
      );


      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });

    },

    () => {

      alert(
        'Не удалось определить местоположение.'
      );

    }

  );

}


/* =====================================================
   ENTER SEARCH
===================================================== */

document
  .getElementById(
    'searchInput'
  )
  .addEventListener(
    'keydown',
    event => {

      if (
        event.key ===
        'Enter'
      ) {

        searchStations();

    }
  );
