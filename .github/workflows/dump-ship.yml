name: dump-ship

on:
  workflow_dispatch:

jobs:
  dump-and-ship:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: pg_dump via Supavisor session mode
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          docker run --rm \
            -v "$PWD:/out" \
            -e PGPASSWORD \
            postgres:17 \
            pg_dump -v --format=custom --no-owner --no-privileges --schema=public \
            "postgresql://postgres.tiargqbjtraqaooxjafy@aws-1-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require&connect_timeout=20" \
            -f /out/kb.dump
          ls -l kb.dump

      - name: scp dump to VPS and verify
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 89.111.154.103 >> ~/.ssh/known_hosts 2>/dev/null
          scp -o ConnectTimeout=20 kb.dump root@89.111.154.103:/tmp/kb.dump
          ssh -o ConnectTimeout=20 root@89.111.154.103 \
            'ls -l /tmp/kb.dump && pg_restore --list /tmp/kb.dump | head -25'
