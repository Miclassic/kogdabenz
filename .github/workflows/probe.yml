name: probe

on:
  workflow_dispatch:
    inputs:
      dump:
        description: 'Дамп ключей одной станции (--dump)'
        type: boolean
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run probe (dump keys)
        if: ${{ github.event.inputs.dump == 'true' }}
        run: node probe.js --dump
      - name: Run probe (coverage)
        if: ${{ github.event.inputs.dump != 'true' }}
        run: node probe.js
