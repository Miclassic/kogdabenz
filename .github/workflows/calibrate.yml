name: calibrate
on:
  schedule:
    - cron: '25 23 * * *'   # 02:25 по Москве (23:25 UTC) — сразу после верификатора 02:10 MSK
  workflow_dispatch:
jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Калибровка уверенности
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node calibrator.js
