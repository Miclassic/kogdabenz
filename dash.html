<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КогдаБенз · Аналитика</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --primary: #3b82f6;
    --primary-dark: #2563eb;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --text-tertiary: #94a3b8;
    --bg-primary: #f8fafc;
    --bg-card: #ffffff;
    --border: #e2e8f0;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
  }

  .header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text-primary);
  }

  .header .subtitle {
    color: var(--text-secondary);
    font-size: 14px;
    margin-top: 4px;
  }

  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: #f1f5f9;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .header-badge::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* KPI Cards */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .kpi-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s;
  }

  .kpi-card:hover {
    box-shadow: var(--shadow);
    transform: translateY(-2px);
  }

  .kpi-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .kpi-value {
    font-size: 32px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -1px;
    margin-bottom: 8px;
  }

  .kpi-change {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 6px;
  }

  .kpi-change.positive {
    background: #d1fae5;
    color: #065f46;
  }

  .kpi-change.negative {
    background: #fee2e2;
    color: #991b1b;
  }

  .kpi-change.neutral {
    background: #f1f5f9;
    color: var(--text-secondary);
  }

  .kpi-subtitle {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-top: 8px;
  }

  /* Section */
  .section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-sm);
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-icon {
    font-size: 20px;
  }

  /* Chart Container */
  .chart-container {
    position: relative;
    width: 100%;
    height: 300px;
    margin: 16px 0;
  }

  .chart-svg {
    width: 100%;
    height: 100%;
  }

  .chart-axis {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 8px;
    padding: 0 4px;
  }

  /* Bar Chart */
  .bar-chart {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .bar-item {
    display: grid;
    grid-template-columns: 200px 1fr 80px;
    gap: 12px;
    align-items: center;
  }

  .bar-label {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .bar-track {
    height: 32px;
    background: #f1f5f9;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
  }

  .bar-fill {
    height: 100%;
    border-radius: 8px;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }

  .bar-fill.primary {
    background: linear-gradient(90deg, #3b82f6, #60a5fa);
  }

  .bar-fill.success {
    background: linear-gradient(90deg, #10b981, #34d399);
  }

  .bar-fill.warning {
    background: linear-gradient(90deg, #f59e0b, #fbbf24);
  }

  .bar-value {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    text-align: right;
  }

  /* Table */
  .data-table {
    width: 100%;
    border-collapse: collapse;
  }

  .data-table th {
    text-align: left;
    padding: 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 2px solid var(--border);
  }

  .data-table td {
    padding: 12px;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
  }

  .data-table tr:last-child td {
    border-bottom: none;
  }

  .data-table tr:hover {
    background: #f8fafc;
  }

  /* Badge */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
  }

  .badge-primary {
    background: #dbeafe;
    color: #1e40af;
  }

  .badge-success {
    background: #d1fae5;
    color: #065f46;
  }

  .badge-warning {
    background: #fef3c7;
    color: #92400e;
  }

  /* Note */
  .note {
    margin-top: 16px;
    padding: 12px;
    background: #f8fafc;
    border-left: 3px solid var(--primary);
    border-radius: 6px;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  /* Error */
  .error {
    padding: 24px;
    background: #fee2e2;
    border: 1px solid #fecaca;
    border-radius: 12px;
    color: #991b1b;
    font-weight: 600;
    text-align: center;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .container { padding: 16px; }
    .header h1 { font-size: 24px; }
    .kpi-grid { grid-template-columns: 1fr; }
    .bar-item { grid-template-columns: 140px 1fr 60px; }
    .bar-label { font-size: 13px; }
    .section { padding: 16px; }
  }

  /* Loading */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px;
    color: var(--text-secondary);
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #e2e8f0;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-right: 12px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>⛽ КогдаБенз · Аналитика</h1>
      <div class="subtitle">Анонимная статистика использования сайта</div>
    </div>
    <div class="header-badge">Обновлено только что</div>
  </div>

  <div id="app">
    <div class="loading">
      <div class="spinner"></div>
      <span>Загрузка данных...</span>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://api.kogdabenz.ru';
const SUPABASE_KEY = 'eyJhbGciOiAiSFMyNTYiLCAidHlwIjogIkpXVCJ9.eyJyb2xlIjogImFub24iLCAiaXNzIjogImtvZ2RhYmVueiIsICJpYXQiOiAxNzkzMTgwMDg2LCAiZXhwIjogMjEwODU0MDA4Nn0.XgC7MHgl-gwkbPeOUP8rtCR4wt5Ddcw4TDfy5elrzTQ';
const DASH_SECRET = 'kb-dash-2026-x9f3k';

const POLL_Q = {
  arrive_truth: 'Подъехали к заправке — информация совпала?',
  usability: 'Сайтом удобно пользоваться?',
  map_clear: 'Карта понятна?',
  forecast_true: 'Прогнозы сбываются?',
  marks_why: 'Почему оставляете отметки?',
  stars: 'Оценка сайта',
  advice_outcome: 'Результат совета «Куда ехать»'
};

const POLL_A = {
  match: 'Всё совпало', almost: 'Почти совпало', wrong: 'Не совпало', notyet: 'Ещё не проверял',
  great: 'Очень удобно', ok: 'В целом удобно', confuse: 'Иногда путаюсь', bad: 'Неудобно',
  glance: 'Да, с первого взгляда', legend: 'Подсматриваю в легенду', no: 'Не понимаю',
  always: 'Почти всегда', half: 'Примерно через раз', rare: 'Редко',
  help: 'Хочу помочь городу', sometimes: 'Иногда', whynot: 'Не понимаю зачем', hard: 'Неудобно',
  fuel: 'Доехал и заправился', miss: 'Не как ожидал', notwent: 'Ещё не доехал', noadv: 'Не воспользовался'
};

const EVENT_RU = {
  pageview: ['👀', 'Открыли сайт'],
  panel_view: ['📖', 'Листали панели'],
  open_station_card: ['⛽', 'Открывали карточку АЗС'],
  click_where_to_go: ['🧭', 'Жали «Куда ехать»'],
  feedback_submit: ['🙏', 'Оставляли отметку']
};

const CITY_RU = {
  novorossiysk: 'Новороссийск', gelendzhik: 'Геленджик', anapa: 'Анапа',
  krymsk: 'Крымск', krasnodar: 'Краснодар', sochi: 'Сочи',
  tuapse: 'Туапсе', armavir: 'Армавир', maykop: 'Майкоп'
};

function cityRu(c) { return CITY_RU[c] || (c === 'unknown' ? 'Не определён' : c); }

function sourceRu(s) {
  if (s === 'direct') return 'Напрямую';
  if (s.indexOf('ref: ') === 0) {
    const m = s.slice(5).match(/\/\/([^\/]+)/);
    const host = (m ? m[1] : s.slice(5)).replace(/^www\./, '');
    const known = [['vk.com','ВКонтакте'],['t.me','Телеграм'],['yandex','Яндекс'],['google','Google']];
    for (const k of known) if (host.indexOf(k[0]) >= 0) return k[1];
    return host;
  }
  if (s.indexOf('utm: ') === 0) return 'Реклама: ' + s.slice(5).split(' / ')[0];
  return s;
}

function num(v) { return (v === null || v === undefined) ? 0 : v; }

function formatNumber(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return n.toString();
}

async function load() {
  const app = document.getElementById('app');
  try {
    const [statsRes, pollRes, advisorRes] = await Promise.all([
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_stats', {
        method: 'POST',
        headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: DASH_SECRET })
      }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_poll_stats', {
        method: 'POST',
        headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: DASH_SECRET })
      }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_advisor_stats', {
        method: 'POST',
        headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: DASH_SECRET })
      })
    ]);

    if (!statsRes.ok || !pollRes.ok || !advisorRes.ok) throw new Error('HTTP error');

    const [stats, poll, advisor] = await Promise.all([statsRes.json(), pollRes.json(), advisorRes.json()]);
    if (stats.error) throw new Error('Invalid token');

    render(stats, poll, advisor);
  } catch (e) {
    app.innerHTML = '<div class="error">Ошибка загрузки: ' + e.message + '</div>';
  }
}

function render(stats, poll, advisor) {
  const app = document.getElementById('app');
  let html = '';

  // KPI Cards
  const ret = stats.retention || {};
  const dauChange = stats.dau_yesterday > 0 ? ((stats.dau_today - stats.dau_yesterday) / stats.dau_yesterday * 100).toFixed(1) : 0;
  const dauChangeClass = dauChange > 0 ? 'positive' : dauChange < 0 ? 'negative' : 'neutral';
  const dauChangeIcon = dauChange > 0 ? '↑' : dauChange < 0 ? '↓' : '→';

  html += '<div class="kpi-grid">';
  
  html += `<div class="kpi-card">
    <div class="kpi-label">Пользователи за 30 дней</div>
    <div class="kpi-value">${formatNumber(num(stats.mau_30d))}</div>
    <div class="kpi-subtitle">Уникальных посетителей</div>
  </div>`;

  html += `<div class="kpi-card">
    <div class="kpi-label">Активность сегодня</div>
    <div class="kpi-value">${num(stats.dau_today)}</div>
    <div class="kpi-change ${dauChangeClass}">${dauChangeIcon} ${Math.abs(dauChange)}% vs вчера</div>
    <div class="kpi-subtitle">Вчера: ${num(stats.dau_yesterday)}</div>
  </div>`;

  html += `<div class="kpi-card">
    <div class="kpi-label">Новые за неделю</div>
    <div class="kpi-value">${formatNumber(num(ret.new_7d))}</div>
    <div class="kpi-subtitle">Вернувшихся: ${formatNumber(num(ret.returning_7d))}</div>
  </div>`;

  html += `<div class="kpi-card">
    <div class="kpi-label">Всего сессий</div>
    <div class="kpi-value">${formatNumber(num(stats.total_sessions))}</div>
    <div class="kpi-subtitle">Действий: ${formatNumber(num(stats.total_hits))}</div>
  </div>`;

  html += '</div>';

  // Daily Activity Chart
  const daily = stats.daily || [];
  if (daily.length > 0) {
    html += '<div class="section">';
    html += '<div class="section-header"><div class="section-title"><span class="section-icon">📊</span>Активность по дням</div></div>';
    html += '<div class="chart-container">';
    
    const maxSessions = Math.max(...daily.map(d => d.sessions));
    const chartHeight = 280;
    const barWidth = Math.max(20, Math.min(40, 800 / daily.length));
    const chartWidth = daily.length * (barWidth + 8);
    
    html += `<svg class="chart-svg" viewBox="0 0 ${chartWidth} ${chartHeight}" preserveAspectRatio="xMidYMid meet">`;
    
    daily.forEach((day, i) => {
      const barHeight = (day.sessions / maxSessions) * (chartHeight - 40);
      const x = i * (barWidth + 8);
      const y = chartHeight - barHeight - 30;
      
      html += `<rect x="${x}" y="${y}" width="${barWidth}" height="${barHeight}" fill="url(#barGradient)" rx="4"/>`;
      
      if (i % Math.ceil(daily.length / 7) === 0) {
        html += `<text x="${x + barWidth/2}" y="${chartHeight - 10}" text-anchor="middle" font-size="11" fill="#64748b">${day.day.slice(5)}</text>`;
      }
    });
    
    html += `<defs>
      <linearGradient id="barGradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
      </linearGradient>
    </defs>`;
    html += '</svg></div>';
    html += '<div class="note">Количество уникальных пользователей за каждый день. Наведите на столбик для точного значения.</div>';
    html += '</div>';
  }

  // Funnel
  const funnel = stats.funnel || [];
  if (funnel.length > 0) {
    html += '<div class="section">';
    html += '<div class="section-header"><div class="section-title"><span class="section-icon">🎯</span>Действия пользователей</div></div>';
    html += '<div class="bar-chart">';
    
    const maxFunnel = Math.max(...funnel.map(f => f.sessions));
    funnel.forEach(f => {
      const event = EVENT_RU[f.event] || ['•', f.event];
      const width = (f.sessions / maxFunnel * 100);
      html += `<div class="bar-item">
        <div class="bar-label">${event[0]} ${event[1]}</div>
        <div class="bar-track"><div class="bar-fill primary" style="width: ${width}%"></div></div>
        <div class="bar-value">${formatNumber(f.sessions)}</div>
      </div>`;
    });
    
    html += '</div>';
    html += '<div class="note">Сколько уникальных пользователей выполнили каждое действие хотя бы раз.</div>';
    html += '</div>';
  }

  // Sources
  const sources = stats.sources || [];
  if (sources.length > 0) {
    html += '<div class="section">';
    html += '<div class="section-header"><div class="section-title"><span class="section-icon">🔗</span>Источники трафика</div></div>';
    html += '<div class="bar-chart">';
    
    const maxSrc = Math.max(...sources.map(s => s.sessions));
    sources.slice(0, 10).forEach(s => {
      const width = (s.sessions / maxSrc * 100);
      html += `<div class="bar-item">
        <div class="bar-label">${sourceRu(s.source)}</div>
        <div class="bar-track"><div class="bar-fill success" style="width: ${width}%"></div></div>
        <div class="bar-value">${formatNumber(s.sessions)}</div>
      </div>`;
    });
    
    html += '</div>';
    html += '<div class="note">Откуда пользователи приходят на сайт. «Напрямую» — закладки, иконки, прямые ссылки.</div>';
    html += '</div>';
  }

  // Cities
  const cities = stats.cities || [];
  if (cities.length > 0) {
    html += '<div class="section">';
    html += '<div class="section-header"><div class="section-title"><span class="section-icon">🏙️</span>География пользователей</div></div>';
    html += '<div class="bar-chart">';
    
    const maxCity = Math.max(...cities.map(c => c.sessions));
    cities.forEach(c => {
      const width = (c.sessions / maxCity * 100);
      html += `<div class="bar-item">
        <div class="bar-label">${cityRu(c.city)}</div>
        <div class="bar-track"><div class="bar-fill warning" style="width: ${width}%"></div></div>
        <div class="bar-value">${formatNumber(c.sessions)}</div>
      </div>`;
    });
    
    html += '</div>';
    html += '<div class="note">Город определяется по координатам устройства. Тот же город, что показывается в списке АЗС.</div>';
    html += '</div>';
  }

  // Polls
  if (poll && !poll.error && poll.total_answers > 0) {
    html += '<div class="section">';
    html += '<div class="section-header"><div class="section-title"><span class="section-icon">💬</span>Опросы водителей</div></div>';
    
    html += `<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px;">
      <div class="kpi-card">
        <div class="kpi-label">Всего ответов</div>
        <div class="kpi-value">${formatNumber(poll.total_answers)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Уникальных респондентов</div>
        <div class="kpi-value">${formatNumber(poll.unique_respondents)}</div>
      </div>
      ${poll.avg_stars !== null ? `<div class="kpi-card">
        <div class="kpi-label">Средняя оценка</div>
        <div class="kpi-value">${poll.avg_stars.toFixed(1)} ★</div>
      </div>` : ''}
    </div>`;

    if (poll.answers_by_question) {
      poll.answers_by_question.forEach(q => {
        const qText = POLL_Q[q.question_key] || q.question_key;
        const total = q.answers.reduce((s, a) => s + a.cnt, 0);
        const maxCnt = Math.max(...q.answers.map(a => a.cnt));
        
        html += `<div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border);">
          <div style="font-size: 15px; font-weight: 700; margin-bottom: 12px;">${qText}</div>
          <div class="bar-chart">`;
        
        q.answers.forEach(a => {
          let aText = q.question_key === 'stars' ? a.answer_key.replace('star', '').split('_')[0] + ' ★' : (POLL_A[a.answer_key] || a.answer_key);
          const pct = total > 0 ? Math.round(a.cnt / total * 100) : 0;
          const width = (a.cnt / maxCnt * 100);
          const barClass = pct >= 50 ? 'success' : pct >= 25 ? 'warning' : 'primary';
          
          html += `<div class="bar-item">
            <div class="bar-label">${aText}</div>
            <div class="bar-track"><div class="bar-fill ${barClass}" style="width: ${width}%"></div></div>
            <div class="bar-value">${a.cnt} (${pct}%)</div>
          </div>`;
        });
        
        html += '</div></div>';
      });
    }
    
    html += '<div class="note">Ответы полностью анонимны. Звёзды показывают распределение оценок от 1 до 5.</div>';
    html += '</div>';
  }

  // Advisor
  if (advisor && !advisor.error && advisor.total_advice > 0) {
    html += '<div class="section">';
    html += '<div class="section-header"><div class="section-title"><span class="section-icon">🧭</span>Советник «Куда ехать»</div></div>';
    
    const acceptanceRate = advisor.acceptance_rate || 0;
    
    html += `<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px;">
      <div class="kpi-card">
        <div class="kpi-label">Принятие советов</div>
        <div class="kpi-value">${acceptanceRate.toFixed(1)}%</div>
        <div class="kpi-subtitle">Маршрут к той же станции</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Всего советов</div>
        <div class="kpi-value">${formatNumber(advisor.total_advice)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Построено маршрутов</div>
        <div class="kpi-value">${formatNumber(advisor.route_built_count)}</div>
      </div>
      ${advisor.avg_session_duration !== null ? `<div class="kpi-card">
        <div class="kpi-label">Средняя сессия</div>
        <div class="kpi-value">${Math.round(advisor.avg_session_duration / 60)}м ${Math.round(advisor.avg_session_duration % 60)}с</div>
      </div>` : ''}
    </div>`;

    if (advisor.top_advised_stations && advisor.top_advised_stations.length > 0) {
      html += '<div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border);">';
      html += '<div style="font-size: 15px; font-weight: 700; margin-bottom: 12px;">Топ станций по советам</div>';
      html += '<div class="bar-chart">';
      
      const maxAdv = Math.max(...advisor.top_advised_stations.map(s => s.advice_count));
      advisor.top_advised_stations.slice(0, 5).forEach(s => {
        const width = (s.advice_count / maxAdv * 100);
        html += `<div class="bar-item">
          <div class="bar-label">${s.name}</div>
          <div class="bar-track"><div class="bar-fill primary" style="width: ${width}%"></div></div>
          <div class="bar-value">${s.advice_count}</div>
        </div>`;
      });
      
      html += '</div></div>';
    }
    
    if (advisor.top_routed_stations && advisor.top_routed_stations.length > 0) {
      html += '<div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border);">';
      html += '<div style="font-size: 15px; font-weight: 700; margin-bottom: 12px;">Топ станций по маршрутам</div>';
      html += '<div class="bar-chart">';
      
      const maxRoute = Math.max(...advisor.top_routed_stations.map(s => s.route_count));
      advisor.top_routed_stations.slice(0, 5).forEach(s => {
        const width = (s.route_count / maxRoute * 100);
        html += `<div class="bar-item">
          <div class="bar-label">${s.name}</div>
          <div class="bar-track"><div class="bar-fill success" style="width: ${width}%"></div></div>
          <div class="bar-value">${s.route_count}</div>
        </div>`;
      });
      
      html += '</div></div>';
    }
    
    html += '<div class="note">Доля принятия показывает, насколько точно советник попадает в потребности пользователей.</div>';
    html += '</div>';
  }

  app.innerHTML = html;
}

load();
</script>
</body>
</html>
