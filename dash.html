<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КогдаБенз · Аналитика</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --primary: #2465ee;
    --primary-light: #397cff;
    --success: #19b77a;
    --warning: #f5a05a;
    --danger: #ef5350;
    --text-primary: #14213d;
    --text-secondary: #71809c;
    --text-tertiary: #93a1b8;
    --bg-primary: #f7f9fc;
    --bg-card: #ffffff;
    --border: #e6ebf4;
    --shadow-sm: 0 1px 3px rgba(20,33,61,.06);
    --shadow: 0 2px 8px rgba(20,33,61,.08);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  .container { max-width: 1360px; margin: 0 auto; padding: 20px; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--border);
  }

  .header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-primary); }
  .header .subtitle { color: var(--text-secondary); font-size: 12px; margin-top: 3px; font-weight: 600; }

  .header-badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px;
    background: linear-gradient(135deg, #e5f8ef, #dff5e9); border: 1px solid #bfe8d4;
    border-radius: 18px; font-size: 11px; font-weight: 700; color: #12855c;
  }
  .header-badge::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--success); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } }
  
  .report-btn { border:0; border-radius:10px; padding:8px 12px; background:linear-gradient(135deg,#2465ee,#397cff); color:#fff; font-size:12px; font-weight:800; cursor:pointer; box-shadow:0 4px 12px rgba(36,101,238,.3); }
  .report-btn:active { transform:scale(.97); }

  /* === ПЛАШКА ВЕРДИКТА === */
  .verdict-panel {
    background: linear-gradient(135deg, #ffffff 0%, #f4f8ff 100%);
    border: 1px solid #dce4f0;
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(20, 33, 61, 0.08);
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 24px;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .verdict-panel::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--primary);
  }
  .verdict-panel.good::before { background: var(--success); }
  .verdict-panel.warn::before { background: var(--warning); }
  .verdict-panel.bad::before { background: var(--danger); }
  
  .score-box { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .score-ring {
    width: 100px; height: 100px; border-radius: 50%;
    background: conic-gradient(var(--primary) var(--score-deg, 70%), #e2e8f0 0);
    display: grid; place-items: center; position: relative;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.1);
  }
  .score-ring::before { content: ''; position: absolute; inset: 8px; background: #fff; border-radius: 50%; }
  .score-val { position: relative; z-index: 1; font-size: 28px; font-weight: 900; color: var(--text-primary); line-height: 1; }
  .score-val small { font-size: 12px; color: var(--text-secondary); }
  .score-label { margin-top: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); }

  .verdict-content h3 { font-size: 18px; font-weight: 900; margin-bottom: 12px; color: var(--text-primary); letter-spacing: -0.3px; }
  .verdict-lists { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .v-list-col ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
  .v-list-col li { font-size: 12px; font-weight: 600; line-height: 1.4; display: flex; align-items: flex-start; gap: 6px; }
  .v-list-col li::before { content: '•'; font-size: 16px; line-height: 1; }
  .v-good li::before { color: var(--success); }
  .v-bad li::before { color: var(--danger); }
  .v-warn li::before { color: var(--warning); }
  
  .v-list-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px; color: var(--text-tertiary); }

  @media (max-width: 768px) {
    .verdict-panel { grid-template-columns: 1fr; gap: 16px; text-align: center; }
    .verdict-lists { grid-template-columns: 1fr; text-align: left; }
    .score-box { flex-direction: row; gap: 16px; justify-content: center; }
    .score-label { margin-top: 0; }
  }
  /* ===================== */

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow-sm); transition: all 0.2s; position: relative; overflow: hidden; }
  .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--primary), var(--primary-light)); opacity: 0.6; }
  .kpi-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
  .kpi-label { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
  .kpi-value { font-size: 28px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.8px; line-height: 1; margin-bottom: 4px; }
  .kpi-change { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 5px; }
  .kpi-change.positive { background: #e5f8ef; color: #12855c; }
  .kpi-change.negative { background: #fdecec; color: #c2403f; }
  .kpi-change.neutral { background: #f2f4f9; color: var(--text-secondary); }
  .kpi-subtitle { font-size: 10px; color: var(--text-tertiary); margin-top: 5px; font-weight: 600; }

  .section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .section-title { font-size: 15px; font-weight: 800; color: var(--text-primary); display: flex; align-items: center; gap: 7px; }
  .section-icon { font-size: 17px; }

  .bar-chart { display: flex; flex-direction: column; gap: 8px; }
  .bar-item { display: grid; grid-template-columns: 180px 1fr 70px; gap: 10px; align-items: center; padding: 6px 0; }
  .bar-label { font-size: 12px; font-weight: 600; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { height: 26px; background: #f7f9fc; border-radius: 7px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; border-radius: 7px; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
  .bar-fill.primary { background: linear-gradient(90deg, #2465ee, #397cff); }
  .bar-fill.success { background: linear-gradient(90deg, #19b77a, #2fd39a); }
  .bar-fill.warning { background: linear-gradient(90deg, #f5a05a, #ffb46a); }
  .bar-value { font-size: 12px; font-weight: 800; color: var(--text-primary); text-align: right; }

  .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .data-table th { text-align: left; padding: 10px 8px; font-size: 10px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 2px solid var(--border); }
  .data-table td { padding: 9px 8px; border-bottom: 1px solid var(--border); }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table tr:hover { background: #f8fafc; }

  .note { margin-top: 12px; padding: 10px 12px; background: #f7f9fc; border-left: 3px solid var(--primary); border-radius: 7px; font-size: 11px; color: var(--text-secondary); line-height: 1.5; font-weight: 600; }

  .tf-tabs { display: flex; gap: 3px; background: #f2f4f9; border-radius: 9px; padding: 3px; }
  .tf-tab { border: 0; background: transparent; color: var(--text-secondary); font-size: 11px; font-weight: 700; padding: 5px 11px; border-radius: 7px; cursor: pointer; transition: all 0.2s; }
  .tf-tab.active { background: #fff; color: var(--text-primary); box-shadow: 0 2px 6px rgba(20,33,61,.1); }
  .tf-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 3px 0 8px; }
  .tf-num { font-size: 26px; font-weight: 800; letter-spacing: -0.8px; color: var(--text-primary); }
  .tf-num small { font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-left: 6px; letter-spacing: 0; }
  .tf-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
  .tf-badge.up { background: #e5f8ef; color: #12855c; }
  .tf-badge.down { background: #fdecec; color: #c2403f; }
  .tf-badge.neutral { background: #f2f4f9; color: var(--text-secondary); }
  .chart-wrap { position: relative; }
  .tf-svg { display: block; width: 100%; }
  .tf-tip { position: absolute; top: 6px; left: 0; background: #14213d; color: #fff; font-size: 10px; font-weight: 600; padding: 5px 9px; border-radius: 7px; pointer-events: none; white-space: nowrap; box-shadow: 0 6px 16px rgba(20,33,61,.25); z-index: 5; }

  .error { padding: 20px; background: #fdecec; border: 1px solid #f3b7b3; border-radius: 12px; color: #c2403f; font-weight: 700; text-align: center; font-size: 13px; }
  .loading { display: flex; align-items: center; justify-content: center; padding: 50px; color: var(--text-secondary); font-size: 12px; font-weight: 600; }
  .spinner { width: 36px; height: 36px; border: 3px solid #e2e8f0; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.9s linear infinite; margin-right: 11px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .heatmap-wrap { overflow-x: auto; padding-bottom: 10px; }
  .heatmap { border-collapse: collapse; font-size: 10px; }
  .heatmap th, .heatmap td { padding: 2px; text-align: center; }
  .heatmap .hour-label { font-weight: 600; color: var(--text-secondary); width: 30px; }
  .heatmap .day-label { font-weight: 600; color: var(--text-secondary); text-align: left; padding-right: 8px; }
  .heat-cell { width: 24px; height: 20px; border-radius: 3px; display: inline-block; transition: opacity 0.2s; }
  .heat-cell:hover { opacity: 0.7; outline: 1px solid #000; }

  @media (max-width: 768px) {
    .container { padding: 14px; }
    .header h1 { font-size: 19px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .bar-item { grid-template-columns: 140px 1fr 60px; }
    .bar-label { font-size: 11px; }
    .section { padding: 14px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>⛽ КогдаБенз · Аналитика</h1>
      <div class="subtitle">Анонимная статистика использования сайта</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="report-btn" onclick="downloadReport()">⬇ Скачать отчёт</button>
      <div class="header-badge">Обновлено только что</div>
    </div>
  </div>

  <div id="app">
    <div class="loading">
      <div class="spinner"></div>
      <span>Загрузка данных...</span>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://api.kogdabenz.ru';
const SUPABASE_KEY = 'eyJhbGciOiAiSFMyNTYiLCAidHlwIjogIkpXVCJ9.eyJyb2xlIjogImFub24iLCAiaXNzIjogImtvZ2RhYmVueiIsICJpYXQiOiAxNzkzMTgwMDg2LCAiZXhwIjogMjEwODU0MDA4Nn0.XgC7MHgl-gwkbPeOUP8rtCR4wt5Ddcw4TDfy5elrzTQ';
const DASH_SECRET = 'kb-dash-2026-x9f3k';

let REPORT = {};
let ADVANCED_REPORT = {}; 
let trafficCache = {};
let trafficRange = '24h';

const POLL_Q = {
  arrive_truth: 'Подъехали к заправке — информация совпала?',
  usability: 'Сайтом удобно пользоваться?',
  map_clear: 'Карта понятна?',
  forecast_true: 'Прогнозы сбываются?',
  marks_why: 'Почему оставляете отметки?',
  stars: 'Оценка сайта',
  advice_outcome: 'Результат совета «Куда ехать»'
};

const POLL_A = {
  match: 'Всё совпало', almost: 'Почти совпало', wrong: 'Не совпало', notyet: 'Ещё не проверял',
  great: 'Очень удобно', ok: 'В целом удобно', confuse: 'Иногда путаюсь', bad: 'Неудобно',
  glance: 'Да, с первого взгляда', legend: 'Подсматриваю в легенду', no: 'Не понимаю',
  always: 'Почти всегда', half: 'Примерно через раз', rare: 'Редко',
  help: 'Хочу помочь городу', sometimes: 'Иногда', whynot: 'Не понимаю зачем', hard: 'Неудобно',
  fuel: 'Доехал и заправился', miss: 'Не как ожидал', notwent: 'Ещё не доехал', noadv: 'Не воспользовался'
};

const EVENT_RU = {
  pageview: ['👀', 'Открыли сайт'],
  panel_view: ['📖', 'Листали панели'],
  open_station_card: ['⛽', 'Открывали карточку АЗС'],
  click_where_to_go: ['🧭', 'Жали «Куда ехать»'],
  feedback_submit: ['🙏', 'Оставляли отметку']
};

const CITY_RU = {
  novorossiysk: 'Новороссийск', gelendzhik: 'Геленджик', anapa: 'Анапа',
  krymsk: 'Крымск', krasnodar: 'Краснодар', sochi: 'Сочи',
  tuapse: 'Туапсе', armavir: 'Армавир', maykop: 'Майкоп'
};

function cityRu(c) { return CITY_RU[c] || (c === 'unknown' ? 'Не определён' : c); }

function sourceRu(s) {
  if (!s) return 'Неизвестно';
  const lowerS = s.toLowerCase();
  if (lowerS === 'direct' || lowerS === 'напрямую') return 'Прямые заходы';
  if (lowerS.startsWith('utm: ')) {
    if (lowerS.includes('yandex') || lowerS.includes('ya')) return 'Яндекс (Реклама)';
    if (lowerS.includes('google')) return 'Google (Реклама)';
    return 'Реклама: ' + s.slice(5).split(' / ')[0];
  }
  if (lowerS.startsWith('ref: ')) {
    let host = lowerS.slice(5).replace(/^(https?:\/\/)?(www\.)?/, '');
    if (host.startsWith('yandex') || host.startsWith('ya.ru')) return 'Яндекс (Поиск)';
    if (host.startsWith('google')) return 'Google (Поиск)';
    if (host.includes('vk.com') || host.includes('vk.ru')) return 'ВКонтакте';
    if (host.includes('t.me') || host.includes('telegram')) return 'Телеграм';
    if (host.includes('dzen.ru')) return 'Дзен';
    if (host.includes('mail.ru')) return 'Mail.ru';
    return host.split('/')[0];
  }
  return s;
}

function num(v) { return (v === null || v === undefined) ? 0 : v; }

function formatNumber(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return n.toString();
}

async function load() {
  const app = document.getElementById('app');
  try {
    const [statsRes, pollRes, advisorRes, hooksRes, engRes, srcfRes] = await Promise.all([
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_stats', { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ secret: DASH_SECRET }) }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_poll_stats', { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ secret: DASH_SECRET }) }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_advisor_stats', { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ secret: DASH_SECRET }) }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_hooks_stats', { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ secret: DASH_SECRET }) }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_engagement_stats', { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ secret: DASH_SECRET }) }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_source_funnel', { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ secret: DASH_SECRET }) })
    ]);

    if (!statsRes.ok || !pollRes.ok || !advisorRes.ok || !hooksRes.ok || !engRes.ok || !srcfRes.ok) throw new Error('HTTP error');

    const [stats, poll, advisor, hooks, eng, srcf] = await Promise.all([statsRes.json(), pollRes.json(), advisorRes.json(), hooksRes.json(), engRes.json(), srcfRes.json()]);
    if (stats.error) throw new Error('Invalid token');

    render(stats, poll, advisor, hooks, eng, srcf);
  } catch (e) {
    app.innerHTML = '<div class="error">Ошибка загрузки: ' + e.message + '</div>';
  }
}

function render(stats, poll, advisor, hooks, eng, srcf) {
  REPORT = { stats: stats, poll: poll, advisor: advisor, hooks: hooks, eng: eng, srcf: srcf };
  const app = document.getElementById('app');
  let html = '';

  // Контейнер для умной плашки в самом начале
  html += '<div id="verdict-container"><div class="loading"><div class="spinner"></div><span>Анализ данных...</span></div></div>';

  // KPI Cards
  const ret = stats.retention || {};
  const dauChange = stats.dau_yesterday > 0 ? ((stats.dau_today - stats.dau_yesterday) / stats.dau_yesterday * 100).toFixed(1) : 0;
  const dauChangeClass = dauChange > 0 ? 'positive' : dauChange < 0 ? 'negative' : 'neutral';
  const dauChangeIcon = dauChange > 0 ? '↑' : dauChange < 0 ? '↓' : '→';

  html += '<div class="kpi-grid">';
  html += `<div class="kpi-card"><div class="kpi-label">Пользователи за 30 дней</div><div class="kpi-value">${formatNumber(num(stats.mau_30d))}</div><div class="kpi-subtitle">Уникальных ID</div></div>`;
  html += `<div class="kpi-card"><div class="kpi-label">Пользователей сегодня</div><div class="kpi-value">${num(stats.dau_today)}</div><div class="kpi-change ${dauChangeClass}">${dauChangeIcon} ${Math.abs(dauChange)}% vs вчера</div><div class="kpi-subtitle">Вчера: ${num(stats.dau_yesterday)}</div></div>`;
  html += `<div class="kpi-card"><div class="kpi-label">Новые (за 7 дней)</div><div class="kpi-value">${formatNumber(num(ret.new_7d))}</div><div class="kpi-subtitle">Вернувшихся: ${formatNumber(num(ret.returning_7d))}</div></div>`;
  html += `<div class="kpi-card"><div class="kpi-label">Всего визитов</div><div class="kpi-value">${formatNumber(num(stats.total_sessions))}</div><div class="kpi-subtitle">Действий: ${formatNumber(num(stats.total_hits))}</div></div>`;
  html += '</div>';

  // Трафик
  html += '<div class="section">' +
    '<div class="section-header"><div class="section-title"><span class="section-icon">📈</span>Пользователи по периодам</div>' +
    '<div class="tf-tabs">' +
    '<button class="tf-tab active" data-range="24h" onclick="loadTraffic(\'24h\')">24h</button>' +
    '<button class="tf-tab" data-range="7d" onclick="loadTraffic(\'7d\')">1W</button>' +
    '<button class="tf-tab" data-range="30d" onclick="loadTraffic(\'30d\')">1M</button>' +
    '</div></div>' +
    '<div class="tf-head" id="trafficHead"></div>' +
    '<div class="chart-wrap" id="trafficChart"><div class="loading" style="padding:30px"><div class="spinner"></div></div></div>' +
    '<div class="note">В этой системе <b>session_id</b> выступает как анонимный ID устройства (уникальный пользователь).</div>' +
    '</div>';

  // Funnel
  const funnel = stats.funnel || [];
  if (funnel.length > 0) {
    html += '<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">🎯</span>Действия пользователей</div></div><div class="bar-chart">';
    const maxFunnel = Math.max(...funnel.map(f => f.sessions));
    funnel.forEach(f => {
      const event = EVENT_RU[f.event] || ['•', f.event];
      const width = (f.sessions / maxFunnel * 100);
      html += `<div class="bar-item"><div class="bar-label">${event[0]} ${event[1]}</div><div class="bar-track"><div class="bar-fill primary" style="width: ${width}%"></div></div><div class="bar-value">${formatNumber(f.sessions)}</div></div>`;
    });
    html += '</div><div class="note">Сколько уникальных пользователей выполнили каждое действие хотя бы раз.</div></div>';
  }

  // Источники
  const rawSources = stats.sources || [];
  const groupedSourcesMap = {};
  rawSources.forEach(item => {
    const ruName = sourceRu(item.source);
    if (!groupedSourcesMap[ruName]) groupedSourcesMap[ruName] = 0;
    groupedSourcesMap[ruName] += item.sessions;
  });
  const sources = Object.keys(groupedSourcesMap)
    .map(k => ({ source: k, sessions: groupedSourcesMap[k] }))
    .sort((a, b) => b.sessions - a.sessions);

  if (sources.length > 0) {
    html += '<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">🔗</span>Источники трафика</div></div><div class="bar-chart">';
    const maxSrc = Math.max(...sources.map(s => s.sessions));
    sources.slice(0, 10).forEach(s => {
      const width = (s.sessions / maxSrc * 100);
      html += `<div class="bar-item"><div class="bar-label">${s.source}</div><div class="bar-track"><div class="bar-fill success" style="width: ${width}%"></div></div><div class="bar-value">${formatNumber(s.sessions)}</div></div>`;
    });
    html += '</div><div class="note">Все переходы с Яндекса, ВКонтакте и других систем объединены в общие группы для удобства.</div></div>';
  }

  // Города
  const cities = stats.cities || [];
  if (cities.length > 0) {
    html += '<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">🏙️</span>География пользователей</div></div><div class="bar-chart">';
    const maxCity = Math.max(...cities.map(c => c.sessions));
    cities.forEach(c => {
      const width = (c.sessions / maxCity * 100);
      html += `<div class="bar-item"><div class="bar-label">${cityRu(c.city)}</div><div class="bar-track"><div class="bar-fill warning" style="width: ${width}%"></div></div><div class="bar-value">${formatNumber(c.sessions)}</div></div>`;
    });
    html += '</div><div class="note">Город определяется по координатам устройства.</div></div>';
  }

  // Опросы
  if (poll && !poll.error && poll.total_answers > 0) {
    html += '<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">💬</span>Опросы водителей</div></div>';
    html += `<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px;">
      <div class="kpi-card"><div class="kpi-label">Всего ответов</div><div class="kpi-value">${formatNumber(poll.total_answers)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Уникальных респондентов</div><div class="kpi-value">${formatNumber(poll.unique_respondents)}</div></div>
      ${poll.avg_stars !== null ? `<div class="kpi-card"><div class="kpi-label">Средняя оценка</div><div class="kpi-value">${poll.avg_stars.toFixed(1)} ★</div></div>` : ''}
    </div>`;

    if (poll.answers_by_question) {
      poll.answers_by_question.forEach(q => {
        const qText = POLL_Q[q.question_key] || q.question_key;
        const total = q.answers.reduce((s, a) => s + a.cnt, 0);
        const maxCnt = Math.max(...q.answers.map(a => a.cnt));
        html += `<div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);"><div style="font-size: 14px; font-weight: 700; margin-bottom: 10px;">${qText}</div><div class="bar-chart">`;
        q.answers.forEach(a => {
          let aText = q.question_key === 'stars' ? a.answer_key.replace('star', '').split('_')[0] + ' ★' : (POLL_A[a.answer_key] || a.answer_key);
          const pct = total > 0 ? Math.round(a.cnt / total * 100) : 0;
          const width = (a.cnt / maxCnt * 100);
          const barClass = pct >= 50 ? 'success' : pct >= 25 ? 'warning' : 'primary';
          html += `<div class="bar-item"><div class="bar-label">${aText}</div><div class="bar-track"><div class="bar-fill ${barClass}" style="width: ${width}%"></div></div><div class="bar-value">${a.cnt} (${pct}%)</div></div>`;
        });
        html += '</div></div>';
      });
    }
    html += '<div class="note">Ответы полностью анонимны. Звёзды показывают распределение оценок от 1 до 5.</div></div>';
  }

  // Советник
  if (advisor && !advisor.error && advisor.total_advice > 0) {
    html += '<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">🧭</span>Советник «Куда ехать»</div></div>';
    const acceptanceRate = advisor.acceptance_rate || 0;
    html += `<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px;">
      <div class="kpi-card"><div class="kpi-label">Принятие советов</div><div class="kpi-value">${acceptanceRate.toFixed(1)}%</div><div class="kpi-subtitle">Маршрут к той же станции</div></div>
      <div class="kpi-card"><div class="kpi-label">Всего советов</div><div class="kpi-value">${formatNumber(advisor.total_advice)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Построено маршрутов</div><div class="kpi-value">${formatNumber(advisor.route_built_count)}</div></div>
      ${advisor.avg_session_duration !== null ? `<div class="kpi-card"><div class="kpi-label">Средняя сессия</div><div class="kpi-value">${Math.round(advisor.avg_session_duration / 60)}м ${Math.round(advisor.avg_session_duration % 60)}с</div></div>` : ''}
    </div>`;

    if (advisor.top_advised_stations && advisor.top_advised_stations.length > 0) {
      html += '<div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);"><div style="font-size: 14px; font-weight: 700; margin-bottom: 10px;">Топ станций по советам</div><div class="bar-chart">';
      const maxAdv = Math.max(...advisor.top_advised_stations.map(s => s.advice_count));
      advisor.top_advised_stations.slice(0, 5).forEach(s => {
        const width = (s.advice_count / maxAdv * 100);
        html += `<div class="bar-item"><div class="bar-label">${s.name}</div><div class="bar-track"><div class="bar-fill primary" style="width: ${width}%"></div></div><div class="bar-value">${s.advice_count}</div></div>`;
      });
      html += '</div></div>';
    }
    
    if (advisor.top_routed_stations && advisor.top_routed_stations.length > 0) {
      html += '<div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);"><div style="font-size: 14px; font-weight: 700; margin-bottom: 10px;">Топ станций по маршрутам</div><div class="bar-chart">';
      const maxRoute = Math.max(...advisor.top_routed_stations.map(s => s.route_count));
      advisor.top_routed_stations.slice(0, 5).forEach(s => {
        const width = (s.route_count / maxRoute * 100);
        html += `<div class="bar-item"><div class="bar-label">${s.name}</div><div class="bar-track"><div class="bar-fill success" style="width: ${width}%"></div></div><div class="bar-value">${s.route_count}</div></div>`;
      });
      html += '</div></div>';
    }
    html += '<div class="note">Доля принятия показывает, насколько точно советник попадает в потребности пользователей.</div></div>';
  }

  html += renderHooks(hooks);
  html += renderEngagement(eng);
  html += renderSourceFunnel(srcf);
  html += '<div id="advanced-stats-container"></div>';

  app.innerHTML = html;
  loadTraffic(trafficRange);
  
  // Первичный вердикт по основным данным (пока грузятся тяжелые запросы)
  renderVerdict();
  
  loadAdvancedStats();
}

// === УМНАЯ ПЛАШКА ВЕРДИКТА ===
function renderVerdict() {
  const container = document.getElementById('verdict-container');
  if (!container || !REPORT.stats) return;

  const s = REPORT.stats;
  const adv = ADVANCED_REPORT;
  const f = s.funnel || [];
  const src = s.sources || [];
  
  let score = 6.0; // Базовый балл (нейтрально)
  let pros = [];
  let cons = [];
  let statusClass = 'warn';

  // 1. Анализ удержания (Отказы)
  if (adv.bounce && adv.bounce.total_sessions) {
    const br = adv.bounce.bounce_rate;
    if (br <= 12) { score += 2.0; pros.push(`Отличное удержание: отказы ${br}%. Люди изучают сайт, а не закрывают его сразу.`); }
    else if (br <= 25) { score += 1.0; pros.push(`Хорошее удержание: отказы ${br}%.`); }
    else if (br <= 40) { score -= 0.5; cons.push(`Средние отказы (${br}%). Есть над чем работать.`); }
    else { score -= 1.5; cons.push(`Высокие отказы (${br}%). Сайт может тормозить или пугать пользователей.`); }
  }

  // 2. Анализ воронки (Глубина просмотра)
  const pv = f.find(x => x.event === 'pageview')?.sessions || 0;
  const panel = f.find(x => x.event === 'panel_view')?.sessions || 0;
  const card = f.find(x => x.event === 'open_station_card')?.sessions || 0;
  if (pv > 0) {
    const panelConv = Math.round(panel / pv * 100);
    const cardConv = Math.round(card / pv * 100);
    if (cardConv >= 8) { score += 0.5; pros.push(`Хорошая конверсия: ${cardConv}% пользователей доходят до карточки АЗС.`); }
    else { score -= 0.5; cons.push(`Воронка теряет людей: только ${panelConv}% листают панели и ${cardConv}% смотрят карточки.`); }
  }

  // 3. Анализ возвращаемости (Когорты)
  if (adv.cohort && adv.cohort.length > 1) {
    // Берем когорту не сегодняшнюю, а вчерашнюю/позавчерашнюю
    const matureCohort = adv.cohort[1]; 
    if (matureCohort && matureCohort.total_users > 10) {
      const retRate = Math.round(100 * matureCohort.day1 / matureCohort.total_users);
      if (retRate >= 10) { score += 1.5; pros.push(`Лояльная аудитория: ${retRate}% возвращаются на следующий день.`); }
      else if (retRate >= 5) { score += 0.5; pros.push(`Нормальная возвращаемость: ${retRate}% на след. день.`); }
      else { score -= 1.0; cons.push(`Мало возвратов: ${retRate}% на след. день. Водители заходят разово (нужен Telegram-бот).`); }
    } else {
      cons.push(`Когорты еще маленькие, возвращаемость оценим позже.`);
    }
  }

  // 4. Анализ источников (Окупаемость рекламы)
  const yaOrg = src.find(x => x.source.toLowerCase().includes('yandex') && !x.source.toLowerCase().includes('utm'))?.sessions || 0;
  const yaAds = src.find(x => x.source.toLowerCase().includes('utm') && x.source.toLowerCase().includes('yandex'))?.sessions || 0;
  if (yaAds > 0) {
    if (yaAds >= yaOrg * 0.5) { score += 1.0; pros.push(`Реклама работает отлично: дает ${yaAds} визитов (органика Яндекса: ${yaOrg}).`); }
    else { score += 0.5; pros.push(`Реклама приводит трафик (${yaAds} визитов).`); }
  }

  // 5. Анализ привычки (Время на сайте)
  if (s.engagement && s.engagement.dur) {
    const medianMin = s.engagement.dur.p50 / 60;
    if (medianMin >= 1.5) { score += 0.5; pros.push(`Водители задерживаются: медиана сессии ${Math.round(medianMin)} мин.`); }
    else if (medianMin < 0.5) { score -= 0.5; cons.push(`Очень короткие сессии (${Math.round(medianMin*60)} сек). Люди не успевают разобраться.`); }
  }

  // Ограничиваем балл от 1 до 10
  score = Math.max(1.0, Math.min(10.0, score));
  
  if (score >= 8.0) { statusClass = 'good'; }
  else if (score >= 5.0) { statusClass = 'warn'; }
  else { statusClass = 'bad'; }

  const finalScore = score.toFixed(1).replace('.', ',');
  const scoreDeg = (score / 10) * 100;

  let statusWord = statusClass === 'good' ? 'Отличный старт' : statusClass === 'warn' ? 'Есть над чем работать' : 'Критическая ситуация';

  // Формируем HTML
  let html = `
    <div class="verdict-panel ${statusClass}">
      <div class="score-box">
        <div class="score-ring" style="--score-deg: ${scoreDeg}%">
          <div class="score-val">${finalScore}<small>/10</small></div>
        </div>
        <div class="score-label">${statusWord}</div>
      </div>
      <div class="verdict-content">
        <h3>Вердикт аналитики: сводка по проекту</h3>
        <div class="verdict-lists">
          <div class="v-list-col v-good">
            <div class="v-list-title">Что работает отлично</div>
            <ul>${pros.length ? pros.map(p => `<li>${p}</li>`).join('') : '<li>Пока нет явных успехов, копим данные.</li>'}</ul>
          </div>
          <div class="v-list-col v-bad">
            <div class="v-list-title">На что обратить внимание</div>
            <ul>${cons.length ? cons.map(c => `<li>${c}</li>`).join('') : '<li>Все показатели в норме, проблем не найдено!</li>'}</ul>
          </div>
        </div>
      </div>
    </div>
  `;
  container.innerHTML = html;
}

// === ФУНКЦИЯ ЗАГРУЗКИ ДОП. СТАТИСТИКИ ===
async function loadAdvancedStats() {
  const container = document.getElementById('advanced-stats-container');
  if (!container) return;

  container.innerHTML = '<div class="loading"><div class="spinner"></div><span>Загрузка доп. статистики...</span></div>';

  try {
    const [bounceRes, cohortRes, heatmapRes] = await Promise.all([
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_bounce_stats', { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ secret: DASH_SECRET }) }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_retention_cohorts', { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ secret: DASH_SECRET }) }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_time_heatmap', { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ secret: DASH_SECRET }) })
    ]);

    const bounceData = await bounceRes.json();
    const cohortData = await cohortRes.json();
    const heatmapData = await heatmapRes.json();
    
    ADVANCED_REPORT = { bounce: bounceData, cohort: cohortData, heatmap: heatmapData };

    if (bounceData.error || cohortData.error || heatmapData.error) {
        console.error("SQL Errors:", bounceData.error, cohortData.error, heatmapData.error);
        container.innerHTML = '<div class="error">Ошибка SQL: проверьте консоль (F12). Убедитесь, что функции созданы в базе.</div>';
        return;
    }

    let html = '';

    // --- БЛОК ОТКАЗОВ ---
    if (bounceData && bounceData.total_sessions > 0) {
      const maxB = Math.max(...(bounceData.buckets || []).map(b => b.cnt), 1);
      html += `<div class="section">
        <div class="section-header"><div class="section-title"><span class="section-icon">🚪</span>Уходы и глубина просмотра</div></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px">
          <div class="kpi-card" style="border-left: 3px solid var(--danger);">
            <div class="kpi-label">Показатель отказов</div>
            <div class="kpi-value">${bounceData.bounce_rate}%</div>
            <div class="kpi-subtitle">Ушли за первые 10 секунд</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Всего сессий</div>
            <div class="kpi-value">${bounceData.total_sessions}</div>
          </div>
        </div>
        <div class="bar-chart">`;
      
      (bounceData.buckets || []).forEach(b => {
        const width = (b.cnt / maxB * 100);
        const isBad = b.label.includes('уход');
        const barStyle = isBad ? 'background: #ef5350;' : '';
        html += `<div class="bar-item">
          <div class="bar-label">${b.label}</div>
          <div class="bar-track"><div class="bar-fill" style="width: ${width}%; ${barStyle}"></div></div>
          <div class="bar-value">${b.cnt}</div>
        </div>`;
      });
      html += `</div><div class="note">Отказы — это сессии короче 10 секунд (человек зашел и сразу закрыл вкладку). Если этот показатель высокий, значит сайт тормозит или не отвечает на ожидания.</div></div>`;
    }

    // --- БЛОК КОГОРТ ---
    if (cohortData && cohortData.length > 0) {
      html += `<div class="section">
        <div class="section-header"><div class="section-title"><span class="section-icon">🔄</span>Возвращаемость (Когорты)</div></div>
        <div style="overflow-x:auto"><table class="data-table">
          <tr><th>Дата прихода</th><th>Пришло (чел)</th><th>Вернулись на сл. день</th><th>Вернулись через 7 дней</th></tr>`;
      
      cohortData.forEach(c => {
        const d1Pct = Math.round(100 * c.day1 / c.total_users);
        const d7Pct = Math.round(100 * c.day7 / c.total_users);
        const d1Color = d1Pct >= 15 ? '#12855c' : '#c2403f';
        const dateStr = new Date(c.cohort_date).toLocaleDateString('ru-RU', {day: '2-digit', month: '2-digit'});
        html += `<tr>
          <td><b>${dateStr}</b></td>
          <td>${c.total_users}</td>
          <td><span style="color:${d1Color};font-weight:700">${c.day1} (${d1Pct}%)</span></td>
          <td><span style="color:#2465ee;font-weight:700">${c.day7} (${d7Pct}%)</span></td>
        </tr>`;
      });
      html += `</table></div><div class="note">Показывает реальную лояльность. Если человек пришел 1 ноября, вернулся ли он 2 ноября или 8 ноября?</div></div>`;
    }

    // --- БЛОК ТЕПЛОВОЙ КАРТЫ ---
    if (heatmapData && heatmapData.length > 0) {
      let maxUsers = 1;
      heatmapData.forEach(h => { if (h.users > maxUsers) maxUsers = h.users; });
      
      const daysNames = ['', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      let matrix = Array(8).fill(0).map(() => Array(24).fill(0));
      heatmapData.forEach(h => { matrix[h.day_num][h.hour_num] = h.users; });

      html += `<div class="section">
        <div class="section-header"><div class="section-title"><span class="section-icon">🔥</span>Активность по дням и часам</div></div>
        <div class="heatmap-wrap"><table class="heatmap">`;
      
      html += `<tr><th></th>`;
      for(let h = 0; h < 24; h++) html += `<th class="hour-label">${h}</th>`;
      html += `</tr>`;

      for (let d = 1; d <= 7; d++) {
        html += `<tr><td class="day-label">${daysNames[d]}</td>`;
        for (let h = 0; h < 24; h++) {
          const val = matrix[d][h];
          const opacity = Math.max(0.05, val / maxUsers);
          const bgColor = `rgba(36, 101, 238, ${opacity})`;
          html += `<td><div class="heat-cell" style="background:${bgColor}" title="${val} польз."></div></td>`;
        }
        html += `</tr>`;
      }
      html += `</table></div><div class="note">Темные пятна — часы пик. Обычно это утро (8:00-9:00) и вечер (17:00-19:00), когда люди едут на работу и с работы.</div></div>`;
    }

    container.innerHTML = html;
    
    // ОБНОВЛЯЕМ ВЕРДИКТ С УЧЕТОМ НОВЫХ ДАННЫХ (Отказы и Когорты)
    renderVerdict();

  } catch (e) {
    console.error('Ошибка загрузки доп. статистики:', e);
    container.innerHTML = '<div class="error">Не удалось загрузить доп. статистику: ' + e.message + '</div>';
  }
}

function renderSourceFunnel(list) {
  if (!list || !list.length) return '';
  const cell = (n, r) => r.visits ? n + ' <small style="color:#94a3b8">(' + Math.round(100 * n / r.visits) + '%)</small>' : String(n);
  let out = '<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">🧭</span>Воронка по источникам · 7 дней</div></div>';
  out += '<div style="overflow-x:auto"><table class="data-table"><tr><th>Источник</th><th>Открыли</th><th>Листали</th><th>Карточка</th><th>Куда ехать</th><th>Отметка</th><th>PWA</th></tr>';
  for (const r of list) {
    out += '<tr><td><b>' + r.source + '</b></td><td>' + r.visits + '</td><td>' + cell(r.panels, r) + '</td><td>' + cell(r.cards, r) + '</td><td>' + cell(r.advice, r) + '</td><td>' + cell(r.marks, r) + '</td><td>' + cell(r.installs, r) + '</td></tr>';
  }
  out += '</table></div>';
  out += '<div class="note">Проценты — от открывших сайт из этого источника. Если у «Реклама: yandex» доли листали/совет заметно ниже органики — холодный трафик не понимает первый экран.</div></div>';
  return out;
}

  if (!R.stats) { alert('Данные ещё не загрузились — подожди секунду и повтори.'); return; }
  const L = [];
  const now = new Date(Date.now() + 3 * 3600 * 1000);
  const stamp = now.getUTCFullYear() + '-' + p2(now.getUTCMonth() + 1) + '-' + p2(now.getUTCDate()) + '_' + p2(now.getUTCHours()) + p2(now.getUTCMinutes());
  L.push('КОГДАБЕНЗ · ОТЧЁТ ВЛАДЕЛЬЦА');
  L.push('Сформирован: ' + p2(now.getUTCDate()) + '.' + p2(now.getUTCMonth() + 1) + '.' + now.getUTCFullYear() + ' ' + p2(now.getUTCHours()) + ':' + p2(now.getUTCMinutes()) + ' МСК');
  L.push('');
  
  // Добавляем вердикт в отчет
  const verdictEl = document.querySelector('.verdict-panel');
  if (verdictEl) {
    L.push('== ОБЩИЙ ВЕРДИКТ ==');
    const score = verdictEl.querySelector('.score-val').textContent.replace('/10', '');
    const label = verdictEl.querySelector('.score-label').textContent;
    L.push('Оценка: ' + score + '/10 (' + label + ')');
    verdictEl.querySelectorAll('.v-good li').forEach(li => L.push('  + ' + li.textContent));
    verdictEl.querySelectorAll('.v-bad li').forEach(li => L.push('  - ' + li.textContent));
    L.push('');
  }

  const s = R.stats, ret = s.retention || {};
  L.push('== ПОКАЗАТЕЛИ ==');
  L.push('Пользователей за 30 дней: ' + num(s.mau_30d));
  L.push('Сегодня: ' + num(s.dau_today) + ' (вчера ' + num(s.dau_yesterday) + ')');
  L.push('Новых за 7 дней: ' + num(ret.new_7d) + ', вернувшихся: ' + num(ret.returning_7d));
  L.push('Всего визитов: ' + num(s.total_sessions) + ', действий: ' + num(s.total_hits));
  L.push('');
  L.push('== ТРАФИК ==');
  for (const rg of ['24h', '7d', '30d']) {
    const t = trafficCache[rg];
    if (!t) continue;
    const cur = num(t.cur_users), prev = num(t.prev_users);
    const d = prev > 0 ? Math.round((cur - prev) / prev * 100) : null;
    L.push((rg === '24h' ? '24 часа' : rg === '7d' ? '7 дней' : '30 дней') + ': ' + cur + ' польз.' + (d !== null ? ' (' + (d > 0 ? '+' : '') + d + '% к пред. периоду)' : ''));
  }
  const f = s.funnel || [];
  if (f.length) {
    L.push('');
    L.push('== ВОРОНКА ДЕЙСТВИЙ (уник. пользователи) ==');
    const base = f[0] ? f[0].sessions : 0;
    for (const x of f) {
      const e = EVENT_RU[x.event] ? EVENT_RU[x.event][1] : x.event;
      L.push(e + ': ' + x.sessions + (base ? ' (' + Math.round(100 * x.sessions / base) + '%)' : ''));
    }
  }
  
  const rawSources = s.sources || [];
  const groupedSourcesMap = {};
  rawSources.forEach(item => {
    const ruName = sourceRu(item.source);
    if (!groupedSourcesMap[ruName]) groupedSourcesMap[ruName] = 0;
    groupedSourcesMap[ruName] += item.sessions;
  });
  const sources = Object.keys(groupedSourcesMap)
    .map(k => ({ source: k, sessions: groupedSourcesMap[k] }))
    .sort((a, b) => b.sessions - a.sessions);

  if (sources.length) {
    L.push('');
    L.push('== ИСТОЧНИКИ ==');
    for (const x of sources.slice(0, 10)) L.push(x.source + ': ' + x.sessions);
  }

  const sf = R.srcf || [];
  if (sf.length) {
    L.push('');
    L.push('== ВОРОНКА ПО ИСТОЧНИКАМ (7 дней) ==');
    for (const r of sf) {
      L.push(r.source + ': открыли ' + r.visits + ', листали ' + r.panels + ' (' + (r.visits ? Math.round(100 * r.panels / r.visits) : 0) + '%), карточка ' + r.cards + ', куда ехать ' + r.advice + ', отметка ' + r.marks + ', PWA ' + r.installs);
    }
  }
  const cit = s.cities || [];
  if (cit.length) {
    L.push('');
    L.push('== ГОРОДА ==');
    for (const c of cit) L.push(cityRu(c.city) + ': ' + c.sessions);
  }
  const a = R.advisor;
  if (a && !a.error && a.total_advice) {
    L.push('');
    L.push('== СОВЕТНИК «КУДА ЕХАТЬ» ==');
    L.push('Принятие советов: ' + (a.acceptance_rate || 0) + '%');
    L.push('Всего советов: ' + num(a.total_advice) + ', маршрутов: ' + num(a.route_built_count));
    if (a.avg_session_duration != null) L.push('Средняя сессия: ' + Math.round(a.avg_session_duration / 60) + ' м ' + Math.round(a.avg_session_duration % 60) + ' с');
    const ta = a.top_advised_stations || [];
    if (ta.length) L.push('Топ по советам: ' + ta.slice(0, 5).map(x => x.name + ' (' + x.advice_count + ')').join(', '));
    const tr = a.top_routed_stations || [];
    if (tr.length) L.push('Топ по маршрутам: ' + tr.slice(0, 5).map(x => x.name + ' (' + x.route_count + ')').join(', '));
  }
  const h = R.hooks;
  if (h && !h.error) {
    L.push('');
    L.push('== КРЮЧКИ И ПОДПИСКА ==');
    const H = {};
    for (const x of (h.hooks || [])) H[x.event] = x;
    L.push('PWA установок: ' + (H.pwa_install ? H.pwa_install.sessions : 0));
    L.push('Кнопка Телеграм: ' + (H.tg_connect ? H.tg_connect.sessions : 0) + ', связок подтверждено: ' + (H.tg_linked ? H.tg_linked.sessions : 0));
    L.push('Сердечек избранного (события): ' + (H.fav_add ? H.fav_add.hits : 0));
    const fc = h.funnel_codes || {};
    L.push('Воронка подписки (7д): кодов ' + (fc.created || 0) + ' → /start ' + (fc.started || 0) + ' → включено ' + (fc.linked || 0));
    const fdv = h.fav_by_device || [];
    if (fdv.length) L.push('Избранное по водителям (состояние базы): ' + fdv.map(x => '#' + x.dev + '=' + x.favs).join(', '));
    const tf = h.top_fav_stations || [];
    if (tf.length) L.push('Топ избранных АЗС (состояние базы): ' + tf.map(x => x.name + ' (' + x.favs + ')').join(', '));
  }
  const eg = R.eng;
  if (eg && !eg.error) {
    L.push('');
    L.push('== ПРИВЫЧКА ==');
    L.push('Заходов в день на человека: ' + (eg.freq_avg != null ? eg.freq_avg : '—'));
    const d = eg.dur || {};
    L.push('Время до закрытия: медиана ' + fmtDur(d.p50) + ', 75% ' + fmtDur(d.p75) + ', 90% ' + fmtDur(d.p90) + ', дольше 2 мин ' + (d.share_long != null ? d.share_long + '%' : '—'));
    
    const fdRaw = eg.freq_dist || [];
    const fdMap = {};
    for (const x of fdRaw) {
      const m = fdMap[x.bucket] = fdMap[x.bucket] || { bucket: x.bucket, device_days: 0, ord: x.ord };
      m.device_days += x.device_days;
      m.ord = Math.min(m.ord, x.ord);
    }
    const fdTotal = fdRaw.reduce((s, x) => s + x.device_days, 0) || 1;
    const fd = Object.values(fdMap).sort((a, b) => a.ord - b.ord);
    for (const x of fd) x.pct = Math.round(100 * x.device_days / fdTotal);
    if (fd.length) L.push('Частота: ' + fd.map(x => x.bucket + ' р/день ' + x.pct + '%').join(', '));
  }

  const adv = ADVANCED_REPORT;
  if (adv && adv.bounce && !adv.bounce.error) {
    L.push('');
    L.push('== УХОДЫ И ГЛУБИНА ПРОСМОТРА ==');
    L.push('Показатель отказов: ' + adv.bounce.bounce_rate + '% (ушли за 10 сек)');
    L.push('Всего сессий: ' + adv.bounce.total_sessions);
  }
  if (adv && adv.cohort && adv.cohort.length) {
    L.push('');
    L.push('== ВОЗВРАЩАЕМОСТЬ (КОГОРТЫ) ==');
    for (const c of adv.cohort) {
      const dateStr = new Date(c.cohort_date).toLocaleDateString('ru-RU');
      L.push(dateStr + ': пришло ' + c.total_users + ' | вернулись на 1-й день ' + c.day1 + ' | на 7-й день ' + c.day7);
    }
  }

  const p = R.poll;
  if (p && !p.error && p.total_answers) {
    L.push('');
    L.push('== ОПРОСЫ ==');
    L.push('Ответов: ' + p.total_answers + ', респондентов: ' + p.unique_respondents + (p.avg_stars != null ? ', средняя оценка ' + p.avg_stars.toFixed(1) : ''));
    for (const q of (p.answers_by_question || [])) {
      const total = q.answers.reduce((sm, x) => sm + x.cnt, 0);
      L.push('· ' + (POLL_Q[q.question_key] || q.question_key));
      for (const an of q.answers) {
        const txt = q.question_key === 'stars' ? an.answer_key : (POLL_A[an.answer_key] || an.answer_key);
        L.push('   ' + txt + ': ' + an.cnt + ' (' + (total ? Math.round(100 * an.cnt / total) : 0) + '%)');
      }
    }
  }
  L.push('');
  L.push('Данные анонимны: без персональных данных, session_id случайный.');
  const blob = new Blob(['\ufeff' + L.join('\r\n')], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'kogdabenz_otchet_' + stamp + '.txt';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function p2(n) { return String(n).padStart(2, '0'); }

function fmtDur(s) {
  if (s === null || s === undefined) return '—';
  s = Math.round(s);
  if (s < 60) return s + ' с';
  const m = Math.floor(s / 60), r = s % 60;
  if (m < 60) return m + ' м ' + r + ' с';
  return Math.floor(m / 60) + ' ч ' + (m % 60) + ' м';
}

async function loadTraffic(range) {
  trafficRange = range;
  document.querySelectorAll('.tf-tab').forEach(t => t.classList.toggle('active', t.dataset.range === range));
  if (trafficCache[range]) { drawTraffic(trafficCache[range]); return; }
  const box = document.getElementById('trafficChart');
  if (!box) return;
  box.innerHTML = '<div class="loading" style="padding:30px"><div class="spinner"></div></div>';
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/dash_traffic_series', {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ secret: DASH_SECRET, p_range: range })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    trafficCache[range] = d;
    drawTraffic(d);
  } catch (e) {
    box.innerHTML = '<div class="note">График трафика недоступен: ' + e.message + '</div>';
  }
}

function trafficAxis(range) {
  const out = [];
  const now = new Date();
  if (range === '24h') {
    const start = new Date(now);
    start.setUTCMinutes(0, 0, 0);
    start.setUTCHours(start.getUTCHours() - 23);
    for (let i = 0; i < 24; i++) out.push({ t: new Date(start.getTime() + i * 3600000), users: 0, hits: 0 });
  } else {
    const days = range === '7d' ? 7 : 30;
    const start = new Date(now);
    start.setUTCHours(0, 0, 0, 0);
    start.setUTCDate(start.getUTCDate() - (days - 1));
    for (let i = 0; i < days; i++) out.push({ t: new Date(start.getTime() + i * 86400000), users: 0, hits: 0 });
  }
  return out;
}
function bucketKey(d, range) {
  const dd = String(d.getUTCDate()).padStart(2, '0'), mm = String(d.getUTCMonth() + 1).padStart(2, '0');
  return range === '24h'
    ? d.getUTCFullYear() + '-' + mm + '-' + dd + 'T' + String(d.getUTCHours()).padStart(2, '0') + ':00:00Z'
    : d.getUTCFullYear() + '-' + mm + '-' + dd + 'T00:00:00Z';
}

function drawTraffic(d) {
  const range = d.range || trafficRange;
  const axis = trafficAxis(range);
  const byKey = {};
  for (const b of (d.buckets || [])) byKey[b.t] = b;
  for (const p of axis) {
    const b = byKey[bucketKey(p.t, range)];
    if (b) { p.users = Number(b.users) || 0; p.hits = Number(b.hits) || 0; }
  }
  const head = document.getElementById('trafficHead');
  if (head) {
    const cur = num(d.cur_users), prev = num(d.prev_users);
    const periodRu = range === '24h' ? '24 часа' : range === '7d' ? 'неделю' : 'месяц';
    const delta = prev > 0 ? Math.round((cur - prev) / prev * 100) : null;
    head.innerHTML = '<div class="tf-num">' + cur + '<small>пользователей за ' + periodRu + '</small></div>' +
      (delta === null
        ? '<span class="tf-badge neutral">за прошлый период данных нет</span>'
        : '<span class="tf-badge ' + (delta > 0 ? 'up' : delta < 0 ? 'down' : 'neutral') + '">' +
          (delta > 0 ? '+' : delta < 0 ? '−' : '±') + Math.abs(delta) + '% к прошлому периоду</span>');
  }
  const box = document.getElementById('trafficChart');
  if (!box) return;
  const W = Math.max(320, box.clientWidth || 800), H = 260, PL = 8, PR = 40, PT = 16, PB = 24;
  const iw = W - PL - PR, ih = H - PT - PB;
  const maxV = Math.max(1, ...axis.map(p => p.users));
  const x = i => PL + (axis.length === 1 ? iw / 2 : i * iw / (axis.length - 1));
  const y = v => PT + ih - (v / maxV) * ih;
  let line = '';
  axis.forEach((p, i) => { line += (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.users).toFixed(1); });
  const area = line + 'L' + x(axis.length - 1).toFixed(1) + ' ' + (PT + ih) + 'L' + x(0).toFixed(1) + ' ' + (PT + ih) + 'Z';
  let grid = '';
  [maxV, Math.ceil(maxV / 2), 0].forEach(v => {
    const gy = y(v).toFixed(1);
    grid += '<line x1="' + PL + '" y1="' + gy + '" x2="' + (W - PR) + '" y2="' + gy + '" stroke="#e2e8f0" stroke-width="1"/>' +
      '<text x="' + (W - PR + 6) + '" y="' + (Number(gy) + 4) + '" font-size="10" fill="#94a3b8">' + v + '</text>';
  });
  let xl = '';
  const stepLbl = Math.max(1, Math.round(axis.length / 4));
  for (let i = 0; i < axis.length; i += stepLbl) {
    const dt = new Date(axis[i].t.getTime() + 3 * 3600000);
    const s = range === '24h'
      ? String(dt.getUTCHours()).padStart(2, '0') + ':00'
      : String(dt.getUTCDate()).padStart(2, '0') + '.' + String(dt.getUTCMonth() + 1).padStart(2, '0');
    xl += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" font-size="10" fill="#94a3b8" text-anchor="middle">' + s + '</text>';
  }
  const lastI = axis.length - 1;
  box.innerHTML =
    '<svg class="tf-svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' +
    '<defs><linearGradient id="tfGrad" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="#3b82f6" stop-opacity=".26"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient></defs>' +
    grid +
    '<path d="' + area + '" fill="url(#tfGrad)"/>' +
    '<path d="' + line + '" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + x(lastI).toFixed(1) + '" cy="' + y(axis[lastI].users).toFixed(1) + '" r="4" fill="#3b82f6" stroke="#fff" stroke-width="2"/>' +
    xl +
    '<line id="tfCross" x1="0" x2="0" y1="' + PT + '" y2="' + (PT + ih) + '" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>' +
    '<circle id="tfDot" r="4" fill="#fff" stroke="#3b82f6" stroke-width="2.5" style="display:none"/>' +
    '</svg>' +
    '<div class="tf-tip" id="tfTip" style="display:none"></div>';
  const svg = box.querySelector('svg');
  const tip = box.querySelector('#tfTip');
  const cross = box.querySelector('#tfCross');
  const dot = box.querySelector('#tfDot');
  const move = ev => {
    const r = svg.getBoundingClientRect();
    const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const frac = Math.max(0, Math.min(1, (cx - r.left) / r.width));
    const i = Math.round(frac * (axis.length - 1));
    const p = axis[i];
    const px = x(i), py = y(p.users);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.style.display = '';
    dot.setAttribute('cx', px); dot.setAttribute('cy', py); dot.style.display = '';
    const dt = new Date(p.t.getTime() + 3 * 3600000);
    const when = range === '24h'
      ? String(dt.getUTCDate()).padStart(2, '0') + '.' + String(dt.getUTCMonth() + 1).padStart(2, '0') + ' ' + String(dt.getUTCHours()).padStart(2, '0') + ':00'
      : String(dt.getUTCDate()).padStart(2, '0') + '.' + String(dt.getUTCMonth() + 1).padStart(2, '0');
    tip.textContent = when + ' — ' + p.users + ' польз. · ' + p.hits + ' действий';
    tip.style.display = '';
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(4, Math.min(r.width - tw - 4, px - tw / 2)) + 'px';
  };
  const hide = () => { cross.style.display = 'none'; dot.style.display = 'none'; tip.style.display = 'none'; };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', hide);
}

let tfResizeT = null;
window.addEventListener('resize', () => {
  clearTimeout(tfResizeT);
  tfResizeT = setTimeout(() => { if (trafficCache[trafficRange]) drawTraffic(trafficCache[trafficRange]); }, 200);
});
load();
</script>
</body>
</html>
