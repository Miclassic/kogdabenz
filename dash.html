<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КогдаБенз · Аналитика</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --primary: #2465ee;
    --primary-light: #397cff;
    --success: #19b77a;
    --warning: #f5a05a;
    --danger: #ef5350;
    --text-primary: #14213d;
    --text-secondary: #71809c;
    --text-tertiary: #93a1b8;
    --bg-primary: #f7f9fc;
    --bg-card: #ffffff;
    --border: #e6ebf4;
    --shadow-sm: 0 1px 3px rgba(20,33,61,.06);
    --shadow: 0 2px 8px rgba(20,33,61,.08);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  .container { max-width: 1360px; margin: 0 auto; padding: 20px; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--border);
  }

  .header h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text-primary);
  }

  .header .subtitle {
    color: var(--text-secondary);
    font-size: 12px;
    margin-top: 3px;
    font-weight: 600;
  }

  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px;
    background: linear-gradient(135deg, #e5f8ef, #dff5e9);
    border: 1px solid #bfe8d4;
    border-radius: 18px;
    font-size: 11px;
    font-weight: 700;
    color: #12855c;
  }

  .header-badge::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.2); }
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }

  .kpi-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
    opacity: 0.6;
  }

  .kpi-card:hover {
    box-shadow: var(--shadow);
    transform: translateY(-1px);
  }

  .kpi-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 6px;
  }

  .kpi-value {
    font-size: 28px;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -0.8px;
    line-height: 1;
    margin-bottom: 4px;
  }

  .kpi-change {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 5px;
  }

  .kpi-change.positive {
    background: #e5f8ef;
    color: #12855c;
  }

  .kpi-change.negative {
    background: #fdecec;
    color: #c2403f;
  }

  .kpi-change.neutral {
    background: #f2f4f9;
    color: var(--text-secondary);
  }

  .kpi-subtitle {
    font-size: 10px;
    color: var(--text-tertiary);
    margin-top: 5px;
    font-weight: 600;
  }

  .kpi-spark {
    position: absolute;
    bottom: 8px;
    right: 12px;
    width: 60px;
    height: 24px;
    opacity: 0.35;
  }

  .section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .section-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .section-icon {
    font-size: 17px;
  }

  .chart-container {
    position: relative;
    width: 100%;
    height: 280px;
    margin: 12px 0;
  }

  .bar-chart {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .bar-item {
    display: grid;
    grid-template-columns: 180px 1fr 70px;
    gap: 10px;
    align-items: center;
    padding: 6px 0;
  }

  .bar-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .bar-track {
    height: 26px;
    background: #f7f9fc;
    border-radius: 7px;
    overflow: hidden;
    position: relative;
  }

  .bar-fill {
    height: 100%;
    border-radius: 7px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }

  .bar-fill.primary {
    background: linear-gradient(90deg, #2465ee, #397cff);
  }

  .bar-fill.success {
    background: linear-gradient(90deg, #19b77a, #2fd39a);
  }

  .bar-fill.warning {
    background: linear-gradient(90deg, #f5a05a, #ffb46a);
  }

  .bar-value {
    font-size: 12px;
    font-weight: 800;
    color: var(--text-primary);
    text-align: right;
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  .data-table th {
    text-align: left;
    padding: 10px 8px;
    font-size: 10px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    border-bottom: 2px solid var(--border);
  }

  .data-table td {
    padding: 9px 8px;
    border-bottom: 1px solid var(--border);
  }

  .data-table tr:last-child td {
    border-bottom: none;
  }

  .data-table tr:hover {
    background: #f8fafc;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 8px;
    border-radius: 5px;
    font-size: 10px;
    font-weight: 700;
  }

  .badge-primary {
    background: #e7f0ff;
    color: #2465ee;
  }

  .badge-success {
    background: #e5f8ef;
    color: #12855c;
  }

  .badge-warning {
    background: #fff2e8;
    color: #c26a2a;
  }

  .note {
    margin-top: 12px;
    padding: 10px 12px;
    background: #f7f9fc;
    border-left: 3px solid var(--primary);
    border-radius: 7px;
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 1.5;
    font-weight: 600;
  }

  .tf-tabs {
    display: flex;
    gap: 3px;
    background: #f2f4f9;
    border-radius: 9px;
    padding: 3px;
  }

  .tf-tab {
    border: 0;
    background: transparent;
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 700;
    padding: 5px 11px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .tf-tab.active {
    background: #fff;
    color: var(--text-primary);
    box-shadow: 0 2px 6px rgba(20,33,61,.1);
  }

  .tf-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin: 3px 0 8px;
  }

  .tf-num {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.8px;
    color: var(--text-primary);
  }

  .tf-num small {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-left: 6px;
    letter-spacing: 0;
  }

  .tf-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
  }

  .tf-badge.up {
    background: #e5f8ef;
    color: #12855c;
  }

  .tf-badge.down {
    background: #fdecec;
    color: #c2403f;
  }

  .tf-badge.neutral {
    background: #f2f4f9;
    color: var(--text-secondary);
  }

  .chart-wrap {
    position: relative;
  }

  .tf-svg {
    display: block;
    width: 100%;
  }

  .tf-tip {
    position: absolute;
    top: 6px;
    left: 0;
    background: #14213d;
    color: #fff;
    font-size: 10px;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 7px;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 0 6px 16px rgba(20,33,61,.25);
    z-index: 5;
  }

  .error {
    padding: 20px;
    background: #fdecec;
    border: 1px solid #f3b7b3;
    border-radius: 12px;
    color: #c2403f;
    font-weight: 700;
    text-align: center;
    font-size: 13px;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 768px) {
    .container { padding: 14px; }
    .header h1 { font-size: 19px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .grid-2 { grid-template-columns: 1fr; }
    .bar-item { grid-template-columns: 140px 1fr 60px; }
    .bar-label { font-size: 11px; }
    .section { padding: 14px; }
  }

  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 50px;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid #e2e8f0;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin-right: 11px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>⛽ КогдаБенз · Аналитика</h1>
      <div class="subtitle">Анонимная статистика использования сайта</div>
    </div>
    <div class="header-badge">Обновлено только что</div>
  </div>

  <div id="app">
    <div class="loading">
      <div class="spinner"></div>
      <span>Загрузка данных...</span>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://api.kogdabenz.ru';
const SUPABASE_KEY = 'eyJhbGciOiAiSFMyNTYiLCAidHlwIjogIkpXVCJ9.eyJyb2xlIjogImFub24iLCAiaXNzIjogImtvZ2RhYmVueiIsICJpYXQiOiAxNzkzMTgwMDg2LCAiZXhwIjogMjEwODU0MDA4Nn0.XgC7MHgl-gwkbPeOUP8rtCR4wt5Ddcw4TDfy5elrzTQ';
const DASH_SECRET = 'kb-dash-2026-x9f3k';

const POLL_Q = {
  arrive_truth: 'Подъехали к заправке — информация совпала?',
  usability: 'Сайтом удобно пользоваться?',
  map_clear: 'Карта понятна?',
  forecast_true: 'Прогнозы сбываются?',
  marks_why: 'Почему оставляете отметки?',
  stars: 'Оценка сайта',
  advice_outcome: 'Результат совета «Куда ехать»'
};

const POLL_A = {
  match: 'Всё совпало', almost: 'Почти совпало', wrong: 'Не совпало', notyet: 'Ещё не проверял',
  great: 'Очень удобно', ok: 'В целом удобно', confuse: 'Иногда путаюсь', bad: 'Неудобно',
  glance: 'Да, с первого взгляда', legend: 'Подсматриваю в легенду', no: 'Не понимаю',
  always: 'Почти всегда', half: 'Примерно через раз', rare: 'Редко',
  help: 'Хочу помочь городу', sometimes: 'Иногда', whynot: 'Не понимаю зачем', hard: 'Неудобно',
  fuel: 'Доехал и заправился', miss: 'Не как ожидал', notwent: 'Ещё не доехал', noadv: 'Не воспользовался'
};

const EVENT_RU = {
  pageview: ['👀', 'Открыли сайт'],
  panel_view: ['📖', 'Листали панели'],
  open_station_card: ['⛽', 'Открывали карточку АЗС'],
  click_where_to_go: ['🧭', 'Жали «Куда ехать»'],
  feedback_submit: ['🙏', 'Оставляли отметку']
};

const CITY_RU = {
  novorossiysk: 'Новороссийск', gelendzhik: 'Геленджик', anapa: 'Анапа',
  krymsk: 'Крымск', krasnodar: 'Краснодар', sochi: 'Сочи',
  tuapse: 'Туапсе', armavir: 'Армавир', maykop: 'Майкоп'
};

function cityRu(c) { return CITY_RU[c] || (c === 'unknown' ? 'Не определён' : c); }

function sourceRu(s) {
  if (s === 'direct') return 'Напрямую';
  if (s.indexOf('ref: ') === 0) {
    const m = s.slice(5).match(/\/\/([^\/]+)/);
    const host = (m ? m[1] : s.slice(5)).replace(/^www\./, '');
    const known = [['vk.com','ВКонтакте'],['t.me','Телеграм'],['yandex','Яндекс'],['google','Google']];
    for (const k of known) if (host.indexOf(k[0]) >= 0) return k[1];
    return host;
  }
  if (s.indexOf('utm: ') === 0) return 'Реклама: ' + s.slice(5).split(' / ')[0];
  return s;
}

function num(v) { return (v === null || v === undefined) ? 0 : v; }

function formatNumber(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return n.toString();
}

async function load() {
  const app = document.getElementById('app');
  try {
    const [statsRes, pollRes, advisorRes, hooksRes, engRes] = await Promise.all([
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_stats', {
        method: 'POST',
        headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: DASH_SECRET })
      }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_poll_stats', {
        method: 'POST',
        headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: DASH_SECRET })
      }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_advisor_stats', {
        method: 'POST',
        headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: DASH_SECRET })
      }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_hooks_stats', {
        method: 'POST',
        headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: DASH_SECRET })
      }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_engagement_stats', {
        method: 'POST',
        headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: DASH_SECRET })
      }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_source_funnel', {
        method: 'POST',
        headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: DASH_SECRET })
      })
    ]);

    if (!statsRes.ok || !pollRes.ok || !advisorRes.ok || !hooksRes.ok || !engRes.ok || !srcfRes.ok) throw new Error('HTTP error');

    const [stats, poll, advisor, hooks, eng, srcf] = await Promise.all([statsRes.json(), pollRes.json(), advisorRes.json(), hooksRes.json(), engRes.json(), srcfRes.json()]);
    if (stats.error) throw new Error('Invalid token');

    render(stats, poll, advisor, hooks, eng, srcf);
  } catch (e) {
    app.innerHTML = '<div class="error">Ошибка загрузки: ' + e.message + '</div>';
  }
}

function render(stats, poll, advisor, hooks, eng, srcf) {
  const app = document.getElementById('app');
  let html = '';

  // KPI Cards
  const ret = stats.retention || {};
  const dauChange = stats.dau_yesterday > 0 ? ((stats.dau_today - stats.dau_yesterday) / stats.dau_yesterday * 100).toFixed(1) : 0;
  const dauChangeClass = dauChange > 0 ? 'positive' : dauChange < 0 ? 'negative' : 'neutral';
  const dauChangeIcon = dauChange > 0 ? '↑' : dauChange < 0 ? '↓' : '→';

  html += '<div class="kpi-grid">';
  
  html += `<div class="kpi-card">
    <div class="kpi-label">Пользователи за 30 дней</div>
    <div class="kpi-value">${formatNumber(num(stats.mau_30d))}</div>
    <div class="kpi-subtitle">Уникальных посетителей</div>
  </div>`;

  html += `<div class="kpi-card">
    <div class="kpi-label">Активность сегодня</div>
    <div class="kpi-value">${num(stats.dau_today)}</div>
    <div class="kpi-change ${dauChangeClass}">${dauChangeIcon} ${Math.abs(dauChange)}% vs вчера</div>
    <div class="kpi-subtitle">Вчера: ${num(stats.dau_yesterday)}</div>
  </div>`;

  html += `<div class="kpi-card">
    <div class="kpi-label">Новые за неделю</div>
    <div class="kpi-value">${formatNumber(num(ret.new_7d))}</div>
    <div class="kpi-subtitle">Вернувшихся: ${formatNumber(num(ret.returning_7d))}</div>
  </div>`;

  html += `<div class="kpi-card">
    <div class="kpi-label">Всего сессий</div>
    <div class="kpi-value">${formatNumber(num(stats.total_sessions))}</div>
    <div class="kpi-subtitle">Действий: ${formatNumber(num(stats.total_hits))}</div>
  </div>`;

  html += '</div>';

  // Трафик: график в стиле биржевого, периоды 24h / 1W / 1M (данные добирает loadTraffic)
  html += '<div class="section">' +
    '<div class="section-header"><div class="section-title"><span class="section-icon">📈</span>Пользователи по периодам</div>' +
    '<div class="tf-tabs">' +
    '<button class="tf-tab active" data-range="24h" onclick="loadTraffic(\'24h\')">24h</button>' +
    '<button class="tf-tab" data-range="7d" onclick="loadTraffic(\'7d\')">1W</button>' +
    '<button class="tf-tab" data-range="30d" onclick="loadTraffic(\'30d\')">1M</button>' +
    '</div></div>' +
    '<div class="tf-head" id="trafficHead"></div>' +
    '<div class="chart-wrap" id="trafficChart"><div class="loading" style="padding:30px"><div class="spinner"></div></div></div>' +
    '<div class="note">Уникальные пользователи = разные session_id за час (24h) или за день (1W/1M). Дельта — к такому же предыдущему периоду: для 24h к прошлым суткам, для недели к прошлой неделе. Палец или курсор по графику показывает точку целиком.</div>' +
    '</div>';

  // Funnel
  const funnel = stats.funnel || [];
  if (funnel.length > 0) {
    html += '<div class="section">';
    html += '<div class="section-header"><div class="section-title"><span class="section-icon">🎯</span>Действия пользователей</div></div>';
    html += '<div class="bar-chart">';
    
    const maxFunnel = Math.max(...funnel.map(f => f.sessions));
    funnel.forEach(f => {
      const event = EVENT_RU[f.event] || ['•', f.event];
      const width = (f.sessions / maxFunnel * 100);
      html += `<div class="bar-item">
        <div class="bar-label">${event[0]} ${event[1]}</div>
        <div class="bar-track"><div class="bar-fill primary" style="width: ${width}%"></div></div>
        <div class="bar-value">${formatNumber(f.sessions)}</div>
      </div>`;
    });
    
    html += '</div>';
    html += '<div class="note">Сколько уникальных пользователей выполнили каждое действие хотя бы раз.</div>';
    html += '</div>';
  }

  // Sources
  const sources = stats.sources || [];
  if (sources.length > 0) {
    html += '<div class="section">';
    html += '<div class="section-header"><div class="section-title"><span class="section-icon">🔗</span>Источники трафика</div></div>';
    html += '<div class="bar-chart">';
    
    const maxSrc = Math.max(...sources.map(s => s.sessions));
    sources.slice(0, 10).forEach(s => {
      const width = (s.sessions / maxSrc * 100);
      html += `<div class="bar-item">
        <div class="bar-label">${sourceRu(s.source)}</div>
        <div class="bar-track"><div class="bar-fill success" style="width: ${width}%"></div></div>
        <div class="bar-value">${formatNumber(s.sessions)}</div>
      </div>`;
    });
    
    html += '</div>';
    html += '<div class="note">Откуда пользователи приходят на сайт. «Напрямую» — закладки, иконки, прямые ссылки.</div>';
    html += '</div>';
  }

  // Cities
  const cities = stats.cities || [];
  if (cities.length > 0) {
    html += '<div class="section">';

    const maxCity = Math.max(...cities.map(c => c.sessions));

    html += '</div>';
    html += '<div class="note">Город определяется по координатам устройства. Тот же город, что показывается в списке АЗС.</div>';
    html += '</div>';
  }

  // Polls
  if (poll && !poll.error && poll.total_answers > 0) {
    html += '<div class="section">';
    html += '<div class="section-header"><div class="section-title"><span class="section-icon">💬</span>Опросы водителей</div></div>';

      <div class="kpi-card">
        <div class="kpi-label">Уникальных респондентов</div>
        <div class="kpi-value">${formatNumber(poll.unique_respondents)}</div>
      </div>
      ${poll.avg_stars !== null ? `<div class="kpi-card">
        <div class="kpi-label">Средняя оценка</div>
        <div class="kpi-value">${poll.avg_stars.toFixed(1)} ★</div>
      </div>` : ''}
    </div>`;

    if (poll.answers_by_question) {
      poll.answers_by_question.forEach(q => {
        const qText = POLL_Q[q.question_key] || q.question_key;
        const total = q.answers.reduce((s, a) => s + a.cnt, 0);
        const maxCnt = Math.max(...q.answers.map(a => a.cnt));
        
        html += `<div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);">
          <div style="font-size: 14px; font-weight: 700; margin-bottom: 10px;">${qText}</div>
          <div class="bar-chart">`;
        
        q.answers.forEach(a => {
          let aText = q.question_key === 'stars' ? a.answer_key.replace('star', '').split('_')[0] + ' ★' : (POLL_A[a.answer_key] || a.answer_key);
          const pct = total > 0 ? Math.round(a.cnt / total * 100) : 0;
          const width = (a.cnt / maxCnt * 100);
          const barClass = pct >= 50 ? 'success' : pct >= 25 ? 'warning' : 'primary';
          
          html += `<div class="bar-item">
            <div class="bar-label">${aText}</div>
            <div class="bar-track"><div class="bar-fill ${barClass}" style="width: ${width}%"></div></div>
            <div class="bar-value">${a.cnt} (${pct}%)</div>
          </div>`;
        });
        
        html += '</div></div>';
      });
    }
    
    html += '<div class="note">Ответы полностью анонимны. Звёзды показывают распределение оценок от 1 до 5.</div>';
    html += '</div>';
  }

  // Advisor
  if (advisor && !advisor.error && advisor.total_advice > 0) {
    html += '<div class="section">';
    html += '<div class="section-header"><div class="section-title"><span class="section-icon">🧭</span>Советник «Куда ехать»</div></div>';
    
    const acceptanceRate = advisor.acceptance_rate || 0;
    
    html += `<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px;">
      <div class="kpi-card">
        <div class="kpi-label">Принятие советов</div>
        <div class="kpi-value">${acceptanceRate.toFixed(1)}%</div>
        <div class="kpi-subtitle">Маршрут к той же станции</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Всего советов</div>
        <div class="kpi-value">${formatNumber(advisor.total_advice)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Построено маршрутов</div>
        <div class="kpi-value">${formatNumber(advisor.route_built_count)}</div>
      </div>
      ${advisor.avg_session_duration !== null ? `<div class="kpi-card">
        <div class="kpi-label">Средняя сессия</div>
        <div class="kpi-value">${Math.round(advisor.avg_session_duration / 60)}м ${Math.round(advisor.avg_session_duration % 60)}с</div>
      </div>` : ''}
    </div>`;

    if (advisor.top_advised_stations && advisor.top_advised_stations.length > 0) {
      html += '<div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);">';
      html += '<div style="font-size: 14px; font-weight: 700; margin-bottom: 10px;">Топ станций по советам</div>';
      html += '<div class="bar-chart">';
      
      const maxAdv = Math.max(...advisor.top_advised_stations.map(s => s.advice_count));
      advisor.top_advised_stations.slice(0, 5).forEach(s => {
        const width = (s.advice_count / maxAdv * 100);
        html += `<div class="bar-item">
          <div class="bar-label">${s.name}</div>
          <div class="bar-track"><div class="bar-fill primary" style="width: ${width}%"></div></div>
          <div class="bar-value">${s.advice_count}</div>
        </div>`;
      });
      
      html += '</div></div>';
    }
    
    if (advisor.top_routed_stations && advisor.top_routed_stations.length > 0) {
      html += '<div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);">';
      html += '<div style="font-size: 14px; font-weight: 700; margin-bottom: 10px;">Топ станций по маршрутам</div>';
      html += '<div class="bar-chart">';
      
      const maxRoute = Math.max(...advisor.top_routed_stations.map(s => s.route_count));
      advisor.top_routed_stations.slice(0, 5).forEach(s => {
        const width = (s.route_count / maxRoute * 100);
        html += `<div class="bar-item">
          <div class="bar-label">${s.name}</div>
          <div class="bar-track"><div class="bar-fill success" style="width: ${width}%"></div></div>
          <div class="bar-value">${s.route_count}</div>
        </div>`;
      });
      
      html += '</div></div>';
    }
    
    html += '<div class="note">Доля принятия показывает, насколько точно советник попадает в потребности пользователей.</div>';
    html += '</div>';
  }

  html += renderHooks(hooks);
  html += renderEngagement(eng);
  html += renderSourceFunnel(srcf);
  app.innerHTML = html;
  loadTraffic(trafficRange); // график трафика живёт своим запросом, не тормозит остальные блоки
}

// === Воронка по источникам за 7 дней: реклама против органики и прямых ===
// Считаем уникальных session_id по строкам событий: каждая строка несёт
// utm/referrer своего захода, поэтому сегментация честная по визитам.
function renderSourceFunnel(list) {
  if (!list || !list.length) return '';
  const cell = (n, r) => r.visits ? n + ' <small style="color:#94a3b8">(' + Math.round(100 * n / r.visits) + '%)</small>' : String(n);
  let out = '<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">🧭</span>Воронка по источникам · 7 дней</div></div>';
  out += '<div style="overflow-x:auto"><table class="data-table"><tr><th>Источник</th><th>Открыли</th><th>Листали</th><th>Карточка</th><th>Куда ехать</th><th>Отметка</th><th>PWA</th></tr>';
  for (const r of list) {
    out += '<tr><td><b>' + r.source + '</b></td><td>' + r.visits + '</td><td>' + cell(r.panels, r) + '</td><td>' + cell(r.cards, r) + '</td><td>' + cell(r.advice, r) + '</td><td>' + cell(r.marks, r) + '</td><td>' + cell(r.installs, r) + '</td></tr>';
  }
  out += '</table></div>';
  out += '<div class="note">Проценты — от открывших сайт из этого источника. Сравнивай строки между собой: если у «Реклама: yandex» доли листали/совет заметно ниже органики — холодный трафик не понимает первый экран, и чинить надо посадочную, а не кампанию. Устройство, заходившее с разными источниками, попадёт в обе строки — это честно.</div></div>';
  return out;
}
// === Привычка: частота заходов в день и время в сайте до закрытия ===
// Частота — по device_id: сколько разных сессий открывает один телефон за день.
// Время — из session_end (duration_sec), сайт шлёт его при закрытии/сворачивании.
function fmtDur(s) {
  if (s === null || s === undefined) return '—';
  s = Math.round(s);
  if (s < 60) return s + ' с';
  const m = Math.floor(s / 60), r = s % 60;
  if (m < 60) return m + ' м ' + r + ' с';
  return Math.floor(m / 60) + ' ч ' + (m % 60) + ' м';
}
function renderEngagement(eng) {
  if (!eng || eng.error) return '';
  const d = eng.dur || {};
  const favg = (eng.freq_avg === null || eng.freq_avg === undefined) ? '—' : Number(eng.freq_avg).toFixed(2).replace('.', ',');
  let out = '<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">⏱️</span>Привычка: частота и время</div></div>';
  out += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px">' +
    '<div class="kpi-card"><div class="kpi-label">Заходов в день на человека</div><div class="kpi-value">' + favg + '</div><div class="kpi-subtitle">среднее за 7 дней</div></div>' +
    '<div class="kpi-card"><div class="kpi-label">Медиана времени в сайте</div><div class="kpi-value">' + fmtDur(d.p50) + '</div><div class="kpi-subtitle">75%: ' + fmtDur(d.p75) + ' · 90%: ' + fmtDur(d.p90) + '</div></div>' +
    '<div class="kpi-card"><div class="kpi-label">Сессии дольше 2 минут</div><div class="kpi-value">' + (d.share_long !== undefined ? d.share_long + '%' : '—') + '</div><div class="kpi-subtitle">из ' + (d.n || 0) + ' закрытий за 30 дней</div></div>' +
    '</div>';
  const fdRaw = eng.freq_dist || [];
  const fdMap = {};
  for (const x of fdRaw) {
    const m = fdMap[x.bucket] = fdMap[x.bucket] || { bucket: x.bucket, device_days: 0, ord: x.ord };
    m.device_days += x.device_days;
    m.ord = Math.min(m.ord, x.ord);
  }
  const fdTotal = fdRaw.reduce((s, x) => s + x.device_days, 0) || 1;
  const fd = Object.values(fdMap).sort((a, b) => a.ord - b.ord);
  for (const x of fd) x.pct = Math.round(100 * x.device_days / fdTotal);
  if (fd.length) {
    const max = Math.max(...fd.map(x => x.device_days));
    out += '<div style="font-size:14px;font-weight:700;margin-bottom:8px">Сколько раз в день заходят</div><div class="bar-chart">';
    for (const x of fd) out += '<div class="bar-item"><div class="bar-label">' + x.bucket + ' раз(а) в день</div><div class="bar-track"><div class="bar-fill primary" style="width:' + Math.round(x.device_days / max * 100) + '%"></div></div><div class="bar-value">' + x.pct + '%</div></div>';
    out += '</div>';
  }
  const db = eng.dur_buckets || [];
  if (db.length) {
    const max = Math.max(...db.map(x => x.cnt));
    out += '<div style="font-size:14px;font-weight:700;margin:14px 0 8px">Сколько времени до закрытия</div><div class="bar-chart">';
    for (const x of db) out += '<div class="bar-item"><div class="bar-label">' + x.label + '</div><div class="bar-track"><div class="bar-fill success" style="width:' + Math.round(x.cnt / max * 100) + '%"></div></div><div class="bar-value">' + x.cnt + '</div></div>';
    out += '</div>';
  }
  const days = eng.days || [];
  if (days.length) {
    out += '<div style="font-size:14px;font-weight:700;margin:14px 0 8px">Последние 7 дней: сессии на человека</div><table class="data-table"><tr><th>День</th><th>Людей</th><th>Сессий</th><th>Сессий/чел</th></tr>';
    for (const x of days) out += '<tr><td>' + x.d + '</td><td>' + x.devices + '</td><td>' + x.sessions + '</td><td><b>' + Number(x.per_dev).toFixed(2).replace('.', ',') + '</b></td></tr>';
    out += '</table>';
  }
  out += '<div class="note">Частота считается по device_id: сколько разных сессий открывает один телефон за день (1 раз — зашёл и ушёл, 2+ — возвращается проверять в течение дня). Время — от открытия до закрытия вкладки, событие session_end.</div></div>';
  return out;
}
// === Крючки привычки: PWA-установка, Телеграм-связка, избранное ===
// Кто сколько добавил в избранное — из серверной таблицы user_favorites
// (хвост device_id анонимный), а откуда приходили сердечки — из site_hits с utm.
function renderHooks(hooks) {
  if (!hooks || hooks.error) return '';
  const H = {};
  for (const r of (hooks.hooks || [])) H[r.event] = r;
  const card = (label, sub, r) => '<div class="kpi-card"><div class="kpi-label">' + label + '</div><div class="kpi-value">' + (r ? r.sessions : 0) + '</div><div class="kpi-subtitle">' + sub + (r ? r.hits : 0) + '</div></div>';
  let out = '<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">🪝</span>Крючки: установка · Телеграм · избранное</div></div>';
  out += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px">' +
    card('Установили PWA', 'установок: ', H.pwa_install) +
    card('Кнопка «Телеграм»', 'нажатий: ', H.tg_connect) +
    card('Связка подтверждена', 'включений: ', H.tg_linked) +
    card('Сердечко избранного', 'добавлений: ', H.fav_add) +
    '</div>';
  const devs = hooks.fav_by_device || [];
  if (devs.length) {
    out += '<div style="font-size:14px;font-weight:700;margin-bottom:8px">Кто сколько держит в избранном</div><table class="data-table"><tr><th>Водитель</th><th>АЗС в избранном</th></tr>';
    for (const d of devs) out += '<tr><td>#' + d.dev + '</td><td><b>' + d.favs + '</b></td></tr>';
    out += '</table>';
  }
  const tops = hooks.top_fav_stations || [];
  if (tops.length) {
    const max = Math.max(...tops.map(t => t.favs));
    out += '<div style="font-size:14px;font-weight:700;margin:14px 0 8px">Самые избранные АЗС</div><div class="bar-chart">';
    for (const t of tops) out += '<div class="bar-item"><div class="bar-label">' + t.name + '</div><div class="bar-track"><div class="bar-fill warning" style="width:' + Math.round(t.favs / max * 100) + '%"></div></div><div class="bar-value">' + t.favs + '</div></div>';
    out += '</div>';
  }
  // === воронка подписки: код → /start → включён ===
  const fn = hooks.funnel_codes || {};
  const rec = hooks.codes_recent || [];
  if (fn.created || fn.started || fn.linked) {
    const pct = (n, d) => d ? Math.round(100 * n / d) : 0;
    out += '<div style="font-size:14px;font-weight:700;margin:14px 0 8px">Воронка подписки (за 7 дней)</div>';
    out += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px">' +
      '<div class="kpi-card" style="padding:10px"><div class="kpi-label">Код создан</div><div class="kpi-value" style="font-size:22px">' + (fn.created || 0) + '</div><div class="kpi-subtitle">100%</div></div>' +
      '<div class="kpi-card" style="padding:10px"><div class="kpi-label">Нажали /start</div><div class="kpi-value" style="font-size:22px">' + (fn.started || 0) + '</div><div class="kpi-subtitle">' + pct(fn.started, fn.created) + '%</div></div>' +
      '<div class="kpi-card" style="padding:10px"><div class="kpi-label">Включили уведомления</div><div class="kpi-value" style="font-size:22px">' + (fn.linked || 0) + '</div><div class="kpi-subtitle">' + pct(fn.linked, fn.started) + '%</div></div>' +
      '</div>';
  }
  if (rec.length) {
    out += '<table class="data-table"><tr><th>Код</th><th>Устройство</th><th>Станция</th><th>Статус</th><th>Создан</th></tr>';
    for (const r of rec) {
      const stName = r.station_id ? (allStations && (allStations.find(s => s.id === r.station_id) || {}).name) || r.station_id.slice(0, 8) : '—';
      const stColor = r.status === 'linked' ? '#12855c' : r.status === 'started' ? '#c26a2a' : '#94a3b8';
      const stLabel = r.status === 'linked' ? '✓ включён' : r.status === 'started' ? '/start без link' : 'ждёт';
      const d = new Date(r.created_at);
      const when = String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      out += '<tr><td><code style="font-size:10px">' + (r.code || '—').slice(0, 10) + '</code></td><td>#' + (r.dev || '—') + '</td><td>' + stName + '</td><td><b style="color:' + stColor + '">' + stLabel + '</b></td><td style="color:#94a3b8">' + when + '</td></tr>';
    }
    out += '</table>';
  }
  const src = hooks.fav_by_source || [];
  if (src.length) {

    for (const s of src) out += '<div class="bar-item"><div class="bar-label">' + sourceRu(s.source) + '</div><div class="bar-track"><div class="bar-fill success" style="width:' + Math.round(s.adds / max * 100) + '%"></div></div><div class="bar-value">' + s.adds + '</div></div>';
    out += '</div>';
  }
  out += '<div class="note">Крючки пишутся с момента вставки трекинга (03.11.2026), раньше — нули, это норма. «Кто» — анонимный хвост device_id; сами избранники живут в серверной таблице user_favorites, поэтому счётчики «держит в избранном» видны и за прошлые дни.</div></div>';
  return out;
}
// === Трафик: график пользователей с переключателем периодов (как на бирже) ===
let trafficCache = {};
let trafficRange = '24h';

async function loadTraffic(range) {
  trafficRange = range;
  document.querySelectorAll('.tf-tab').forEach(t => t.classList.toggle('active', t.dataset.range === range));
  if (trafficCache[range]) { drawTraffic(trafficCache[range]); return; }
  const box = document.getElementById('trafficChart');
  if (!box) return;
  box.innerHTML = '<div class="loading" style="padding:30px"><div class="spinner"></div></div>';
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/dash_traffic_series', {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ secret: DASH_SECRET, p_range: range })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    trafficCache[range] = d;
    drawTraffic(d);
  } catch (e) {
    box.innerHTML = '<div class="note">График трафика недоступен: ' + e.message + '</div>';
  }
}

// полная ось без дыр: часы за сутки или дни за неделю/месяц, UTC-бакеты как в SQL
function trafficAxis(range) {
  const out = [];
  const now = new Date();
  if (range === '24h') {
    const start = new Date(now);
    start.setUTCMinutes(0, 0, 0);
    start.setUTCHours(start.getUTCHours() - 23);
    for (let i = 0; i < 24; i++) out.push({ t: new Date(start.getTime() + i * 3600000), users: 0, hits: 0 });
  } else {
    const days = range === '7d' ? 7 : 30;
    const start = new Date(now);
    start.setUTCHours(0, 0, 0, 0);
    start.setUTCDate(start.getUTCDate() - (days - 1));
    for (let i = 0; i < days; i++) out.push({ t: new Date(start.getTime() + i * 86400000), users: 0, hits: 0 });
  }
  return out;
}
function bucketKey(d, range) {
  const dd = String(d.getUTCDate()).padStart(2, '0'), mm = String(d.getUTCMonth() + 1).padStart(2, '0');
  return range === '24h'
    ? d.getUTCFullYear() + '-' + mm + '-' + dd + 'T' + String(d.getUTCHours()).padStart(2, '0') + ':00:00Z'
    : d.getUTCFullYear() + '-' + mm + '-' + dd + 'T00:00:00Z';
}

function drawTraffic(d) {
  const range = d.range || trafficRange;
  const axis = trafficAxis(range);
  const byKey = {};
  for (const b of (d.buckets || [])) byKey[b.t] = b;
  for (const p of axis) {
    const b = byKey[bucketKey(p.t, range)];
    if (b) { p.users = Number(b.users) || 0; p.hits = Number(b.hits) || 0; }
  }
  // шапка: итог за период + дельта к прошлому периоду того же размера
  const head = document.getElementById('trafficHead');
  if (head) {
    const cur = num(d.cur_users), prev = num(d.prev_users);
    const periodRu = range === '24h' ? '24 часа' : range === '7d' ? 'неделю' : 'месяц';
    const delta = prev > 0 ? Math.round((cur - prev) / prev * 100) : null;
    head.innerHTML = '<div class="tf-num">' + cur + '<small>пользователей за ' + periodRu + '</small></div>' +
      (delta === null
        ? '<span class="tf-badge neutral">за прошлый период данных нет</span>'
        : '<span class="tf-badge ' + (delta > 0 ? 'up' : delta < 0 ? 'down' : 'neutral') + '">' +
          (delta > 0 ? '+' : delta < 0 ? '−' : '±') + Math.abs(delta) + '% к прошлому периоду</span>');
  }
  const box = document.getElementById('trafficChart');
  if (!box) return;
  const W = Math.max(320, box.clientWidth || 800), H = 260, PL = 8, PR = 40, PT = 16, PB = 24;
  const iw = W - PL - PR, ih = H - PT - PB;
  const maxV = Math.max(1, ...axis.map(p => p.users));
  const x = i => PL + (axis.length === 1 ? iw / 2 : i * iw / (axis.length - 1));
  const y = v => PT + ih - (v / maxV) * ih;
  let line = '';
  axis.forEach((p, i) => { line += (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.users).toFixed(1); });
  const area = line + 'L' + x(axis.length - 1).toFixed(1) + ' ' + (PT + ih) + 'L' + x(0).toFixed(1) + ' ' + (PT + ih) + 'Z';
  let grid = '';
  [maxV, Math.ceil(maxV / 2), 0].forEach(v => {
    const gy = y(v).toFixed(1);
    grid += '<line x1="' + PL + '" y1="' + gy + '" x2="' + (W - PR) + '" y2="' + gy + '" stroke="#e2e8f0" stroke-width="1"/>' +
      '<text x="' + (W - PR + 6) + '" y="' + (Number(gy) + 4) + '" font-size="10" fill="#94a3b8">' + v + '</text>';
  });
  let xl = '';
  const stepLbl = Math.max(1, Math.round(axis.length / 4));
  for (let i = 0; i < axis.length; i += stepLbl) {
    const dt = new Date(axis[i].t.getTime() + 3 * 3600000); // подписи по Москве
    const s = range === '24h'
      ? String(dt.getUTCHours()).padStart(2, '0') + ':00'
      : String(dt.getUTCDate()).padStart(2, '0') + '.' + String(dt.getUTCMonth() + 1).padStart(2, '0');
    xl += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" font-size="10" fill="#94a3b8" text-anchor="middle">' + s + '</text>';
  }
  const lastI = axis.length - 1;
  box.innerHTML =
    '<svg class="tf-svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' +
    '<defs><linearGradient id="tfGrad" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="#3b82f6" stop-opacity=".26"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient></defs>' +
    grid +
    '<path d="' + area + '" fill="url(#tfGrad)"/>' +
    '<path d="' + line + '" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + x(lastI).toFixed(1) + '" cy="' + y(axis[lastI].users).toFixed(1) + '" r="4" fill="#3b82f6" stroke="#fff" stroke-width="2"/>' +
    xl +
    '<line id="tfCross" x1="0" x2="0" y1="' + PT + '" y2="' + (PT + ih) + '" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>' +
    '<circle id="tfDot" r="4" fill="#fff" stroke="#3b82f6" stroke-width="2.5" style="display:none"/>' +
    '</svg>' +
    '<div class="tf-tip" id="tfTip" style="display:none"></div>';
  // кроссхэйр: палец/курсор → ближайшая точка → тултип с пользователям и действиями
  const svg = box.querySelector('svg');
  const tip = box.querySelector('#tfTip');
  const cross = box.querySelector('#tfCross');
  const dot = box.querySelector('#tfDot');
  const move = ev => {
    const r = svg.getBoundingClientRect();
    const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const frac = Math.max(0, Math.min(1, (cx - r.left) / r.width));
    const i = Math.round(frac * (axis.length - 1));
    const p = axis[i];
    const px = x(i), py = y(p.users);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.style.display = '';
    dot.setAttribute('cx', px); dot.setAttribute('cy', py); dot.style.display = '';
    const dt = new Date(p.t.getTime() + 3 * 3600000);
    const when = range === '24h'
      ? String(dt.getUTCDate()).padStart(2, '0') + '.' + String(dt.getUTCMonth() + 1).padStart(2, '0') + ' ' + String(dt.getUTCHours()).padStart(2, '0') + ':00'
      : String(dt.getUTCDate()).padStart(2, '0') + '.' + String(dt.getUTCMonth() + 1).padStart(2, '0');
    tip.textContent = when + ' — ' + p.users + ' польз. · ' + p.hits + ' действий';
    tip.style.display = '';
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(4, Math.min(r.width - tw - 4, px - tw / 2)) + 'px';
  };
  const hide = () => { cross.style.display = 'none'; dot.style.display = 'none'; tip.style.display = 'none'; };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', hide);
}

// повернули телефон — перерисовываем график под новую ширину
let tfResizeT = null;
window.addEventListener('resize', () => {
  clearTimeout(tfResizeT);
  tfResizeT = setTimeout(() => { if (trafficCache[trafficRange]) drawTraffic(trafficCache[trafficRange]); }, 200);
});
load();
</script>
</body>
