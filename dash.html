<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КогдаБенз · статистика сайта</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: #f3f7ff; color: #14213d; padding: 16px; max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 2px; }
  .sub { color: #71809c; font-size: 11px; margin-bottom: 14px; }
  .section { background: #fff; border: 1px solid #e6ebf4; border-radius: 16px; padding: 14px; margin-bottom: 12px; box-shadow: 0 10px 26px rgba(38,69,120,.07); }
  .section h2 { font-size: 13px; margin-bottom: 10px; }
  /* итог одним блоком вместо плиток */
  .hero { display: flex; gap: 14px; align-items: center; background: linear-gradient(135deg, #ffffff, #eef4ff); }
  .hero-num { flex: 0 0 auto; font-size: 46px; font-weight: 900; letter-spacing: -2px; line-height: 1; background: linear-gradient(90deg, #2465ee, #2ea3ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero-right { min-width: 0; }
  .hero-cap { font-size: 10px; font-weight: 800; color: #5b7ba6; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .hero-lines { color: #33445f; font-size: 12px; line-height: 1.55; }
  .hero-lines b { color: #14213d; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
  .bar-row span { flex: 0 0 46%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; height: 16px; min-width: 0; }
  .bar { height: 16px; border-radius: 8px; background: linear-gradient(90deg, #4385ff, #2465ee); min-width: 2px; }
  .bar.green { background: linear-gradient(90deg, #21b986, #19b77a); }
  .bar.orange { background: linear-gradient(90deg, #f5d565, #f5a05a); }
  .bar-row b { flex: 0 0 auto; }
  .note { margin-top: 8px; color: #93a1b8; font-size: 10px; line-height: 1.4; }
  .chart { display: flex; align-items: flex-end; gap: 2px; height: 110px; margin-top: 10px; }
  .chart div { flex: 1; background: linear-gradient(180deg, #78a4ff, #d6e3ff); border-radius: 4px 4px 0 0; min-width: 4px; }
  .axis { display: flex; justify-content: space-between; font-size: 9px; color: #9aa7bd; margin-top: 4px; }
  .err { padding: 20px; background: #fff2e8; border-radius: 14px; color: #c26a2a; font-weight: 700; }
</style>
</head>
<body>
  <h1>⛽ КогдаБенз · статистика сайта</h1>
  <div class="sub">Анонимно: без имён и адресов. Страница только ваша — ссылкой не делитесь.</div>
  <div id="app"><div class="err">Загружаю данные…</div></div>

<script>
const SUPABASE_URL = 'https://tiargqbjtraqaooxjafy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpYXJncWJqdHJhcWFvb3hqYWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzOTQ2NjYsImV4cCI6MjEwNDk3MDY2Nn0.eVra5X-9Y3aoQJsZf1uPn9D1m14A3GsiIC5QPa-o31E';
const DASH_SECRET = 'kb-dash-2026-x9f3k'; // тот же, что в SQL-функции

// расшифровка вопросов и ответов опросов
const POLL_Q = {
  arrive_truth: 'Подъехали к заправке — наша информация про топливо совпала?',
  usability: 'Сайтом удобно пользоваться?',
  map_clear: 'Карта понятна: капли, круги, цвета?',
  forecast_true: 'Мы пишем «топливо вернётся с 14 до 16». По вашему опыту это сбывается?',
  marks_why: 'Вы отмечаете (топливо, очереди)? Почему?',
  stars: 'Оцените сайт в целом.',
  advice_outcome: 'Недавно вы строили маршрут до заправки через «Куда ехать». Чем закончилось?'
};
const POLL_A = {
  // arrive_truth
  match: 'Всё совпало', almost: 'Почти, одно топливо ошиблось', wrong: 'Нет, было по-другому', notyet: 'Ещё не подъезжал',
  // usability
  great: 'Да, всё понятно и быстро', ok: 'В целом удобно', confuse: 'Иногда путаюсь', bad: 'Не очень',
  // map_clear
  glance: 'Да, читаю с первого взгляда', legend: 'Подсматриваю в подсказку цветов', no: 'Не понимаю карту',
  // forecast_true
  always: 'Да, почти всегда', half: 'Примерно через раз', rare: 'Редко',
  // marks_why
  help: 'Да, хочу помочь городу', sometimes: 'Иногда', whynot: 'Нет, не понимаю зачем', hard: 'Нет, неудобно или долго',
  // advice_outcome
  fuel: 'Доехал и заправился', miss: 'Поехал, но топливо или очередь — не как ожидал', notwent: 'Ещё не доехал', noadv: 'Не воспользовался советом'
};
// человеческие названия действий на сайте
const EVENT_RU = {
  pageview: ['👀', 'Открыли сайт'],
  panel_view: ['📖', 'Листали панели'],
  open_station_card: ['⛽', 'Открывали карточку АЗС'],
  click_where_to_go: ['🧭', 'Жали «Куда ехать»'],
  feedback_submit: ['🙏', 'Оставляли отметку']
};
// человеческие названия городов
const CITY_RU = { novorossiysk: 'Новороссийск', gelendzhik: 'Геленджик', anapa: 'Анапа', krymsk: 'Крымск', krasnodar: 'Краснодар', sochi: 'Сочи', tuapse: 'Туапсе', armavir: 'Армавир', maykop: 'Майкоп' };
function cityRu(c) { return CITY_RU[c] || (c === 'unknown' ? 'город не определился' : c); }
// «откуда пришли» по-человечески
function sourceRu(s) {
  if (s === 'direct') return 'Напрямую: ссылка, закладка или иконка';
  if (s.indexOf('ref: ') === 0) {
    const m = s.slice(5).match(/\/\/([^\/]+)/);
    const host = (m ? m[1] : s.slice(5)).replace(/^www\./, '');
    const known = [['vk.com','ВКонтакте'],['vk.ru','ВКонтакте'],['t.me','Телеграм'],['telegram.org','Телеграм'],['yandex','Яндекс'],['google','Гугл'],['ok.ru','Одноклассники'],['wa.me','Ватсап'],['whatsapp','Ватсап'],['avito','Авито']];
    for (const k of known) if (host.indexOf(k[0]) >= 0) return 'Перешли из: ' + k[1];
    return 'Перешли с сайта: ' + host;
  }
  if (s.indexOf('utm: ') === 0) return 'Реклама: ' + s.slice(5).split(' / ').join(' · ');
  return s;
}
function num(v) { return (v === null || v === undefined) ? 0 : v; }

async function load() {
  const app = document.getElementById('app');
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/dash_stats', {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ secret: DASH_SECRET })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (d.error) throw new Error('токен не подошёл');
    
    // загружаем статистику опросов
    const rp = await fetch(SUPABASE_URL + '/rest/v1/rpc/dash_poll_stats', {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ secret: DASH_SECRET })
    });
    const poll = await rp.json();
    
    // загружаем статистику советника
    const ra = await fetch(SUPABASE_URL + '/rest/v1/rpc/dash_advisor_stats', {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ secret: DASH_SECRET })
    });
    const advisor = await ra.json();
    
    render(d, poll, advisor);
  } catch (e) {
    app.innerHTML = '<div class="err">Не удалось загрузить данные: ' + e.message + '</div>';
  }
}

function render(d, poll, advisor) {
  const app = document.getElementById('app');
  const ret = d.retention || {};
  const fun = d.funnel || [];
  const daily = d.daily || [];
  const sources = d.sources || [];
  const cities = d.cities || [];
  let html = '';

  // итог одним блоком: большое число + четыре строки текста
  html += '<div class="section hero"><div class="hero-num">' + num(d.mau_30d) + '</div><div class="hero-right">' +
    '<div class="hero-cap">человек за последние 30 дней</div>' +
    '<div class="hero-lines">' +
    '<div>Вчера было <b>' + num(d.dau_yesterday) + '</b>, сегодня — <b>' + num(d.dau_today) + '</b>.</div>' +
    '<div>За неделю: <b>' + num(ret.new_7d) + '</b> новых, <b>' + num(ret.returning_7d) + '</b> вернулись.</div>' +
    '<div>Всего визитов <b>' + num(d.total_sessions) + '</b>, действий в них — <b>' + num(d.total_hits) + '</b>.</div>' +
    '<div>Без интернета сайт открывали в <b>' + (d.offline_share === null || d.offline_share === undefined ? '0' : d.offline_share) + '%</b> обращений.</div>' +
    '</div></div></div>';

  // когда приходили
  html += '<div class="section"><h2>📅 Когда приходили</h2><div class="chart">';
  const maxSessions = Math.max(1, ...daily.map(x => x.sessions));
  daily.forEach(day => {
    const h = Math.max(4, Math.round(day.sessions / maxSessions * 100));
    html += '<div style="height:' + h + '%" title="' + day.day + ': человек ' + day.sessions + '"></div>';
  });
  html += '</div><div class="axis"><span>' + (daily[0] ? daily[0].day : '') + '</span><span>' + (daily.length ? daily[daily.length - 1].day : '') + '</span></div>' +
    '<div class="note">Столбик — сколько человек заходило в этот день. Нажми на столбик — покажет число.</div></div>';

  // что делали
  html += '<div class="section"><h2>👣 Что делали на сайте</h2>';
  const maxFunnel = Math.max(1, ...fun.map(x => x.sessions));
  fun.forEach(f => {
    const e = EVENT_RU[f.event] || ['•', f.event];
    const w = Math.round(f.sessions / maxFunnel * 100);
    html += '<div class="bar-row"><span>' + e[0] + ' ' + e[1] + '</span><div class="bar-track"><div class="bar" style="width:' + w + '%"></div></div><b>' + f.sessions + '</b></div>';
  });
  html += '<div class="note">Число — сколько человек сделали это хотя бы раз за всё время.</div></div>';

  // откуда пришли
  html += '<div class="section"><h2>🚪 Откуда пришли</h2>';
  const maxSrc = Math.max(1, ...sources.map(x => x.sessions));
  sources.forEach(s => {
    const w = Math.round(s.sessions / maxSrc * 100);
    html += '<div class="bar-row"><span>' + sourceRu(s.source) + '</span><div class="bar-track"><div class="bar green" style="width:' + w + '%"></div></div><b>' + s.sessions + '</b></div>';
  });
  html += '<div class="note">«Напрямую» — когда открыли ссылку, закладку или иконку на экране, без перехода с другого сайта.</div></div>';

  // города
  html += '<div class="section"><h2>🏙 Из каких городов смотрели</h2>';
  const maxCity = Math.max(1, ...cities.map(x => x.sessions));
  cities.forEach(c => {
    const w = Math.round(c.sessions / maxCity * 100);
    html += '<div class="bar-row"><span>' + cityRu(c.city) + '</span><div class="bar-track"><div class="bar orange" style="width:' + w + '%"></div></div><b>' + c.sessions + '</b></div>';
  });
  html += '<div class="note">Город определяется примерно, по координатам телефона — тот же город, что сайт показывает в списке АЗС.</div></div>';

  // === Блок опросов водителей ===
  if (poll && !poll.error && poll.total_answers > 0) {
    html += '<div class="section"><h2>💬 Что водители думают о сайте</h2>';
    
    // Большая цифра: всего ответов
    html += '<div style="margin-bottom:12px"><div style="font-size:32px;font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,#2465ee,#2ea3ff);-webkit-background-clip:text;background-clip:text;color:transparent">' + 
      num(poll.total_answers) + '</div>' +
      '<div style="font-size:11px;color:#71809c;margin-top:4px">Уникальных людей ответило: <b>' + num(poll.unique_respondents) + '</b>';
    if (poll.avg_stars !== null && poll.avg_stars !== undefined) {
      html += ' · Средняя оценка: <b>' + poll.avg_stars.toFixed(1).replace('.', ',') + '</b> из 5';
    }
    html += '</div></div>';
    
    // По каждому вопросу: бары с долями ответов
    if (poll.answers_by_question) {
      poll.answers_by_question.forEach(q => {
        const qText = POLL_Q[q.question_key] || q.question_key;
        html += '<div style="margin-top:14px;padding-top:10px;border-top:1px solid #e6ebf4"><div style="font-size:12px;font-weight:800;margin-bottom:8px">' + qText + '</div>';
        
        const total = q.answers.reduce((s, a) => s + a.cnt, 0);
        const maxCnt = Math.max(...q.answers.map(a => a.cnt));
        
        q.answers.forEach(a => {
          let aText = '';
          if (q.question_key === 'stars') {
            // звёзды: показываем распределение
            const starNum = parseInt(a.answer_key.replace('star', '').split('_')[0]);
            aText = starNum + ' ★';
          } else {
            aText = POLL_A[a.answer_key] || a.answer_key;
          }
          
          const pct = total > 0 ? Math.round(a.cnt / total * 100) : 0;
          const w = Math.round(a.cnt / maxCnt * 100);
          const barClass = pct >= 50 ? 'green' : pct >= 25 ? 'orange' : '';
          
          html += '<div class="bar-row"><span>' + aText + '</span><div class="bar-track"><div class="bar ' + barClass + '" style="width:' + w + '%"></div></div><b>' + a.cnt + ' (' + pct + '%)</b></div>';
        });
        
        html += '</div>';
      });
    }
    
    html += '<div class="note">Ответы анонимные: только device_id, вопрос и ответ. Звёзды (1–5) показывают отдельно с распределением и средней оценкой.</div></div>';
  }

  // === Блок качества советника "Куда ехать" ===
  if (advisor && !advisor.error && advisor.total_advice > 0) {
    html += '<div class="section"><h2>🧭 Качество советника «Куда ехать»</h2>';
    
    // Большая цифра: доля принятия советов
    const acceptanceRate = advisor.acceptance_rate || 0;
    const adviceWithRoute = advisor.advice_with_route || 0;
    const totalAdvice = advisor.total_advice || 0;
    
    html += '<div style="margin-bottom:12px"><div style="font-size:32px;font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,#2465ee,#2ea3ff);-webkit-background-clip:text;background-clip:text;color:transparent">' + 
      acceptanceRate.toFixed(1).replace('.', ',') + '%</div>' +
      '<div style="font-size:11px;color:#71809c;margin-top:4px">' +
      'Советов дали: <b>' + totalAdvice + '</b> · Построили маршрут: <b>' + num(advisor.route_built_count) + '</b> · ' +
      'Приняли совет (маршрут к той же станции): <b>' + adviceWithRoute + '</b></div>';
    
    if (advisor.avg_session_duration !== null && advisor.avg_session_duration !== undefined) {
      const avgMin = Math.round(advisor.avg_session_duration / 60);
      const avgSec = Math.round(advisor.avg_session_duration % 60);
      html += '<div style="font-size:11px;color:#71809c;margin-top:4px">Средняя длительность сессии: <b>' + avgMin + ' мин ' + avgSec + ' сек</b></div>';
    }
    html += '</div>';
    
    // Топ станций по советам
    if (advisor.top_advised_stations && advisor.top_advised_stations.length > 0) {
      html += '<div style="margin-top:14px;padding-top:10px;border-top:1px solid #e6ebf4"><div style="font-size:12px;font-weight:800;margin-bottom:8px">Топ станций по советам</div>';
      const maxAdv = Math.max(...advisor.top_advised_stations.map(s => s.advice_count));
      advisor.top_advised_stations.forEach(s => {
        const w = Math.round(s.advice_count / maxAdv * 100);
        html += '<div class="bar-row"><span>' + escapeHtml(s.name) + '</span><div class="bar-track"><div class="bar" style="width:' + w + '%"></div></div><b>' + s.advice_count + '</b></div>';
      });
      html += '</div>';
    }
    
    // Топ станций по построенным маршрутам
    if (advisor.top_routed_stations && advisor.top_routed_stations.length > 0) {
      html += '<div style="margin-top:14px;padding-top:10px;border-top:1px solid #e6ebf4"><div style="font-size:12px;font-weight:800;margin-bottom:8px">Топ станций по построенным маршрутам</div>';
      const maxRoute = Math.max(...advisor.top_routed_stations.map(s => s.route_count));
      advisor.top_routed_stations.forEach(s => {
        const w = Math.round(s.route_count / maxRoute * 100);
        html += '<div class="bar-row"><span>' + escapeHtml(s.name) + '</span><div class="bar-track"><div class="bar green" style="width:' + w + '%"></div></div><b>' + s.route_count + '</b></div>';
      });
      html += '</div>';
    }
    
    html += '<div class="note">Доля принятия — сколько раз после совета «Куда ехать» построили маршрут к той же станции. Высокий процент = советник попадает в цель.</div></div>';
  }

  app.innerHTML = html;
}

function escapeHtml(v) { return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }

load();
</script>
</body>
</html>
