  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --primary: #2465ee;
    --primary-light: #397cff;
    --success: #19b77a;
    --warning: #f5a05a;
    --danger: #ef5350;
    --purple: #7c6dff;
    --text-primary: #14213d;
    --text-secondary: #71809c;
    --text-tertiary: #93a1b8;
    --bg-primary: #f7f9fc;
    --bg-card: #ffffff;
    --border: #e6ebf4;
    --shadow-sm: 0 1px 3px rgba(20,33,61,.06);
    --shadow: 0 2px 8px rgba(20,33,61,.08);

  body {

  .container { max-width: 1360px; margin: 0 auto; padding: 20px; }

  .header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .header .subtitle { color: var(--text-secondary); font-size: 12px; margin-top: 3px; font-weight: 600; }
  .header-badge {

    background: linear-gradient(135deg, #e5f8ef, #dff5e9); border: 1px solid #bfe8d4;
    border-radius: 18px; font-size: 11px; font-weight: 700; color: #12855c;

  .header-badge::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--success); animation: pulse 2s ease-in-out infinite; }

  .verdict-panel {

    border: 1px solid #dce4f0; border-radius: 20px; padding: 24px;
    margin-bottom: 20px; box-shadow: 0 8px 24px rgba(20, 33, 61, 0.08);
    display: grid; grid-template-columns: 140px 1fr; gap: 24px; align-items: center;
    position: relative; overflow: hidden;

  .verdict-panel::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--primary); }
  .verdict-panel.good::before { background: var(--success); }
  .verdict-panel.warn::before { background: var(--warning); }
  .verdict-panel.bad::before { background: var(--danger); }
  .score-box { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .score-ring {
    width: 100px; height: 100px; border-radius: 50%;
    background: conic-gradient(var(--primary) var(--score-deg, 70%), #e2e8f0 0);
    display: grid; place-items: center; position: relative;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.1);
  }
  .score-ring::before { content: ''; position: absolute; inset: 8px; background: #fff; border-radius: 50%; }
  .score-val { position: relative; z-index: 1; font-size: 28px; font-weight: 900; line-height: 1; }
  .score-val small { font-size: 12px; color: var(--text-secondary); }
  .score-label { margin-top: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); }
  .verdict-content h3 { font-size: 18px; font-weight: 900; margin-bottom: 12px; letter-spacing: -0.3px; }
  .verdict-lists { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .v-list-col li { font-size: 12px; font-weight: 600; line-height: 1.4; display: flex; align-items: flex-start; gap: 6px; }
  .v-list-col li::before { content: '•'; font-size: 16px; line-height: 1; }
  .v-good li::before { color: var(--success); }
  .v-bad li::before { color: var(--danger); }
  .v-list-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px; color: var(--text-tertiary); }

  .utility-card {

    overflow: hidden; box-shadow: 0 12px 36px rgba(36, 101, 238, 0.25);

  .utility-card::before {
    content: ''; position: absolute; right: -40px; top: -40px; width: 200px; height: 200px;
    border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.15), transparent 70%);

  .utility-head { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 800; letter-spacing: 0.3px; opacity: 0.9; text-transform: uppercase; }
  .utility-head .badge {
    padding: 3px 9px; background: rgba(255,255,255,.2); border-radius: 99px;
    font-size: 9px; font-weight: 800; letter-spacing: 0.4px;
  }
  .utility-ring-wrap {
    display: flex; align-items: center; gap: 24px; margin: 22px 0 18px;
  }
  .utility-ring {
    width: 140px; height: 140px; position: relative; flex-shrink: 0;
  }

  .utility-ring .track { fill: none; stroke: rgba(255,255,255,.2); stroke-width: 12; }

    stroke-dasharray: 377; stroke-dashoffset: 377; transition: stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1); }
  .utility-score {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .utility-score b { font-size: 44px; font-weight: 900; letter-spacing: -1.5px; line-height: 1; }
  .utility-score small { font-size: 11px; font-weight: 700; opacity: 0.8; margin-top: 4px; letter-spacing: 0.3px; }
  .utility-word {

  .kpi-label { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
  .kpi-value { font-size: 28px; font-weight: 800; letter-spacing: -0.8px; line-height: 1; margin-bottom: 4px; }
  .kpi-change { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 5px; }
  .kpi-change.positive { background: #e5f8ef; color: #12855c; }
  .kpi-change.negative { background: #fdecec; color: #c2403f; }
  .kpi-change.neutral { background: #f2f4f9; color: var(--text-secondary); }
  .kpi-subtitle { font-size: 10px; color: var(--text-tertiary); margin-top: 5px; font-weight: 600; }

  .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }

  .emoji-cnt { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
  .emoji-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-secondary); margin-top: 4px; }
  .emoji-pct { font-size: 11px; font-weight: 700; color: var(--text-secondary); margin-top: 2px; }

  .outcomes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .outcome-card { padding: 14px; border-radius: 12px; text-align: center; border: 1px solid var(--border); }
  .outcome-card.fuel { background: #e5f8ef; border-color: #bfe8d4; }
  .outcome-card.miss { background: #fff2e8; border-color: #f5d3b8; }
  .outcome-card.notwent { background: #f7f9fc; }
  .outcome-card.noadv { background: #fdecec; border-color: #f3b7b3; }
  .outcome-icon { font-size: 26px; margin-bottom: 4px; }
  .outcome-cnt { font-size: 20px; font-weight: 900; letter-spacing: -0.3px; }
  .outcome-label { font-size: 10px; font-weight: 700; color: var(--text-secondary); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.3px; }
  .outcome-pct { font-size: 11px; font-weight: 800; margin-top: 3px; }

  @media (max-width: 768px) {
    .verdict-panel { grid-template-columns: 1fr; gap: 16px; text-align: center; }
    .verdict-lists { grid-template-columns: 1fr; text-align: left; }
    .score-box { flex-direction: row; gap: 16px; justify-content: center; }
    .score-label { margin-top: 0; }
    .container { padding: 14px; }
    .header h1 { font-size: 19px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .bar-item { grid-template-columns: 140px 1fr 60px; }
    .bar-label { font-size: 11px; }
    .section { padding: 14px; }
    .advisor-hero { grid-template-columns: 1fr; }
    .emoji-bars { grid-template-columns: 1fr; }
    .utility-ring-wrap { flex-direction: column; align-items: center; text-align: center; }
  }
</style>
</head>

  if (!s) return 'Неизвестно';
  const lowerS = s.toLowerCase();
  if (lowerS === 'direct' || lowerS === 'напрямую') return 'Прямые заходы';
  if (lowerS.startsWith('utm: ')) {
    if (lowerS.includes('yandex') || lowerS.includes('ya')) return 'Яндекс (Реклама)';
    if (lowerS.includes('google')) return 'Google (Реклама)';
    return 'Реклама: ' + s.slice(5).split(' / ')[0];
  }
  if (lowerS.startsWith('ref: ')) {
    let host = lowerS.slice(5).replace(/^(https?:\/\/)?(www\.)?/, '');
    if (host.startsWith('yandex') || host.startsWith('ya.ru')) return 'Яндекс (Поиск)';
    if (host.startsWith('google')) return 'Google (Поиск)';
    if (host.includes('vk.com') || host.includes('vk.ru')) return 'ВКонтакте';
    if (host.includes('t.me') || host.includes('telegram')) return 'Телеграм';
    if (host.includes('dzen.ru')) return 'Дзен';
    if (host.includes('mail.ru')) return 'Mail.ru';
    return host.split('/')[0];
  }
  return s;
}

function num(v) { return (v === null || v === undefined) ? 0 : v; }

function formatNumber(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return n.toString();
}

async function load() {
  const app = document.getElementById('app');
  try {
    const [statsRes, pollRes, advisorRes, hooksRes, engRes, srcfRes, advDetRes] = await Promise.all([
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_stats', { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ secret: DASH_SECRET }) }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_poll_stats', { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ secret: DASH_SECRET }) }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_advisor_stats', { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ secret: DASH_SECRET }) }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_hooks_stats', { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ secret: DASH_SECRET }) }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_engagement_stats', { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ secret: DASH_SECRET }) }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_source_funnel', { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ secret: DASH_SECRET }) }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_advisor_detailed', { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ secret: DASH_SECRET }) })
    ]);

    if (!statsRes.ok || !pollRes.ok || !advisorRes.ok || !hooksRes.ok || !engRes.ok || !srcfRes.ok) throw new Error('HTTP error');

    const [stats, poll, advisor, hooks, eng, srcf, advDet] = await Promise.all([statsRes.json(), pollRes.json(), advisorRes.json(), hooksRes.json(), engRes.json(), srcfRes.json(), advDetRes.ok ? advDetRes.json() : Promise.resolve({})]);
    if (stats.error) throw new Error('Invalid token');

    ADVISOR_DETAILED = advDet.error ? {} : advDet;
    render(stats, poll, advisor, hooks, eng, srcf);
  } catch (e) {
    app.innerHTML = '<div class="error">Ошибка загрузки: ' + e.message + '</div>';
  }
}

  html += '<div id="verdict-container"><div class="loading"><div class="spinner"></div><span>Анализ данных...</span></div></div>';

  // KPI

  const dauChangeClass = dauChange > 0 ? 'positive' : dauChange < 0 ? 'negative' : 'neutral';

  html += `<div class="kpi-card"><div class="kpi-label">Пользователей сегодня</div><div class="kpi-value">${num(stats.dau_today)}</div><div class="kpi-change ${dauChangeClass}">${dauChangeIcon} ${Math.abs(dauChange)}% vs вчера</div><div class="kpi-subtitle">Вчера: ${num(stats.dau_yesterday)}</div></div>`;
  html += `<div class="kpi-card"><div class="kpi-label">Новые (за 7 дней)</div><div class="kpi-value">${formatNumber(num(ret.new_7d))}</div><div class="kpi-subtitle">Вернувшихся: ${formatNumber(num(ret.returning_7d))}</div></div>`;
  html += `<div class="kpi-card"><div class="kpi-label">Всего визитов</div><div class="kpi-value">${formatNumber(num(stats.total_sessions))}</div><div class="kpi-subtitle">Действий: ${formatNumber(num(stats.total_hits))}</div></div>`;
  html += '</div>';

  // Трафик
  html += '<div class="section">' +
    '<div class="section-header"><div class="section-title"><span class="section-icon">📈</span>Пользователи по периодам</div>' +
    '<div class="tf-tabs">' +
    '<button class="tf-tab active" data-range="24h" onclick="loadTraffic(\'24h\')">24h</button>' +
    '<button class="tf-tab" data-range="7d" onclick="loadTraffic(\'7d\')">1W</button>' +
    '<button class="tf-tab" data-range="30d" onclick="loadTraffic(\'30d\')">1M</button>' +
    '</div></div>' +
    '<div class="tf-head" id="trafficHead"></div>' +
    '<div class="chart-wrap" id="trafficChart"><div class="loading" style="padding:30px"><div class="spinner"></div></div></div>' +
    '<div class="note"><b>session_id</b> — анонимный ID устройства (уникальный пользователь).</div>' +
    '</div>';

  // Funnel
  const funnel = stats.funnel || [];
  if (funnel.length > 0) {
    html += '<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">🎯</span>Действия пользователей</div></div><div class="bar-chart">';
    const maxFunnel = Math.max(...funnel.map(f => f.sessions));
    funnel.forEach(f => {
      const event = EVENT_RU[f.event] || ['•', f.event];
      const width = (f.sessions / maxFunnel * 100);
      html += `<div class="bar-item"><div class="bar-label">${event[0]} ${event[1]}</div><div class="bar-track"><div class="bar-fill primary" style="width: ${width}%"></div></div><div class="bar-value">${formatNumber(f.sessions)}</div></div>`;
    });
    html += '</div></div>';
  }

  // Источники
  const rawSources = stats.sources || [];
  const groupedSourcesMap = {};
  rawSources.forEach(item => {
    const ruName = sourceRu(item.source);
    if (!groupedSourcesMap[ruName]) groupedSourcesMap[ruName] = 0;
    groupedSourcesMap[ruName] += item.sessions;
  });
  const sources = Object.keys(groupedSourcesMap)
    .map(k => ({ source: k, sessions: groupedSourcesMap[k] }))
    .sort((a, b) => b.sessions - a.sessions);

  if (sources.length > 0) {
    html += '<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">🔗</span>Источники трафика</div></div><div class="bar-chart">';
    const maxSrc = Math.max(...sources.map(s => s.sessions));
    sources.slice(0, 10).forEach(s => {
      const width = (s.sessions / maxSrc * 100);
      html += `<div class="bar-item"><div class="bar-label">${s.source}</div><div class="bar-track"><div class="bar-fill success" style="width: ${width}%"></div></div><div class="bar-value">${formatNumber(s.sessions)}</div></div>`;
    });
    html += '</div></div>';
  }

  // Города
  const cities = stats.cities || [];
  if (cities.length > 0) {
    html += '<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">🏙️</span>География пользователей</div></div><div class="bar-chart">';
    const maxCity = Math.max(...cities.map(c => c.sessions));
    cities.forEach(c => {
      const width = (c.sessions / maxCity * 100);
      html += `<div class="bar-item"><div class="bar-label">${cityRu(c.city)}</div><div class="bar-track"><div class="bar-fill warning" style="width: ${width}%"></div></div><div class="bar-value">${formatNumber(c.sessions)}</div></div>`;
    });
    html += '</div></div>';
  }

  // Опросы
  if (poll && !poll.error && poll.total_answers > 0) {
    html += '<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">💬</span>Опросы водителей</div></div>';
    html += `<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px;">
      <div class="kpi-card"><div class="kpi-label">Всего ответов</div><div class="kpi-value">${formatNumber(poll.total_answers)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Уникальных респондентов</div><div class="kpi-value">${formatNumber(poll.unique_respondents)}</div></div>
      ${poll.avg_stars !== null ? `<div class="kpi-card"><div class="kpi-label">Средняя оценка</div><div class="kpi-value">${poll.avg_stars.toFixed(1)} ★</div></div>` : ''}
    </div>`;

    if (poll.answers_by_question) {
      poll.answers_by_question.forEach(q => {
        if (q.question_key === 'advice_outcome') return; // уже в секции советника
        const qText = POLL_Q[q.question_key] || q.question_key;
        const total = q.answers.reduce((s, a) => s + a.cnt, 0);
        const maxCnt = Math.max(...q.answers.map(a => a.cnt));
        html += `<div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);"><div style="font-size: 14px; font-weight: 700; margin-bottom: 10px;">${qText}</div><div class="bar-chart">`;
        q.answers.forEach(a => {
          let aText = q.question_key === 'stars' ? a.answer_key.replace('star', '').split('_')[0] + ' ★' : (POLL_A[a.answer_key] || a.answer_key);
          const pct = total > 0 ? Math.round(a.cnt / total * 100) : 0;
          const width = (a.cnt / maxCnt * 100);
          const barClass = pct >= 50 ? 'success' : pct >= 25 ? 'warning' : 'primary';
          html += `<div class="bar-item"><div class="bar-label">${aText}</div><div class="bar-track"><div class="bar-fill ${barClass}" style="width: ${width}%"></div></div><div class="bar-value">${a.cnt} (${pct}%)</div></div>`;
        });
        html += '</div></div>';
      });
    }
    html += '</div>';
  }

  // Старый блок советника (компактный, без деталей) — оставляем для быстрой сводки
  if (advisor && !advisor.error && advisor.total_advice > 0) {
    const acceptanceRate = advisor.acceptance_rate || 0;
    html += '<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">🧭</span>Советник: краткая сводка (подробно — в блоке выше)</div></div>';
    html += `<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;">
      <div class="kpi-card"><div class="kpi-label">Принятие советов</div><div class="kpi-value">${acceptanceRate.toFixed(1)}%</div></div>
      <div class="kpi-card"><div class="kpi-label">Всего советов</div><div class="kpi-value">${formatNumber(advisor.total_advice)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Построено маршрутов</div><div class="kpi-value">${formatNumber(advisor.route_built_count)}</div></div>
    </div></div>`;
  }

  html += renderHooks(hooks);
  html += renderEngagement(eng);
  html += renderSourceFunnel(srcf);
  html += '<div id="advanced-stats-container"></div>';

  app.innerHTML = html;
  loadTraffic(trafficRange);
  
  // Анимируем бублик полезности
  requestAnimationFrame(() => {
    const fill = document.querySelector('.utility-ring .fill');
    if (fill && ADVISOR_DETAILED.utility) {
      const offset = 377 - (377 * ADVISOR_DETAILED.utility.score / 100);
      fill.style.strokeDashoffset = offset;
    }
    document.querySelectorAll('.ub-bar span').forEach(el => {
      const w = el.dataset.w;
      if (w) requestAnimationFrame(() => el.style.width = w + '%');
    });
    document.querySelectorAll('.f-step-bar span').forEach(el => {
      const w = el.dataset.w;
      if (w) requestAnimationFrame(() => el.style.width = w + '%');
    });
  });
  
  renderVerdict();
  loadAdvancedStats();
}

// === ПОЛНАЯ СЕКЦИЯ СОВЕТНИКА «КУДА ЕХАТЬ» ===
function renderAdvisorDetailed() {
  const d = ADVISOR_DETAILED;
  // функция советника не отвечает (404/ошибка) — честная плашка вместо нулей
  if (!d || !d.totals) {
    return '<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">🧭</span>Советник «Куда ехать»</div></div>' +
      '<div class="error" style="text-align:left">Детали советника не загрузились: серверная функция dash_advisor_detailed не отвечает. ' +
      'Реакции и голоса пишутся в базу, но дашборд не может их достать. ' +
      'Лечение: создать функцию в psql и выполнить systemctl restart postgrest.</div></div>';
  }
  const u = d.utility || {};
  const t = d.totals || {};
  const funnel = d.funnel || [];
  const reactions = d.reactions || [];
  const dislikeReasons = d.dislike_reasons || [];
  const doubtReasons = d.doubt_reasons || [];
  const outcomes = d.outcomes || [];
  const folkVotes = d.folk_votes || [];
  const topStations = d.top_stations || [];
  
  // Считаем проценты для реакций
  const totalReactions = reactions.reduce((s, r) => s + r.cnt, 0);
  
  // Слово и цвет по оценке
  let word, desc, wordColor;
  if (u.score >= 75) { word = 'Отличный советник'; desc = 'Водители доверяют совету, строят маршруты и возвращаются к избранным АЗС'; wordColor = '#19b77a'; }
  else if (u.score >= 55) { word = 'Хороший советник'; desc = 'Больше половины метрик в норме, но есть точки роста'; wordColor = '#2465ee'; }
  else if (u.score >= 35) { word = 'Средний советник'; desc = 'Водители пользуются, но часто сомневаются или не едут по совету'; wordColor = '#f5a05a'; }
  else { word = 'Слабый советник'; desc = 'Нужно пересмотреть алгоритм подбора — люди не доверяют советам'; wordColor = '#ef5350'; }
  
  // Если данных мало — предупреждаем
  const lowData = (t.shown || 0) < 30;
  if (lowData && u.score !== undefined) {
    word = 'Копим данные';
    desc = 'Пока ' + (t.shown || 0) + ' показов — для точной метрики нужно минимум 30. Текущее значение ориентировочное.';
    wordColor = '#93a1b8';
  }
  
  // Компоненты метрики

  html += '<div class="utility-desc">' + desc + '</div></div></div>';

  html += '</div>';
  html += '</div>'; // .advisor-hero
  
  // === РЕАКЦИИ: эмодзи-бары ===

    html += '<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">🛣️</span>Чем закончились поездки по совету <span style="font-size:11px;color:var(--text-tertiary);font-weight:700;margin-left:8px">' + totalOutcomes + ' ответов</span></div></div>';

      html += '<div class="outcome-card ' + info[2] + '"><div class="outcome-icon">' + info[0] + '</div>';

      html += '<div class="outcome-label">' + info[1] + '</div>';
      html += '<div class="outcome-pct" style="color:' + (info[2] === 'fuel' ? '#12855c' : info[2] === 'miss' ? '#c26a2a' : info[2] === 'noadv' ? '#c2403f' : '#71809c') + '">' + pct + '%</div></div>';
    });
    html += '</div>';
    const fuelCnt = outcomes.find(o => o.answer_key === 'fuel');
    const hitRate = fuelCnt ? Math.round(fuelCnt.cnt / totalOutcomes * 100) : 0;
    html += '<div class="note"><b>Коэффициент попадания: ' + hitRate + '%</b> — столько водителей реально заправились по совету. Если ниже 40% — советник часто промахивается (топливо кончается до приезда). Опрос приходит через 45 минут – 3 дня после клика «Куда ехать».</div>';
    html += '</div>';
  }
  
  // === НАРОДНЫЕ ГОЛОСА + ТОП СТАНЦИЙ ===
  const totalFolk = folkVotes.reduce((s, f) => s + f.cnt, 0);
  if (totalFolk > 0 || topStations.length > 0) {
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">';
    
    // Народные голоса
    html += '<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">🗳️</span>Народные голоса в совете</div></div>';
    if (totalFolk > 0) {
      const yesCnt = folkVotes.find(f => f.type === 'yes')?.cnt || 0;
      const noCnt = folkVotes.find(f => f.type === 'no')?.cnt || 0;
      const maxF = Math.max(yesCnt, noCnt, 1);
      html += '<div class="bar-chart">';
      html += '<div class="bar-item"><div class="bar-label">✅ Подтверждают наличие</div><div class="bar-track"><div class="bar-fill success" style="width:' + (yesCnt/maxF*100) + '%"></div></div><div class="bar-value">' + yesCnt + '</div></div>';
      html += '<div class="bar-item"><div class="bar-label">❌ Опровергают</div><div class="bar-track"><div class="bar-fill danger" style="width:' + (noCnt/maxF*100) + '%"></div></div><div class="bar-value">' + noCnt + '</div></div>';
      html += '</div>';
      const folkHitRate = Math.round(yesCnt / totalFolk * 100);
      html += '<div class="note">Доля подтверждений: <b>' + folkHitRate + '%</b>. Голос «✅ Подтверждают» усиливает эту АЗС в советнике, «❌ Опровергают» — снижает её рейтинг.</div>';
    } else {
      html += '<div style="text-align:center;padding:20px;color:var(--text-tertiary);font-size:12px">Пока нет голосов в советнике</div>';
    }
    html += '</div>';
    
    // Топ станций по кликам из совета
    html += '<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">⛽</span>Топ АЗС по кликам из совета</div></div>';
    if (topStations.length > 0) {
      const maxClicks = Math.max(...topStations.map(s => s.clicks));
      html += '<div class="bar-chart">';
      topStations.slice(0, 6).forEach(s => {
        const width = (s.clicks / maxClicks * 100);
        html += '<div class="bar-item"><div class="bar-label">' + (s.name || 'Без названия') + '</div><div class="bar-track"><div class="bar-fill purple" style="width:' + width + '%"></div></div><div class="bar-value">' + s.clicks + '</div></div>';
      });
      html += '</div>';
      html += '<div class="note">Станции, на которые чаще всего кликали из советника за 30 дней. Если в топе станции, которые регулярно получают 👎 — алгоритм их переоценивает.</div>';
    } else {
      html += '<div style="text-align:center;padding:20px;color:var(--text-tertiary);font-size:12px">Пока нет данных</div>';
    }
    html += '</div>';
    
    html += '</div>';
  }
  
  // === ИЗБРАННОЕ ИЗ СОВЕТНИКА ===
  if (d.fav_from_advice > 0) {
    const favRate = t.clicks > 0 ? Math.round(d.fav_from_advice / t.clicks * 100) : 0;
    html += '<div class="section" style="background:linear-gradient(135deg,#e5f8ef,#f4fbf7);border-color:#bfe8d4">';
    html += '<div class="section-header"><div class="section-title" style="color:#12855c"><span class="section-icon">❤️</span>Советник → избранное</div></div>';
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">';
    html += '<div class="kpi-card" style="border-left:3px solid #19b77a"><div class="kpi-label">Добавили в избранное из совета</div><div class="kpi-value" style="color:#12855c">' + d.fav_from_advice + '</div></div>';
    html += '<div class="kpi-card" style="border-left:3px solid #19b77a"><div class="kpi-label">Конверсия в избранное</div><div class="kpi-value" style="color:#12855c">' + favRate + '%</div><div class="kpi-subtitle">от кликнувших совет</div></div>';
    html += '</div>';
    html += '<div class="note" style="border-left-color:#19b77a"><b>Золотой показатель советника.</b> Если водитель добавил АЗС из совета в избранное — совет попал в точку настолько, что человек хочет получать уведомления по этой заправке. Цель — выше 8%.</div>';
    html += '</div>';
  }
  
  return html;
}

// === ВЕРДИКТ С УЧЁТОМ СОВЕТНИКА ===
function renderVerdict() {
  const container = document.getElementById('verdict-container');
  if (!container || !REPORT.stats) return;

  const s = REPORT.stats;
  const adv = ADVANCED_REPORT;
  const advDet = ADVISOR_DETAILED;
  const f = s.funnel || [];
  const src = s.sources || [];
  
  let score = 5.0;
  let pros = [];
  let cons = [];
  let statusClass = 'warn';

  // 1. Удержание
  if (adv.bounce && adv.bounce.total_sessions) {
    const br = adv.bounce.bounce_rate;
    if (br <= 12) { score += 1.5; pros.push(`Отличное удержание: отказы ${br}%.`); }
    else if (br <= 25) { score += 0.8; pros.push(`Хорошее удержание: отказы ${br}%.`); }
    else if (br <= 40) { score -= 0.5; cons.push(`Средние отказы (${br}%).`); }
    else { score -= 1.5; cons.push(`Высокие отказы (${br}%). Сайт может тормозить.`); }
  }

  // 2. Воронка
  const pv = f.find(x => x.event === 'pageview')?.sessions || 0;
  const panel = f.find(x => x.event === 'panel_view')?.sessions || 0;
  const card = f.find(x => x.event === 'open_station_card')?.sessions || 0;
  if (pv > 0) {
    const cardConv = Math.round(card / pv * 100);
    if (cardConv >= 8) { score += 0.5; pros.push(`Хорошая конверсия: ${cardConv}% доходят до карточки АЗС.`); }
    else { score -= 0.5; cons.push(`Воронка теряет людей: только ${cardConv}% смотрят карточки.`); }
  }

  // 3. Возвращаемость
  if (adv.cohort && adv.cohort.length > 1) {
    const matureCohort = adv.cohort[1];
    if (matureCohort && matureCohort.total_users > 10) {
      const retRate = Math.round(100 * matureCohort.day1 / matureCohort.total_users);
      if (retRate >= 10) { score += 1.0; pros.push(`Лояльная аудитория: ${retRate}% возвращаются на след. день.`); }
      else if (retRate >= 5) { score += 0.3; pros.push(`Нормальная возвращаемость: ${retRate}% на след. день.`); }
      else { score -= 0.8; cons.push(`Мало возвратов: ${retRate}% на след. день.`); }
    }
  }

  // 4. Реклама
  const yaAds = src.find(x => x.source.toLowerCase().includes('utm') && x.source.toLowerCase().includes('yandex'))?.sessions || 0;
  if (yaAds > 0) {
    score += 0.3; pros.push(`Реклама приводит трафик (${yaAds} визитов).`);
  }

  // === 5. СОВЕТНИК (НОВОЕ) ===
  if (advDet.utility && advDet.totals && advDet.totals.shown > 30) {
    const util = advDet.utility.score;
    const totals = advDet.totals;
    const favRate = totals.clicks > 0 ? (advDet.fav_from_advice / totals.clicks * 100) : 0;
    
    // Исходы поездок
    const outcomes = advDet.outcomes || [];
    const totalOutcomes = outcomes.reduce((s, o) => s + o.cnt, 0);
    const fuelOutcome = outcomes.find(o => o.answer_key === 'fuel');
    const hitRate = fuelOutcome && totalOutcomes > 0 ? (fuelOutcome.cnt / totalOutcomes * 100) : null;
    
    // Реакции
    const reactions = advDet.reactions || [];
    const totalReactions = reactions.reduce((s, r) => s + r.cnt, 0);
    const likes = reactions.find(r => r.type === 'like')?.cnt || 0;
    const dislikes = reactions.find(r => r.type === 'dislike')?.cnt || 0;
    
    if (util >= 65) {
      score += 1.5;
      pros.push(`🧭 Советник отличный (${util.toFixed(0)}/100): ${favRate.toFixed(1)}% добавляют АЗС в избранное из совета.`);
    } else if (util >= 45) {
      score += 0.5;
      pros.push(`🧭 Советник работает (оценка ${util.toFixed(0)}/100).`);
    } else if (util > 0) {
      score -= 0.5;
      cons.push(`🧭 Советник слабый (${util.toFixed(0)}/100): водители не доверяют советам.`);
    }
    
    if (hitRate !== null && totalOutcomes >= 5) {
      if (hitRate >= 50) {
        score += 1.0;
        pros.push(`🎯 Точность советов ${Math.round(hitRate)}%: ${fuelOutcome.cnt} из ${totalOutcomes} водителей реально заправились по совету.`);
      } else if (hitRate >= 30) {
        score += 0.3;
        pros.push(`🎯 Попадание советов среднее: ${Math.round(hitRate)}% заправились по совету.`);
      } else {
        score -= 0.8;
        cons.push(`🎯 Советы часто промахиваются: только ${Math.round(hitRate)}% заправились по совету. Топливо кончается до приезда.`);
      }
    }
    
    if (totalReactions >= 5) {
      const dislikeRate = Math.round(dislikes / totalReactions * 100);
      if (dislikeRate > 40) {
        score -= 0.8;
        cons.push(`👎 ${dislikeRate}% реакций — «Плохо»: водители разочарованы советами.`);
      } else if (dislikeRate <= 20 && likes > dislikes * 2) {
        score += 0.5;
        pros.push(`👍 ${likes} лайков против ${dislikes} дизлайков: советы нравятся.`);
      }
    }
  }

  score = Math.max(1.0, Math.min(10.0, score));
  if (score >= 7.5) statusClass = 'good';
  else if (score >= 4.5) statusClass = 'warn';
  else statusClass = 'bad';

  const finalScore = score.toFixed(1).replace('.', ',');
  const scoreDeg = (score / 10) * 100;
  const statusWord = statusClass === 'good' ? 'Отличный старт' : statusClass === 'warn' ? 'Есть над чем работать' : 'Критическая ситуация';

  container.innerHTML = `
    <div class="verdict-panel ${statusClass}">
      <div class="score-box">
        <div class="score-ring" style="--score-deg: ${scoreDeg}%">
          <div class="score-val">${finalScore}<small>/10</small></div>
        </div>
        <div class="score-label">${statusWord}</div>
      </div>
      <div class="verdict-content">
        <h3>Вердикт аналитики: сводка по проекту</h3>
        <div class="verdict-lists">
          <div class="v-list-col v-good">
            <div class="v-list-title">Что работает отлично</div>
            <ul>${pros.length ? pros.map(p => `<li>${p}</li>`).join('') : '<li>Пока нет явных успехов, копим данные.</li>'}</ul>
          </div>
          <div class="v-list-col v-bad">
            <div class="v-list-title">На что обратить внимание</div>
            <ul>${cons.length ? cons.map(c => `<li>${c}</li>`).join('') : '<li>Все показатели в норме!</li>'}</ul>
          </div>
        </div>
      </div>
    </div>`;
}

async function loadAdvancedStats() {
  const container = document.getElementById('advanced-stats-container');
  if (!container) return;
  container.innerHTML = '<div class="loading"><div class="spinner"></div><span>Загрузка доп. статистики...</span></div>';
  try {
    const [bounceRes, cohortRes, heatmapRes] = await Promise.all([
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_bounce_stats', { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ secret: DASH_SECRET }) }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_retention_cohorts', { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ secret: DASH_SECRET }) }),
      fetch(SUPABASE_URL + '/rest/v1/rpc/dash_time_heatmap', { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ secret: DASH_SECRET }) })
    ]);
    const bounceData = await bounceRes.json();
    const cohortData = await cohortRes.json();
    const heatmapData = await heatmapRes.json();
    ADVANCED_REPORT = { bounce: bounceData, cohort: cohortData, heatmap: heatmapData };
    if (bounceData.error || cohortData.error || heatmapData.error) {
      console.error("SQL Errors:", bounceData.error, cohortData.error, heatmapData.error);
      container.innerHTML = '<div class="error">Ошибка SQL: проверьте консоль (F12).</div>';
      return;
    }
    let html = '';
    if (bounceData && bounceData.total_sessions > 0) {
      const maxB = Math.max(...(bounceData.buckets || []).map(b => b.cnt), 1);
      html += `<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">🚪</span>Уходы и глубина просмотра</div></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px">
          <div class="kpi-card" style="border-left: 3px solid var(--danger);"><div class="kpi-label">Показатель отказов</div><div class="kpi-value">${bounceData.bounce_rate}%</div><div class="kpi-subtitle">Ушли за первые 10 секунд</div></div>
          <div class="kpi-card"><div class="kpi-label">Всего сессий</div><div class="kpi-value">${bounceData.total_sessions}</div></div>
        </div><div class="bar-chart">`;
      (bounceData.buckets || []).forEach(b => {
        const width = (b.cnt / maxB * 100);
        const barStyle = b.label.includes('уход') ? 'background: #ef5350;' : '';
        html += `<div class="bar-item"><div class="bar-label">${b.label}</div><div class="bar-track"><div class="bar-fill" style="width: ${width}%; ${barStyle}"></div></div><div class="bar-value">${b.cnt}</div></div>`;
      });
      html += `</div></div>`;
    }
    if (cohortData && cohortData.length > 0) {
      html += `<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">🔄</span>Возвращаемость (Когорты)</div></div>
        <div style="overflow-x:auto"><table class="data-table"><tr><th>Дата прихода</th><th>Пришло</th><th>На сл. день</th><th>Через 7 дней</th></tr>`;
      cohortData.forEach(c => {
        const d1Pct = Math.round(100 * c.day1 / c.total_users);
        const d7Pct = Math.round(100 * c.day7 / c.total_users);
        const d1Color = d1Pct >= 15 ? '#12855c' : '#c2403f';
        const dateStr = new Date(c.cohort_date).toLocaleDateString('ru-RU', {day: '2-digit', month: '2-digit'});
        html += `<tr><td><b>${dateStr}</b></td><td>${c.total_users}</td><td><span style="color:${d1Color};font-weight:700">${c.day1} (${d1Pct}%)</span></td><td><span style="color:#2465ee;font-weight:700">${c.day7} (${d7Pct}%)</span></td></tr>`;
      });
      html += `</table></div></div>`;
    }
    if (heatmapData && heatmapData.length > 0) {
      let maxUsers = 1;
      heatmapData.forEach(h => { if (h.users > maxUsers) maxUsers = h.users; });
      const daysNames = ['', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      let matrix = Array(8).fill(0).map(() => Array(24).fill(0));
      heatmapData.forEach(h => { matrix[h.day_num][h.hour_num] = h.users; });
      html += `<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">🔥</span>Активность по дням и часам</div></div><div class="heatmap-wrap"><table class="heatmap"><tr><th></th>`;
      for(let h = 0; h < 24; h++) html += `<th class="hour-label">${h}</th>`;
      html += `</tr>`;
      for (let d = 1; d <= 7; d++) {
        html += `<tr><td class="day-label">${daysNames[d]}</td>`;
        for (let h = 0; h < 24; h++) {
          const val = matrix[d][h];
          const opacity = Math.max(0.05, val / maxUsers);
          html += `<td><div class="heat-cell" style="background:rgba(36, 101, 238, ${opacity})" title="${val} польз."></div></td>`;
        }
        html += `</tr>`;
      }
      html += `</table></div></div>`;
    }
    container.innerHTML = html;
    renderVerdict();
  } catch (e) {
    container.innerHTML = '<div class="error">Не удалось загрузить доп. статистику: ' + e.message + '</div>';
  }
}

function renderSourceFunnel(list) {
  if (!list || !list.length) return '';
  const cell = (n, r) => r.visits ? n + ' <small style="color:#94a3b8">(' + Math.round(100 * n / r.visits) + '%)</small>' : String(n);
  let out = '<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">🧭</span>Воронка по источникам · 7 дней</div></div>';
  out += '<div style="overflow-x:auto"><table class="data-table"><tr><th>Источник</th><th>Открыли</th><th>Листали</th><th>Карточка</th><th>Куда ехать</th><th>Отметка</th><th>PWA</th></tr>';
  for (const r of list) {
    out += '<tr><td><b>' + r.source + '</b></td><td>' + r.visits + '</td><td>' + cell(r.panels, r) + '</td><td>' + cell(r.cards, r) + '</td><td>' + cell(r.advice, r) + '</td><td>' + cell(r.marks, r) + '</td><td>' + cell(r.installs, r) + '</td></tr>';
  }
  out += '</table></div></div>';
  return out;
}

    L.push('  Клик «Куда ехать»: ' + t.clicks + ' (' + (t.shown ? Math.round(t.clicks/t.shown*100) : 0) + '%)');
    L.push('  Открыли карточку АЗС: ' + t.cards);
    L.push('  Построили маршрут: ' + t.routes + ' (' + (t.clicks ? Math.round(t.routes/t.clicks*100) : 0) + '% от кликнувших)');
    L.push('');

    L.push('  👎 Плохо: ' + t.dislikes);

    }

    }
    if (ADVISOR_DETAILED.fav_from_advice > 0) {
      const favRate = t.clicks > 0 ? (ADVISOR_DETAILED.fav_from_advice / t.clicks * 100).toFixed(1) : 0;
      L.push('');
      L.push('Добавили в избранное из совета: ' + ADVISOR_DETAILED.fav_from_advice + ' (' + favRate + '% от кликнувших)');
    }
    if (ADVISOR_DETAILED.outcomes && ADVISOR_DETAILED.outcomes.length) {
      const total = ADVISOR_DETAILED.outcomes.reduce((s, o) => s + o.cnt, 0);
      L.push('');
      L.push('Исходы поездок по совету (' + total + ' ответов):');
      ADVISOR_DETAILED.outcomes.forEach(o => {
        const label = OUTCOME_LABELS[o.answer_key]?.[1] || o.answer_key;
        L.push('  · ' + label + ': ' + o.cnt + ' (' + Math.round(o.cnt/total*100) + '%)');
      });
      const fuel = ADVISOR_DETAILED.outcomes.find(o => o.answer_key === 'fuel');
      if (fuel) L.push('  → Коэффициент попадания: ' + Math.round(fuel.cnt/total*100) + '% реально заправились по совету');
    }
    if (ADVISOR_DETAILED.top_stations && ADVISOR_DETAILED.top_stations.length) {
      L.push('');
      L.push('Топ АЗС по кликам из совета:');
      ADVISOR_DETAILED.top_stations.slice(0, 5).forEach(s => L.push('  · ' + s.name + ': ' + s.clicks + ' кликов'));
    }
    L.push('');
  }

  const s = R.stats, ret = s.retention || {};
  L.push('== ПОКАЗАТЕЛИ ==');
  L.push('Пользователей за 30 дней: ' + num(s.mau_30d));
  L.push('Сегодня: ' + num(s.dau_today) + ' (вчера ' + num(s.dau_yesterday) + ')');
  L.push('Новых за 7 дней: ' + num(ret.new_7d) + ', вернувшихся: ' + num(ret.returning_7d));
  L.push('Всего визитов: ' + num(s.total_sessions) + ', действий: ' + num(s.total_hits));
  L.push('');
  L.push('== ТРАФИК ==');
  for (const rg of ['24h', '7d', '30d']) {
    const t = trafficCache[rg];
    if (!t) continue;
    const cur = num(t.cur_users), prev = num(t.prev_users);
    const d = prev > 0 ? Math.round((cur - prev) / prev * 100) : null;
    L.push((rg === '24h' ? '24 часа' : rg === '7d' ? '7 дней' : '30 дней') + ': ' + cur + ' польз.' + (d !== null ? ' (' + (d > 0 ? '+' : '') + d + '% к пред. периоду)' : ''));
  }
  const f = s.funnel || [];
  if (f.length) {
    L.push(''); L.push('== ВОРОНКА ДЕЙСТВИЙ ==');
    const base = f[0] ? f[0].sessions : 0;
    for (const x of f) {
      const e = EVENT_RU[x.event] ? EVENT_RU[x.event][1] : x.event;
      L.push(e + ': ' + x.sessions + (base ? ' (' + Math.round(100 * x.sessions / base) + '%)' : ''));
    }
  }
  const p = R.poll;
  if (p && !p.error && p.total_answers) {
    L.push(''); L.push('== ОПРОСЫ ==');
    L.push('Ответов: ' + p.total_answers + ', респондентов: ' + p.unique_respondents);
    for (const q of (p.answers_by_question || [])) {
      const total = q.answers.reduce((sm, x) => sm + x.cnt, 0);
      L.push('· ' + (POLL_Q[q.question_key] || q.question_key));
      for (const an of q.answers) {
        const txt = q.question_key === 'stars' ? an.answer_key : (POLL_A[an.answer_key] || an.answer_key);
        L.push('   ' + txt + ': ' + an.cnt + ' (' + (total ? Math.round(100 * an.cnt / total) : 0) + '%)');
      }
    }
  }
  const blob = new Blob(['\ufeff' + L.join('\r\n')], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'kogdabenz_otchet_' + stamp + '.txt';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function p2(n) { return String(n).padStart(2, '0'); }

function renderEngagement(eng) {
  if (!eng || eng.error) return '';
  const d = eng.dur || {};
  const favg = (eng.freq_avg === null || eng.freq_avg === undefined) ? '—' : Number(eng.freq_avg).toFixed(2).replace('.', ',');
  let out = '<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">⏱️</span>Привычка: частота и время</div></div>';
  out += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px">' +
    '<div class="kpi-card"><div class="kpi-label">Заходов в день</div><div class="kpi-value">' + favg + '</div></div>' +
    '<div class="kpi-card"><div class="kpi-label">Медиана времени</div><div class="kpi-value">' + fmtDur(d.p50) + '</div></div>' +
    '<div class="kpi-card"><div class="kpi-label">Сессии >2 мин</div><div class="kpi-value">' + (d.share_long !== undefined ? d.share_long + '%' : '—') + '</div></div>' +
    '</div></div>';
  return out;
}
function fmtDur(s) {
  if (s === null || s === undefined) return '—';
  s = Math.round(s);
  if (s < 60) return s + ' с';
  const m = Math.floor(s / 60), r = s % 60;
  if (m < 60) return m + ' м ' + r + ' с';
  return Math.floor(m / 60) + ' ч ' + (m % 60) + ' м';
}
function renderHooks(hooks) {
  if (!hooks || hooks.error) return '';
  const H = {};
  for (const r of (hooks.hooks || [])) H[r.event] = r;
  const card = (label, sub, r) => '<div class="kpi-card"><div class="kpi-label">' + label + '</div><div class="kpi-value">' + (r ? r.sessions : 0) + '</div><div class="kpi-subtitle">' + sub + (r ? r.hits : 0) + '</div></div>';
  let out = '<div class="section"><div class="section-header"><div class="section-title"><span class="section-icon">🪝</span>Крючки привычки</div></div>';
  out += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px">' +
    card('PWA установок', 'событий: ', H.pwa_install) +
    card('Кнопка «Телеграм»', 'нажатий: ', H.tg_connect) +
    card('Связка подтверждена', 'включений: ', H.tg_linked) +
    card('«В избранное»', 'событий: ', H.fav_add) +
    '</div></div>';
  return out;
}
async function loadTraffic(range) {
  trafficRange = range;
  document.querySelectorAll('.tf-tab').forEach(t => t.classList.toggle('active', t.dataset.range === range));
  if (trafficCache[range]) { drawTraffic(trafficCache[range]); return; }
  const box = document.getElementById('trafficChart');
  if (!box) return;
  box.innerHTML = '<div class="loading" style="padding:30px"><div class="spinner"></div></div>';
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/dash_traffic_series', {
      method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ secret: DASH_SECRET, p_range: range })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    trafficCache[range] = d;
    drawTraffic(d);
  } catch (e) {
    box.innerHTML = '<div class="note">График трафика недоступен: ' + e.message + '</div>';
  }
}
function trafficAxis(range) {
  const out = [];
  const now = new Date();
  if (range === '24h') {
    const start = new Date(now); start.setUTCMinutes(0,0,0); start.setUTCHours(start.getUTCHours() - 23);
    for (let i = 0; i < 24; i++) out.push({ t: new Date(start.getTime() + i * 3600000), users: 0, hits: 0 });
  } else {
    const days = range === '7d' ? 7 : 30;
    const start = new Date(now); start.setUTCHours(0,0,0,0); start.setUTCDate(start.getUTCDate() - (days - 1));
    for (let i = 0; i < days; i++) out.push({ t: new Date(start.getTime() + i * 86400000), users: 0, hits: 0 });
  }
  return out;
}
function bucketKey(d, range) {
  const dd = String(d.getUTCDate()).padStart(2, '0'), mm = String(d.getUTCMonth() + 1).padStart(2, '0');
  return range === '24h'
    ? d.getUTCFullYear() + '-' + mm + '-' + dd + 'T' + String(d.getUTCHours()).padStart(2, '0') + ':00:00Z'
    : d.getUTCFullYear() + '-' + mm + '-' + dd + 'T00:00:00Z';
}
function drawTraffic(d) {
  const range = d.range || trafficRange;
  const axis = trafficAxis(range);
  const byKey = {};
  for (const b of (d.buckets || [])) byKey[b.t] = b;
  for (const p of axis) {
    const b = byKey[bucketKey(p.t, range)];
    if (b) { p.users = Number(b.users) || 0; p.hits = Number(b.hits) || 0; }
  }
  const head = document.getElementById('trafficHead');
  if (head) {
    const cur = num(d.cur_users), prev = num(d.prev_users);
    const periodRu = range === '24h' ? '24 часа' : range === '7d' ? 'неделю' : 'месяц';
    const delta = prev > 0 ? Math.round((cur - prev) / prev * 100) : null;
    head.innerHTML = '<div class="tf-num">' + cur + '<small>пользователей за ' + periodRu + '</small></div>' +
      (delta === null ? '<span class="tf-badge neutral">нет данных за прошлый период</span>' :
      '<span class="tf-badge ' + (delta > 0 ? 'up' : delta < 0 ? 'down' : 'neutral') + '">' +
      (delta > 0 ? '+' : delta < 0 ? '−' : '±') + Math.abs(delta) + '% к прошлому</span>');
  }
  const box = document.getElementById('trafficChart');
  if (!box) return;
  const W = Math.max(320, box.clientWidth || 800), H = 260, PL = 8, PR = 40, PT = 16, PB = 24;
  const iw = W - PL - PR, ih = H - PT - PB;
  const maxV = Math.max(1, ...axis.map(p => p.users));
  const x = i => PL + (axis.length === 1 ? iw / 2 : i * iw / (axis.length - 1));
  const y = v => PT + ih - (v / maxV) * ih;
  let line = '';
  axis.forEach((p, i) => { line += (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.users).toFixed(1); });
  const area = line + 'L' + x(axis.length - 1).toFixed(1) + ' ' + (PT + ih) + 'L' + x(0).toFixed(1) + ' ' + (PT + ih) + 'Z';
  let grid = '';
  [maxV, Math.ceil(maxV / 2), 0].forEach(v => {
    const gy = y(v).toFixed(1);
    grid += '<line x1="' + PL + '" y1="' + gy + '" x2="' + (W - PR) + '" y2="' + gy + '" stroke="#e2e8f0" stroke-width="1"/>' +
      '<text x="' + (W - PR + 6) + '" y="' + (Number(gy) + 4) + '" font-size="10" fill="#94a3b8">' + v + '</text>';
  });
  let xl = '';
  const stepLbl = Math.max(1, Math.round(axis.length / 4));
  for (let i = 0; i < axis.length; i += stepLbl) {
    const dt = new Date(axis[i].t.getTime() + 3 * 3600000);
    const s = range === '24h' ? String(dt.getUTCHours()).padStart(2, '0') + ':00' : String(dt.getUTCDate()).padStart(2, '0') + '.' + String(dt.getUTCMonth() + 1).padStart(2, '0');
    xl += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" font-size="10" fill="#94a3b8" text-anchor="middle">' + s + '</text>';
  }
  const lastI = axis.length - 1;
  box.innerHTML = '<svg class="tf-svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' +
    '<defs><linearGradient id="tfGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".26"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient></defs>' +
    grid + '<path d="' + area + '" fill="url(#tfGrad)"/>' +
    '<path d="' + line + '" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + x(lastI).toFixed(1) + '" cy="' + y(axis[lastI].users).toFixed(1) + '" r="4" fill="#3b82f6" stroke="#fff" stroke-width="2"/>' + xl + '</svg>';
}
load();
</script>
