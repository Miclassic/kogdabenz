<script>
const SUPABASE_URL = 'https://tiargqbjtraqaooxjafy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpYXJncWJqdHJhcWFvb3hqYWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzOTQ2NjYsImV4cCI6MjEwNDk3MDY2Nn0.eVra5X-9Y3aoQJsZf1uPn9D1m14A3GsiIC5QPa-o31E';
const DASH_SECRET = 'kb-dash-2026-x9f3k'; // тот же, что в dash.html и в SQL

// цвета линий: старая версия — серая, прошлая — оранжевая, текущая — синяя,
// aggregate (общая) — чёрная толстая
const VERSION_COLORS = {
  'v1.1': '#93a1b8',
  'v1.2': '#f5a05a',
  'v1.11': '#2465ee',
  'aggregate': '#14213d'
};

function versionColor(v) {
  if (VERSION_COLORS[v]) return VERSION_COLORS[v];
  // неизвестная версия — по хешу имени, чтобы не ломалось
  let h = 0; for (const c of String(v)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return 'hsl(' + (h % 360) + ', 60%, 45%)';
}

let chartData = null;
let chartMetric = 'median_min'; // median_min / mae_min / p90_min / success_pct

function drawChart() {
  const box = document.getElementById('chartBox');
  const legend = document.getElementById('chartLegend');
  if (!box || !chartData) return;

  const ts = chartData.version_timeseries || [];
  const agg = chartData.aggregate_timeseries || [];

  let versions = Array.from(new Set(ts.map(p => p.version))).sort();
  let useAggOnly = false;

  if (!versions.length && agg.length) {
    versions = ['aggregate'];
    useAggOnly = true;
  }

  const weeksSet = new Set();
  for (const p of ts) weeksSet.add(p.week);
  if (useAggOnly) {
    for (const p of agg) weeksSet.add(p.week);
  }

  const weeks = Array.from(weeksSet).sort();

  if (!weeks.length || !versions.length) {
    box.innerHTML = '<div class="chart-empty">Пока нет данных для графика — верификатор не проверил ни одной недели.</div>';
    if (legend) legend.innerHTML = '';
    return;
  }

  const points = {};
  const allVals = [];

  for (const v of versions) {
    points[v] = {};
    for (const w of weeks) {
      let row = null;

      if (v === 'aggregate') {
        row = agg.find(p => p.week === w);
      } else {
        row = ts.find(p => p.version === v && p.week === w);
      }

      const raw = row ? row[chartMetric] : null;

      if (
        row &&
        row.n >= 3 &&
        raw !== null &&
        raw !== undefined &&
        raw !== '' &&
        isFinite(Number(raw))
      ) {
        const val = Number(raw);
        points[v][w] = { val: val, n: Number(row.n) };
        allVals.push(val);
      }
    }
  }

  if (!allVals.length) {
    box.innerHTML = '<div class="chart-empty">Нет точек с данными (≥3 измерения в неделе).</div>';
    if (legend) legend.innerHTML = '';
    return;
  }

  const min = Math.min(...allVals);
  const max = Math.max(...allVals);
  const higherBetter = chartMetric === 'success_pct';

  const scoreOf = function(val) {
    if (max === min) return 0.5;
    const t = higherBetter
      ? (val - min) / (max - min)
      : (max - val) / (max - min);
    return Math.max(0, Math.min(1, t));
  };

  const fmtVal = function(val) {
    if (chartMetric === 'success_pct') return Math.round(val) + '%';
    return fmtMin(val);
  };

  const shortName = function(v) {
    if (v === 'aggregate') return 'все';
    const s = String(v);
    const p = s.split('|');
    return p[0] + (p[1] ? ' · ' + p[1] : '');
  };

  let html = '<div class="chart-bars">';

  for (const w of weeks) {
    let weekN = 0;
    for (const v of versions) if (points[v][w]) weekN += points[v][w].n;
    html += '<div class="week-row"><div class="week-label">' + w + '<br><span style="color:#93a1b8;font-weight:700">n=' + weekN + '</span></div><div class="week-bars">';

    let hasAny = false;

    for (const v of versions) {
      const pt = points[v][w];
      if (!pt) continue;

      hasAny = true;

      const t = scoreOf(pt.val);
      const h = Math.round(6 + t * 94);
      const title = shortName(v) + ' · ' + fmtVal(pt.val) + ' · оценка ' + Math.round(t * 100) + '% · n=' + pt.n;

      html +=
        '<div class="model-col" title="' + title.replace(/"/g, '&quot;') + '">' +
          '<div class="model-track">' +
            '<div class="model-fill" style="height:' + h + '%"></div>' +
          '</div>' +
          '<div class="model-value">' + fmtVal(pt.val) + '</div>' +
          '<div class="model-name">' + shortName(v) + '</div>' +
        '</div>';
    }

    if (!hasAny) {
      html += '<div class="note" style="flex:1;margin:0">В этой неделе нет версий с ≥3 измерениями.</div>';
    }

    html += '</div></div>';
  }

  html += '</div>';
  box.innerHTML = html;

  if (legend) {
    const metricName =
      chartMetric === 'median_min' ? 'медиана ошибки' :
      chartMetric === 'mae_min' ? 'MAE' :
      chartMetric === 'p90_min' ? 'P90' :
      'попадания';

    const direction = higherBetter
      ? 'чем выше столбец — тем лучше'
      : 'для ошибок чем ниже значение, тем выше столбец (лучше)';

    legend.innerHTML =
      '<div class="chart-scale"><span>хуже</span><i></i><span>лучше</span></div>' +
      '<div class="note">Столбцы — версии алгоритма по неделям. Высота и цвет показывают относительную оценку по метрике «' + metricName + '»: ' + direction + '. Значение под столбцом — исходная метрика.</div>';
  }
}

function setMetric(m) {
  chartMetric = m;
  document.querySelectorAll('.chart-tabs button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  drawChart();
}

// человеческие названия
const SOURCE_RU = { own: 'ритм самой станции', brand: 'ритм бренда', city: 'ритм города' };
function sourceRu(s) { return SOURCE_RU[s] || s; }
function fuelRu(f) { return f === '92' ? 'АИ-92' : f === '95' ? 'АИ-95' : f === 'diesel' ? 'дизель' : f; }
function versionRu(v) {
  const p = String(v).split('|');
  return p[0] + ' · ' + sourceRu(p[1]);
}
function fmtMin(m) {
  if (m === null || m === undefined || !isFinite(m)) return '—';
  m = Math.round(m);
  if (m < 60) return m + ' мин';
  const h = Math.floor(m / 60), mm = m % 60;
  return h + ' ч' + (mm ? ' ' + mm + ' мин' : '');
}
function fmtPct(v) {
  if (v === null || v === undefined) return '—';
  return Math.round(Number(v) * 100) + '%';
}
function t5(v) { return String(v || '').slice(0, 5); }
function addrPart(x) { return x && x.station_address ? ' · ' + x.station_address : ''; }

// --- новые хелперы: разбор bot_meta и цвета тонов ---
function parseMeta(v) {
  if (!v) return null;
  if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return null; } }
  return v;
}
function toneOfCond(p) {
  if (p === null || p === undefined) return 'tone-i';
  return p >= 50 ? 'tone-g' : p >= 25 ? 'tone-o' : 'tone-r';
}
function condColor(p) {
  if (p === null || p === undefined) return '#5b6b86';
  return p >= 50 ? '#127a55' : p >= 25 ? '#b06a1f' : '#c03434';
}
function toneColor(t) {
  return t === 'tone-g' ? '#127a55' : t === 'tone-o' ? '#b06a1f' : t === 'tone-r' ? '#c03434' : '#5b6b86';
}

// сравнение последней прод-версии с предыдущей: те же пороги, что раньше
// (30 мин для времени, 2 п.п. для попаданий), но каждая строка получает тон
// для подсветки красным/зелёным
function computeTrend(latestP, prev) {
  if (!latestP || !prev) return null;
  if (prev.verified < 10 || latestP.verified < 10) return null;
  const pct = v => (v === null || v === undefined ? '—' : v + '%');
  const metrics = [
    { name: 'Медиана', prev: prev.median_min, last: latestP.median_min, show: fmtMin, lessIsBetter: true, thr: 30 },
    { name: 'MAE', prev: prev.mae_min, last: latestP.mae_min, show: fmtMin, lessIsBetter: true, thr: 30 },
    { name: 'P90', prev: prev.p90_min, last: latestP.p90_min, show: fmtMin, lessIsBetter: true, thr: 30 },
    { name: 'Попаданий', prev: prev.success_pct, last: latestP.success_pct, show: pct, lessIsBetter: false, thr: 2 }
  ];
  let wins = 0, losses = 0;
  const rows = [];
  for (const m of metrics) {
    if (m.prev === null || m.prev === undefined || m.last === null || m.last === undefined) {
      rows.push({ text: m.name + ': данных мало', tone: 'tone-i' });
      continue;
    }
    const diff = m.last - m.prev;
    const improved = m.lessIsBetter ? diff < -m.thr : diff > m.thr;
    const worsened = m.lessIsBetter ? diff > m.thr : diff < -m.thr;
    if (improved) wins++;
    if (worsened) losses++;
    let delta, tone;
    if (!improved && !worsened) { delta = '➖ в пределах погрешности'; tone = 'tone-i'; }
    else if (m.lessIsBetter) { delta = improved ? '✅ на ' + fmtMin(-diff) + ' меньше' : '⚠️ на ' + fmtMin(diff) + ' больше'; tone = improved ? 'tone-g' : 'tone-r'; }
    else { delta = improved ? '✅ на ' + diff + ' п.п. больше' : '⚠️ на ' + (-diff) + ' п.п. меньше'; tone = improved ? 'tone-g' : 'tone-r'; }
    rows.push({ text: m.name + ': ' + m.show(m.prev) + ' → ' + m.show(m.last) + ' · ' + delta, tone: tone });
  }
  let verdict;
  if (wins > losses && losses === 0) verdict = '✅ <b>' + latestP.model_version + '</b>: лучше по ' + wins + ' метрикам из 4, ни по одной не хуже';
  else if (wins > losses) verdict = '➕ <b>' + latestP.model_version + '</b>: лучше по ' + wins + ' метрикам из 4, хуже по ' + losses;
  else if (wins === losses) verdict = '➡️ <b>Метрики спорят</b>: ' + latestP.model_version + ' лучше по ' + wins + ', хуже по ' + losses;
  else verdict = '⚠️ <b>' + latestP.model_version + '</b>: хуже по ' + losses + ' метрикам из 4, лучше по ' + wins;
  return { wins: wins, losses: losses, rows: rows, verdict: verdict };
}

// динамический честный вердикт: страница сама считает его из базы при каждом обновлении
function buildVerdict(d, prodLatest, prodPrev, trend, calibActive, calib) {
  const rr = d.return_rate || {};
  const ws = d.window_stats || {};
  const chips = [];

  if (rr.verified) {
    chips.push({ tone: 'tone-i', text: 'Рынок: возврат был в ' + (rr.base_pct === null || rr.base_pct === undefined ? '—' : rr.base_pct + '%') + ' закрытых окон (' + rr.with_return + ' из ' + rr.verified + ')' });
    chips.push({ tone: toneOfCond(rr.cond_pct), text: 'Условные попадания: ' + (rr.cond_pct === null || rr.cond_pct === undefined ? '—' : rr.cond_pct + '%') + ' окон с возвратом пойманы (общие попадания ' + (rr.success_pct === null || rr.success_pct === undefined ? '—' : rr.success_pct + '%') + ')' });
  } else {
    chips.push({ tone: 'tone-i', text: 'Рынок: закрытых окон пока нет' });
  }

  const med = prodLatest && prodLatest.median_min !== null && prodLatest.median_min !== undefined ? Number(prodLatest.median_min) : null;
  const avgW = ws.avg_width_min !== null && ws.avg_width_min !== undefined ? Number(ws.avg_width_min) : null;
  if (med !== null && avgW) {
    const t = med <= avgW / 2 ? 'tone-g' : med <= avgW ? 'tone-o' : 'tone-r';
    chips.push({ tone: t, text: 'Точность времени: медиана |ошибки| ' + fmtMin(med) + ' при типичном окне ' + fmtMin(avgW) });
  } else {
    chips.push({ tone: 'tone-i', text: 'Точность времени: мало измерений' });
  }

  if (calibActive) {
    chips.push({ tone: 'tone-g', text: 'Уверенность: применена калибровочная таблица (' + String(calib.built_at).slice(0, 10) + ') — % это вероятность' });
  } else {
    chips.push({ tone: 'tone-o', text: 'Уверенность: сырой балл, а не вероятность (калибровочной таблицы нет)' });
  }

  if (trend) {
    const t = (trend.losses === 0 && trend.wins > 0) ? 'tone-g' : (trend.wins >= trend.losses ? 'tone-o' : 'tone-r');
    chips.push({ tone: t, text: 'Тренд: ' + prodLatest.model_version + ' vs ' + prodPrev.model_version + ': лучше по ' + trend.wins + ', хуже по ' + trend.losses });
  } else {
    chips.push({ tone: 'tone-i', text: 'Тренд: проверенных прогнозов пока мало для сравнения версий' });
  }

  const reds = chips.filter(c => c.tone === 'tone-r').length;
  const ors = chips.filter(c => c.tone === 'tone-o').length;
  let final;
  if (reds === 0 && ors === 0) final = 'Ядро держит обещание: все индикаторы зелёные.';
  else if (reds === 0) final = 'Ядро среднее: прямых деградаций нет, но есть жёлтые зоны — смотри плашки выше.';
  else if (reds === 1) final = 'Ядро слабее обещания в одном месте: смотри красную плашку выше.';
  else final = 'Ядро слабее обещания в нескольких местах: смотри красные плашки выше.';

  let html = '<div class="section"><h2>✅ Честный вердикт (страница считает его сама из базы)</h2><div class="vd">';
  for (const c of chips) html += '<div class="vd-chip ' + c.tone + '">' + c.text + '</div>';
  html += '</div><div class="vd-final">' + final + '</div>';
  html += '<div class="note">Красный — деградация/слабое место, зелёный — сила, оранжевый — среднее, серый — фон (рынок или мало данных). Тренд версий сравнивает прогоны в разное время: часть разницы — рынок, а не алгоритм. Вердикт пересчитывается при каждом обновлении.</div></div>';
  return html;
}

async function load() {
  const app = document.getElementById('app');
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/live_stats', {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ secret: DASH_SECRET })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (d.error) throw new Error('токен не подошёл');
    render(d);
    const now = new Date();
    document.getElementById('refreshLine').innerHTML =
      'обновлено в ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0') +
      ' · сам обновлюсь через минуту<button onclick="load()">обновить сейчас</button>';
  } catch (e) {
    app.innerHTML = '<div class="err">Не удалось загрузить данные: ' + e.message + '</div>';
  }
}

function render(d) {
  const app = document.getElementById('app');
  const ws = d.window_stats || {};
  const cs = d.confidence_stats || {};
  const bySource = d.by_source || [];
  const byFuel = d.by_fuel || [];
  const topConf = d.top_confidence || [];
  const narrow = d.narrowest_windows || [];
  const topHome = d.top_confidence_home || [];
  const narrowHome = d.narrowest_windows_home || [];

  // контекст версий и калибровки — считаем один раз, используем и в вердикте, и в карточках
  const vmAll = d.version_metrics || [];
  // сортируем по номеру версии (новые сверху); внутри одного номера прод
  // выше shadow — тогда «текущая» всегда прод, а не архивный эксперимент
  // (кейс 05.10: localeCompare ставил «v1.13|shadow» выше «v1.13»)
  const verKey = v => {
    const m = String(v.model_version).match(/v(\d+)\.(\d+)/);
    return [m ? Number(m[1]) : 0, m ? Number(m[2]) : 0, String(v.model_version).includes('|shadow') ? 0 : 1];
  };
  const vmSorted = vmAll.slice().sort((a, b) => {
    const ka = verKey(a), kb = verKey(b);
    if (kb[0] !== ka[0]) return kb[0] - ka[0];
    if (kb[1] !== ka[1]) return kb[1] - ka[1];
    return kb[2] - ka[2];
  });
  // сравниваем только прод-версии между собой: shadow-когорты — архивные
  // эксперименты (закрыты 03.10), их сравнение с продом сейчас смешало бы
  // периоды, а не алгоритмы
  const prod = vmSorted.filter(v => !String(v.model_version).includes('|shadow'));
  const prodLatest = prod.length ? prod[0] : null;
  const prodPrev = prod.length > 1 ? prod[1] : null;
  const trend = computeTrend(prodLatest, prodPrev);
  const calib = parseMeta(d.calibration_meta);
  const calibActive = !!(calib && Array.isArray(calib.points) && calib.points.length >= 2 &&
    (Date.now() - Date.parse(calib.built_at)) <= 21 * 24 * 3600 * 1000);
  const shift = parseMeta(d.fuel_shift_meta);

  let html = '';

  // итог одним блоком
  html += '<div class="section hero"><div class="hero-num">' + (d.total || 0) + '</div><div class="hero-right">' +
    '<div class="hero-cap">прогнозов на сегодня ещё не проверены</div>' +
    '<div class="hero-lines">' +
    '<div>Создано сегодня: <b>' + (d.created_today || 0) + '</b>, остальные перенесены с прошлых прогонов.</div>' +
    '<div>Окно обычно: <b>' + fmtMin(ws.avg_width_min) + '</b> (самое узкое ' + fmtMin(ws.min_width_min) + ', самое широкое ' + fmtMin(ws.max_width_min) + ').</div>' +
    '<div>Уверенность в среднем: <b>' + fmtPct(cs.avg) + '</b> (от ' + fmtPct(cs.min) + ' до ' + fmtPct(cs.max) + ').</div>' +
    '</div></div></div>';

  // динамический честный вердикт — сразу после шапки
  html += buildVerdict(d, prodLatest, prodPrev, trend, calibActive, calib);

  // твой город
  html += '<div class="section"><h2>🏠 Твой город (Новороссийск)</h2>';
  html += '<div class="subcap">Самые уверенные прогнозы</div>';
  if (!topHome.length) html += '<div class="note">По городу сегодня нет непроверенных прогнозов.</div>';
  topHome.forEach(t => {
    html += '<div class="row"><span class="nm">' + (t.station_name || 'АЗС') + '<small>' + fuelRu(t.fuel_type) + ' · ' + sourceRu(t.prediction_source) + addrPart(t) + '</small></span>' +
      '<span class="vl">' + t5(t.from_time) + '–' + t5(t.to_time) + ' · ' + fmtPct(t.confidence) + '</span></div>';
  });
  html += '<div class="subcap">Самые узкие окна</div>';
  if (!narrowHome.length) html += '<div class="note">По городу сегодня нет непроверенных прогнозов.</div>';
  narrowHome.forEach(n => {
    html += '<div class="row"><span class="nm">' + (n.station_name || 'АЗС') + '<small>' + fuelRu(n.fuel_type) + ' · ' + sourceRu(n.prediction_source) + addrPart(n) + '</small></span>' +
      '<span class="vl">' + t5(n.from_time) + '–' + t5(n.to_time) + ' · ' + fmtMin(n.width_min) + '</span></div>';
  });
  html += '</div>';

  // кто предсказывает
  html += '<div class="section"><h2>🧠 Чьим ритмом предсказываем</h2>';
  const maxSrc = Math.max(1, ...bySource.map(x => x.count));
  bySource.forEach(s => {
    const w = Math.round(s.count / maxSrc * 100);
    html += '<div class="bar-row"><span>' + sourceRu(s.source) + '</span><div class="bar-track"><div class="bar" style="width:' + w + '%"></div></div><b>' + s.count + '</b></div>';
  });
  html += '<div class="note">«Ритм самой станции» — по её собственным возвратам; «бренда» и «города» — когда своих событий мало.</div></div>';

  // по топливам
  html += '<div class="section"><h2>⛽ По топливам</h2>';
  const maxFuel = Math.max(1, ...byFuel.map(x => x.count));
  byFuel.forEach(f => {
    const w = Math.round(f.count / maxFuel * 100);
    html += '<div class="bar-row"><span>' + fuelRu(f.fuel_type) + '</span><div class="bar-track"><div class="bar green" style="width:' + w + '%"></div></div><b>' + f.count + '</b></div>';
  });
  html += '</div>';

  // версии алгоритма — сравнение качества
  html += '<div class="section"><h2>🔬 Версии алгоритма · сравнение качества</h2>';
  if (!vmAll.length) {
    html += '<div class="note">Пока нет данных для сравнения — верификатор не проверил ни одного прогноза.</div>';
  } else {
    html += '<div class="subcap">Метрики по верифицированным прогнозам</div>';
    const latest = vmSorted[0];
    // карточки вместо таблицы: 6 колонок не влезают в телефон,
    // а карточка держит метрики в 2 колонки — ничего не обрезается
    vmSorted.forEach(vm => {
      const isLatest = vm.model_version === latest.model_version;
      const isShadow = String(vm.model_version).includes('|shadow');
      const shadowDone = vm.total > 0 && vm.verified >= vm.total;
      const tag = isLatest ? ' · текущая' : (isShadow ? (shadowDone ? ' · shadow, эксперимент завершён' : ' · shadow, эксперимент идёт') : '');
      html += '<div style="margin-bottom:8px;padding:10px 12px;border-radius:14px;background:' + (isLatest ? '#f0f9ff' : '#f7f9fc') + ';border:1px solid ' + (isLatest ? '#bcd4ff' : '#e6ebf4') + '">';
      html += '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">' +
        '<b style="font-size:13px">' + vm.model_version + tag + '</b>' +
        '<span style="color:#71809c;font-size:10px;font-weight:700">проверено ' + (vm.verified || 0) + ' из ' + (vm.total || 0) + '</span></div>';
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:6px;font-size:11px;color:#5b6b86;font-weight:700">';
      html += '<div>Медиана: <b style="color:#14213d">' + fmtMin(vm.median_min) + '</b></div>';
      html += '<div>Попаданий: <b style="color:#14213d">' + (vm.success_pct === null || vm.success_pct === undefined ? '—' : vm.success_pct + '%') + '</b></div>';
      html += '<div>MAE: <b style="color:#14213d">' + fmtMin(vm.mae_min) + '</b></div>';
      html += '<div>P90: <b style="color:#14213d">' + fmtMin(vm.p90_min) + '</b></div>';
      html += '</div>';
      // base rate по версии: сколько окон вообще имели возврат и условные попадания
      const ver = vm.verified || 0;
      const wr = vm.with_return || 0;
      const baseP = ver ? Math.round(100 * wr / ver) : null;
      html += '<div style="margin-top:6px;font-size:10px;color:#71809c;font-weight:700">Возврат был в ' + (baseP === null ? '—' : baseP + '%') + ' закрытых окон · <span style="color:' + condColor(vm.cond_pct) + ';font-weight:800">условные попадания: ' + (vm.cond_pct === null || vm.cond_pct === undefined ? '—' : vm.cond_pct + '%') + '</span> (среди окон, где топливо реально вернулось)</div>';
      html += '</div>';
    });

    // сравнение с предыдущей версией — честно по всем 4 метрикам, строки с цветом
    if (prod.length >= 2) {
      if (trend) {
        html += '<div style="margin-top:12px;padding:10px;background:#eef4ff;border-radius:10px;font-size:11px;line-height:1.6">';
        html += '<div style="font-weight:900;margin-bottom:4px">Сравнение: ' + prodLatest.model_version + ' vs ' + prodPrev.model_version + ' (проверено ' + prodLatest.verified + ' vs ' + prodPrev.verified + ')</div>';
        for (const r of trend.rows) html += '<div style="color:' + toneColor(r.tone) + '">' + r.text + '</div>';
        html += '<div style="margin-top:6px;font-weight:800">' + trend.verdict + '</div>';
        html += '<div class="note" style="margin-top:6px">Версии работали в разное время и на разных станциях: часть разницы — от рынка, а не от алгоритма. Shadow-когорты (одновременные прогнозы) показаны отдельными карточками и в это сравнение не входят.</div>';
        html += '</div>';
      } else {
        html += '<div class="note" style="margin-top:8px">Для сравнения нужно ≥10 проверенных прогнозов в каждой версии. Сейчас: ' + prodLatest.model_version + ' — ' + prodLatest.verified + ', ' + prodPrev.model_version + ' — ' + prodPrev.verified + '.</div>';
      }
    } else {
      html += '<div class="note" style="margin-top:8px">Пока только одна прод-версия — сравнение появится, когда накопятся данные для двух версий.</div>';
    }
  }
  html += '<div class="note" style="margin-top:8px"><b>Медиана</b> — половина прогнозов ошибается меньше, половина больше. <b>MAE</b> — средняя ошибка. <b>P90</b> — худшие 10% прогнозов. <b>Попадания</b> — доля прогнозов, попавших в окно возврата.</div>';
  html += '</div>';

  // base rate рынка, корзины ширины окна, режим уверенности
  html += '<div class="section"><h2>🧾 Base rate рынка · ширины окон · режим уверенности</h2>';
  const rr = d.return_rate || {};
  if (rr.verified) {
    html += '<div class="row"><span class="nm">Закрытых окон (верифицировано, прод)<small>включая дни, когда топливо вообще не вернулось</small></span><span class="vl">' + rr.verified + '</span></div>';
    html += '<div class="row"><span class="nm">Из них возврат вообще был<small>base rate рынка</small></span><span class="vl">' + rr.with_return + ' · ' + (rr.base_pct === null || rr.base_pct === undefined ? '—' : rr.base_pct + '%') + '</span></div>';
    html += '<div class="row"><span class="nm">Попаданий общих<small>включая окна, где возврата не было</small></span><span class="vl">' + (rr.success_pct === null || rr.success_pct === undefined ? '—' : rr.success_pct + '%') + '</span></div>';
    html += '<div class="row"><span class="nm">Условные попадания<small>только среди окон, где возврат был</small></span><span class="vl" style="color:' + condColor(rr.cond_pct) + '">' + (rr.cond_pct === null || rr.cond_pct === undefined ? '—' : rr.cond_pct + '%') + '</span></div>';
  } else {
    html += '<div class="note">Закрытых окон пока нет.</div>';
  }
  const wb = d.width_buckets || [];
  html += '<div class="subcap">Попадания по ширине окна</div>';
  if (!wb.length) html += '<div class="note">Пока нет верифицированных окон с посчитанной шириной.</div>';
  wb.forEach(b => {
    html += '<div class="row"><span class="nm">Окно ' + b.bucket + '<small>верифицировано ' + b.n + ' · возврат был ' + b.with_return + '</small></span>' +
      '<span class="vl"><span style="color:#93a1b8">' + (b.success_pct === null || b.success_pct === undefined ? '—' : b.success_pct + '%') + '</span> / <span style="color:' + condColor(b.cond_pct) + '">' + (b.cond_pct === null || b.cond_pct === undefined ? '—' : b.cond_pct + '%') + '</span></span></div>';
  });
  html += '<div class="note">Корзина «≤1 ч» (включая 30-минутные окна) — эксперимент: показывается со своей метрикой попаданий, а не как достижение. Два числа: общие попадания (серые, их давит base rate рынка) / условные среди окон с возвратом (цвет: ≥50% зелёный, 25–49% оранжевый, &lt;25% красный).</div>';
  const nv = d.naive_stats || {};
  html += '<div class="subcap">Модель против наива (чем окупается хлеб)</div>';
  if (nv.n) {
    const rr2 = d.return_rate || {};
    const modelCond = rr2.cond_pct;
    const condBetter = modelCond != null && nv.rand_cond_pct != null && modelCond >= nv.rand_cond_pct;
    const winBetter = nv.med_abs_win != null && nv.med_abs_base != null && nv.med_abs_win <= nv.med_abs_base;
    html += '<div class="row"><span class="nm">Условные попадания: модель против случайного окна той же ширины<small>случайное окно внутри 06:00–23:00 ловит возврат с вероятностью ≈ ширина/17ч</small></span><span class="vl"><span style="color:' + (condBetter ? '#127a55' : '#c03434') + '">' + (modelCond == null ? '—' : modelCond + '%') + '</span> / ' + (nv.rand_cond_pct == null ? '—' : nv.rand_cond_pct + '%') + '</span></div>';
    html += '<div class="row"><span class="nm">Медиана |ошибки|: центр окна против голой медианы длительности<small>baseline — медиана эпизодов «исчезло→вернулось» без k-NN и сдвигов</small></span><span class="vl"><span style="color:' + (winBetter ? '#127a55' : '#c03434') + '">' + fmtMin(nv.med_abs_win) + '</span> / ' + fmtMin(nv.med_abs_base) + '</span></div>';
    html += '<div class="note">Измерено на ' + nv.n + ' верифицированных окнах, из них с возвратом ' + nv.with_return + '. Модель окупается, когда первое число зелёное и выше наива, а медиана ошибки ниже наива.</div>';
  } else {
    html += '<div class="note">Пока мало верифицированных окон для сравнения с наивом.</div>';
  }
  html += '<div class="subcap">Уверенность: какой режим</div>';
  if (calibActive) {
    html += '<div class="vd-chip tone-g" style="display:inline-block">Калибровочная таблица применена: от ' + String(calib.built_at).slice(0, 10) + ', по ' + calib.n + ' проверенным (' + calib.successes + ' попаданий). Уверенность на странице и сайте = вероятность.</div>';
  } else {
    html += '<div class="vd-chip tone-o" style="display:inline-block">Калибровочной таблицы нет — сырая уверенность (ворота не пройдены или не накопились). Процент уверенности сейчас — балл, а не вероятность.</div>';
  }
  if (shift && shift.entries) {
    const parts = Object.keys(shift.entries).map(f => {
      const e = shift.entries[f];
      const bw = e.bias_window_min == null ? '—' : (e.bias_window_min >= 0 ? '+' : '') + e.bias_window_min + ' мин';
      const sw = e.shift_window_min == null ? 'без сдвига' : ((e.shift_window_min >= 0 ? '+' : '') + e.shift_window_min + ' мин');
      const be = e.bias_eta_min == null ? '—' : (e.bias_eta_min >= 0 ? '+' : '') + e.bias_eta_min + ' мин';
      const se = e.shift_eta_min == null ? 'без сдвига' : ((e.shift_eta_min >= 0 ? '+' : '') + e.shift_eta_min + ' мин');
      const clampHit = (e.bias_eta_min != null && e.shift_eta_min != null && Math.abs(e.bias_eta_min) > Math.abs(e.shift_eta_min)) ? ' (упёрся в зажим ±6ч!)' : '';
      return fuelRu(f) + ': bias окна ' + bw + ' → ' + sw + '; bias ETA ' + be + ' → ' + se + clampHit;
    });
    html += '<div class="note" style="margin-top:6px">Самообучение промахов: таблица от ' + String(shift.built_at).slice(0, 10) + ' — ' + parts.join('; ') + '. Bias — измеренное медианное отставание факта; сдвиг — что применено (зажато ±6ч). С v1.15 ETA = центр окна, shift_eta_min не применяется.</div>';
  } else {
    html += '<div class="note" style="margin-top:6px">Таблицы сдвигов промахов нет — окно и ETA считаются как раньше.</div>';
  }
  html += '</div>';

  // самые уверенные
  html += '<div class="section"><h2>💪 Самые уверенные прогнозы</h2>';
  if (!topConf.length) html += '<div class="note">Пока пусто.</div>';
  topConf.forEach(t => {
    html += '<div class="row"><span class="nm">' + (t.station_name || 'АЗС') + '<small>' + fuelRu(t.fuel_type) + ' · ' + sourceRu(t.prediction_source) + addrPart(t) + '</small></span>' +
      '<span class="vl">' + t5(t.from_time) + '–' + t5(t.to_time) + ' · ' + fmtPct(t.confidence) + '</span></div>';
  });
  html += '</div>';

  // самые узкие окна
  html += '<div class="section"><h2>🎯 Самые узкие окна (где алгоритм увереннее всего во времени)</h2>';
  if (!narrow.length) html += '<div class="note">Пока пусто.</div>';
  narrow.forEach(n => {
    html += '<div class="row"><span class="nm">' + (n.station_name || 'АЗС') + '<small>' + fuelRu(n.fuel_type) + ' · ' + sourceRu(n.prediction_source) + addrPart(n) + '</small></span>' +
      '<span class="vl">' + t5(n.from_time) + '–' + t5(n.to_time) + ' · ' + fmtMin(n.width_min) + '</span></div>';
  });
  html += '<div class="note">После v1.10 узкие окна (4–6 часов) — норма для станций с ровным ритмом привозов. Реальную пользу узких окон смотри в секции «🧾» выше: корзина «≤1 ч» со своей метрикой попаданий.</div></div>';

  // график качества моделей
  html += '<div class="section"><h2>📈 Качество моделей по неделям</h2>';
  html += '<div class="chart-tabs">';
  html += '<button data-m="median_min" class="' + (chartMetric === 'median_min' ? 'on' : '') + '" onclick="setMetric(\'median_min\')">Медиана ошибки</button>';
  html += '<button data-m="mae_min" class="' + (chartMetric === 'mae_min' ? 'on' : '') + '" onclick="setMetric(\'mae_min\')">MAE</button>';
  html += '<button data-m="p90_min" class="' + (chartMetric === 'p90_min' ? 'on' : '') + '" onclick="setMetric(\'p90_min\')">P90 (худшие 10%)</button>';
  html += '<button data-m="success_pct" class="' + (chartMetric === 'success_pct' ? 'on' : '') + '" onclick="setMetric(\'success_pct\')">Попадания, %</button>';
  html += '</div>';
  html += '<div id="chartBox" class="chart"></div>';
  html += '<div id="chartLegend"></div>';
  html += '<div class="note">Переключи метрику кнопками выше. Красный — хуже, зелёный — лучше; высота столбца показывает относительное улучшение.</div>';
  html += '</div>';

  app.innerHTML = html;
  chartData = d;
  drawChart();
}

load();
setInterval(load, 60000);
</script>
