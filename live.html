<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КогдаБенз · живой мониторинг прогнозов</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: #f3f7ff; color: #14213d; padding: 16px; max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 2px; }
  .sub { color: #71809c; font-size: 11px; margin-bottom: 6px; }
  .refresh { color: #93a1b8; font-size: 10px; margin-bottom: 14px; }
  .refresh button { border: 1px solid #e6ebf4; background: #fff; color: #2465ee; border-radius: 10px; padding: 4px 10px; font-size: 10px; font-weight: 800; cursor: pointer; margin-left: 8px; }
  .section { background: #fff; border: 1px solid #e6ebf4; border-radius: 16px; padding: 14px; margin-bottom: 12px; box-shadow: 0 10px 26px rgba(38,69,120,.07); }
  .section h2 { font-size: 13px; margin-bottom: 10px; }
  .hero { display: flex; gap: 14px; align-items: center; background: linear-gradient(135deg, #ffffff, #eef4ff); }
  .hero-num { flex: 0 0 auto; font-size: 46px; font-weight: 900; letter-spacing: -2px; line-height: 1; background: linear-gradient(90deg, #2465ee, #2ea3ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero-right { min-width: 0; }
  .hero-cap { font-size: 10px; font-weight: 800; color: #5b7ba6; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .hero-lines { color: #33445f; font-size: 12px; line-height: 1.55; }
  .hero-lines b { color: #14213d; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
  .bar-row span { flex: 0 0 46%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; height: 16px; min-width: 0; }
  .bar { height: 16px; border-radius: 8px; background: linear-gradient(90deg, #4385ff, #2465ee); min-width: 2px; }
  .bar.green { background: linear-gradient(90deg, #21b986, #19b77a); }
  .bar.orange { background: linear-gradient(90deg, #f5d565, #f5a05a); }
  .bar-row b { flex: 0 0 auto; }
  .note { margin-top: 8px; color: #93a1b8; font-size: 10px; line-height: 1.4; }
  .subcap { font-size: 11px; font-weight: 800; color: #5b7ba6; margin: 10px 0 4px; }
  .row { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; border-bottom: 1px dashed #e6ebf4; font-size: 12px; }
  .row:last-child { border-bottom: 0; }
  .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .nm small { display: block; color: #93a1b8; font-size: 10px; white-space: normal; }
  .row .vl { flex: 0 0 auto; font-weight: 800; }
  .err { padding: 20px; background: #fff2e8; border-radius: 14px; color: #c26a2a; font-weight: 700; }
  .chart { width: 100%; height: 280px; background: #fff; border: 1px solid #e6ebf4; border-radius: 14px; overflow: hidden; }
  .chart-tabs { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
  .chart-tabs button { border: 1px solid #e6ebf4; background: #f7f9fc; color: #5b6b86; border-radius: 10px; padding: 5px 11px; font-size: 11px; font-weight: 800; cursor: pointer; }
  .chart-tabs button.on { background: linear-gradient(135deg, #4385ff, #2465ee); color: #fff; border-color: transparent; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; font-size: 10px; font-weight: 800; color: #5b6b86; }
  .chart-legend span { display: flex; align-items: center; gap: 5px; }
  .chart-legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; }
  .chart-empty { padding: 60px 10px; text-align: center; color: #93a1b8; font-size: 11px; }
  .chart-tip { position: absolute; pointer-events: none; background: #14213d; color: #fff; font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
</style>
</head>
<body>
  <h1>⚡ КогдаБенз · живой мониторинг</h1>
  <div class="sub">Прогнозы на сегодня, которые ещё не проверены ночью. Только для владельца.</div>
  <div class="refresh" id="refreshLine">обновляюсь сам каждую минуту<button onclick="load()">обновить сейчас</button></div>
  <div id="app"><div class="err">Загружаю данные…</div></div>

<script>
const SUPABASE_URL = 'https://tiargqbjtraqaooxjafy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpYXJncWJqdHJhcWFvb3hqYWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzOTQ2NjYsImV4cCI6MjEwNDk3MDY2Nn0.eVra5X-9Y3aoQJsZf1uPn9D1m14A3GsiIC5QPa-o31E';
const DASH_SECRET = 'kb-dash-2026-x9f3k'; // тот же, что в dash.html и в SQL
// цвета линий: старая версия — серая, прошлая — оранжевая, текущая — синяя,
// aggregate (общая) — чёрная толстая
const VERSION_COLORS = {
  'v1.1': '#93a1b8',
  'v1.2': '#f5a05a',
  'v1.11': '#2465ee',
  'aggregate': '#14213d'
};
function versionColor(v) {
  if (VERSION_COLORS[v]) return VERSION_COLORS[v];
  // неизвестная версия — по хешу имени, чтобы не ломалось
  let h = 0; for (const c of String(v)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return 'hsl(' + (h % 360) + ', 60%, 45%)';
}
let chartData = null;
let chartMetric = 'median_min'; // median_min / mae_min / p90_min / success_pct

function drawChart() {
  const box = document.getElementById('chartBox');
  if (!box || !chartData) return;
  const ts = chartData.version_timeseries || [];
  const agg = chartData.aggregate_timeseries || [];
  if (!ts.length && !agg.length) { box.innerHTML = '<div class="chart-empty">Пока нет данных для графика — верификатор не проверил ни одной недели.</div>'; return; }

  // собираем все недели из обоих массивов, сортируем по ISO-формату (строки сами сортируются)
  const weeksSet = new Set();
  for (const p of ts) weeksSet.add(p.week);
  for (const p of agg) weeksSet.add(p.week);
  const weeks = Array.from(weeksSet).sort();
  if (!weeks.length) { box.innerHTML = '<div class="chart-empty">Нет недель с данными.</div>'; return; }

  // собираем линии: для каждой версии — массив значений по неделям (null если данных < 3)
  const versions = Array.from(new Set(ts.map(p => p.version))).sort();
  const lines = {};
  for (const v of versions) {
    lines[v] = weeks.map(w => {
      const row = ts.find(p => p.version === v && p.week === w);
      if (!row || row.n < 3) return null; // ворота честности
      return row[chartMetric];
    });
  }
  // aggregate
  const aggLine = weeks.map(w => {
    const row = agg.find(p => p.week === w);
    if (!row || row.n < 3) return null;
    return row[chartMetric];
  });

  // масштаб Y: берём все ненулевые значения + 10% запаса
  const allVals = [];
  for (const arr of Object.values(lines)) for (const v of arr) if (v !== null) allVals.push(v);
  for (const v of aggLine) if (v !== null) allVals.push(v);
  if (!allVals.length) { box.innerHTML = '<div class="chart-empty">Нет точек с данными (≥3 измерения в неделе).</div>'; return; }
  const yMin = 0;
  const yMax = Math.max(...allVals) * 1.1;
  const isPct = chartMetric === 'success_pct';

  // размеры SVG
  const W = box.clientWidth || 560, H = 280;
  // левое поле шире, чтобы «N ч MM мин» влезало целиком,
  // правое шире, чтобы последняя неделя не обрезалась
  const padL = 74, padR = 40, padT = 18, padB = 32;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const xAt = i => padL + plotW * (i / Math.max(1, weeks.length - 1));
  const yAt = v => padT + plotH * (1 - (v - yMin) / (yMax - yMin));

  let svg = '<svg width="' + W + '" height="' + H + '" style="display:block">';
  // сетка
  const yTicks = 4;
  for (let i = 0; i <= yTicks; i++) {
    const y = padT + plotH * (i / yTicks);
    const v = yMax - (yMax - yMin) * (i / yTicks);
    svg += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y + '" y2="' + y + '" stroke="#e6ebf4" stroke-dasharray="3 3"/>';
    const label = isPct ? Math.round(v) + '%' : fmtMin(Math.round(v));
    svg += '<text x="' + (padL - 6) + '" y="' + (y + 3) + '" text-anchor="end" font-size="9" font-weight="700" fill="#93a1b8">' + label + '</text>';
  }
  // подписи X (недели) — не чаще чем каждая 3-я, иначе каша
  const step = weeks.length <= 6 ? 1 : weeks.length <= 12 ? 2 : 3;
  for (let i = 0; i < weeks.length; i += step) {
    const x = xAt(i);
    // крайние подписи прижимаем к краям, чтобы не резались:
    // первая неделя — от левого края, последняя — к правому
    const anchor = i === 0 ? 'start' : (i === weeks.length - 1 ? 'end' : 'middle');
    svg += '<text x="' + x + '" y="' + (H - padB + 14) + '" text-anchor="' + anchor + '" font-size="9" font-weight="700" fill="#93a1b8">' + weeks[i] + '</text>';
    svg += '<line x1="' + x + '" x2="' + x + '" y1="' + (H - padB) + '" y2="' + (H - padB + 4) + '" stroke="#93a1b8"/>';
  }
  // если шаг перескочил последнюю неделю — всё равно подписываем её
  const lastI = weeks.length - 1;
  if (lastI % step !== 0) {
    const x = xAt(lastI);
    svg += '<text x="' + x + '" y="' + (H - padB + 14) + '" text-anchor="end" font-size="9" font-weight="700" fill="#93a1b8">' + weeks[lastI] + '</text>';
    svg += '<line x1="' + x + '" x2="' + x + '" y1="' + (H - padB) + '" y2="' + (H - padB + 4) + '" stroke="#93a1b8"/>';
  }

  function pathD(arr) {
    let d = '', first = true;
    for (let i = 0; i < arr.length; i++) {
      if (arr[i] === null) { first = true; continue; }
      d += (first ? 'M' : 'L') + xAt(i).toFixed(1) + ',' + yAt(arr[i]).toFixed(1);
      first = false;
    }
    return d;
  }

  // aggregate — толстая, рисуем первой
  const aggPath = pathD(aggLine);
  if (aggPath) svg += '<path d="' + aggPath + '" fill="none" stroke="' + versionColor('aggregate') + '" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>';
  // версии — сверху aggregate
  for (const v of versions) {
    const d = pathD(lines[v]);
    if (d) svg += '<path d="' + d + '" fill="none" stroke="' + versionColor(v) + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    // точки на линиях
    for (let i = 0; i < lines[v].length; i++) {
      if (lines[v][i] !== null) svg += '<circle cx="' + xAt(i).toFixed(1) + '" cy="' + yAt(lines[v][i]).toFixed(1) + '" r="3" fill="' + versionColor(v) + '"/>';
    }
  }
  svg += '</svg>';
  box.innerHTML = svg;

  // легенда
  let leg = '<div class="chart-legend">';
  for (const v of versions) {
    leg += '<span><i style="background:' + versionColor(v) + '"></i>' + v + '</span>';
  }
  leg += '<span><i style="background:' + versionColor('aggregate') + ';height:4px"></i>всё вместе</span>';
  leg += '</div>';
  document.getElementById('chartLegend').innerHTML = leg;
}

function setMetric(m) {
  chartMetric = m;
  document.querySelectorAll('.chart-tabs button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  drawChart();
}

// человеческие названия
const SOURCE_RU = { own: 'ритм самой станции', brand: 'ритм бренда', city: 'ритм города' };
function sourceRu(s) { return SOURCE_RU[s] || s; }
function fuelRu(f) { return f === '92' ? 'АИ-92' : f === '95' ? 'АИ-95' : f === 'diesel' ? 'дизель' : f; }
function versionRu(v) {
  const p = String(v).split('|');
  return p[0] + ' · ' + sourceRu(p[1]);
}
function fmtMin(m) {
  if (m === null || m === undefined || !isFinite(m)) return '—';
  m = Math.round(m);
  if (m < 60) return m + ' мин';
  const h = Math.floor(m / 60), mm = m % 60;
  return h + ' ч' + (mm ? ' ' + mm + ' мин' : '');
}
function fmtPct(v) {
  if (v === null || v === undefined) return '—';
  return Math.round(Number(v) * 100) + '%';
}
function t5(v) { return String(v || '').slice(0, 5); }
function addrPart(x) { return x && x.station_address ? ' · ' + x.station_address : ''; }

async function load() {
  const app = document.getElementById('app');
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/live_stats', {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ secret: DASH_SECRET })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (d.error) throw new Error('токен не подошёл');
    render(d);
    const now = new Date();
    document.getElementById('refreshLine').innerHTML =
      'обновлено в ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0') +
      ' · сам обновлюсь через минуту<button onclick="load()">обновить сейчас</button>';
  } catch (e) {
    app.innerHTML = '<div class="err">Не удалось загрузить данные: ' + e.message + '</div>';
  }
}

function render(d) {
  const app = document.getElementById('app');
  const ws = d.window_stats || {};
  const cs = d.confidence_stats || {};
  const bySource = d.by_source || [];
  const byFuel = d.by_fuel || [];
  const byVersion = d.by_version || [];
  const topConf = d.top_confidence || [];
  const narrow = d.narrowest_windows || [];
  const topHome = d.top_confidence_home || [];
  const narrowHome = d.narrowest_windows_home || [];
  let html = '';

  // итог одним блоком
  html += '<div class="section hero"><div class="hero-num">' + (d.total || 0) + '</div><div class="hero-right">' +
    '<div class="hero-cap">прогнозов на сегодня ещё не проверены</div>' +
    '<div class="hero-lines">' +
    '<div>Создано сегодня: <b>' + (d.created_today || 0) + '</b>, остальные перенесены с прошлых прогонов.</div>' +
    '<div>Окно обычно: <b>' + fmtMin(ws.avg_width_min) + '</b> (самое узкое ' + fmtMin(ws.min_width_min) + ', самое широкое ' + fmtMin(ws.max_width_min) + ').</div>' +
    '<div>Уверенность в среднем: <b>' + fmtPct(cs.avg) + '</b> (от ' + fmtPct(cs.min) + ' до ' + fmtPct(cs.max) + ').</div>' +
    '</div></div></div>';

  // твой город
  html += '<div class="section"><h2>🏠 Твой город (Новороссийск)</h2>';
  html += '<div class="subcap">Самые уверенные прогнозы</div>';
  if (!topHome.length) html += '<div class="note">По городу сегодня нет непроверенных прогнозов.</div>';
  topHome.forEach(t => {
    html += '<div class="row"><span class="nm">' + (t.station_name || 'АЗС') + '<small>' + fuelRu(t.fuel_type) + ' · ' + sourceRu(t.prediction_source) + addrPart(t) + '</small></span>' +
      '<span class="vl">' + t5(t.from_time) + '–' + t5(t.to_time) + ' · ' + fmtPct(t.confidence) + '</span></div>';
  });
  html += '<div class="subcap">Самые узкие окна</div>';
  if (!narrowHome.length) html += '<div class="note">По городу сегодня нет непроверенных прогнозов.</div>';
  narrowHome.forEach(n => {
    html += '<div class="row"><span class="nm">' + (n.station_name || 'АЗС') + '<small>' + fuelRu(n.fuel_type) + ' · ' + sourceRu(n.prediction_source) + addrPart(n) + '</small></span>' +
      '<span class="vl">' + t5(n.from_time) + '–' + t5(n.to_time) + ' · ' + fmtMin(n.width_min) + '</span></div>';
  });
  html += '</div>';

  // кто предсказывает
  html += '<div class="section"><h2>🧠 Чьим ритмом предсказываем</h2>';
  const maxSrc = Math.max(1, ...bySource.map(x => x.count));
  bySource.forEach(s => {
    const w = Math.round(s.count / maxSrc * 100);
    html += '<div class="bar-row"><span>' + sourceRu(s.source) + '</span><div class="bar-track"><div class="bar" style="width:' + w + '%"></div></div><b>' + s.count + '</b></div>';
  });
  html += '<div class="note">«Ритм самой станции» — по её собственным возвратам; «бренда» и «города» — когда своих событий мало.</div></div>';

  // по топливам
  html += '<div class="section"><h2>⛽ По топливам</h2>';
  const maxFuel = Math.max(1, ...byFuel.map(x => x.count));
  byFuel.forEach(f => {
    const w = Math.round(f.count / maxFuel * 100);
    html += '<div class="bar-row"><span>' + fuelRu(f.fuel_type) + '</span><div class="bar-track"><div class="bar green" style="width:' + w + '%"></div></div><b>' + f.count + '</b></div>';
  });
  html += '</div>';

  // версии алгоритма — сравнение качества
  html += '<div class="section"><h2>🔬 Версии алгоритма · сравнение качества</h2>';
  const versionMetrics = d.version_metrics || [];
  if (!versionMetrics.length) {
    html += '<div class="note">Пока нет данных для сравнения — верификатор не проверил ни одного прогноза.</div>';
  } else {
    html += '<div class="subcap">Метрики по верифицированным прогнозам</div>';
    // сортируем по дате версии (новые сверху)
    const sorted = versionMetrics.slice().sort((a, b) => b.model_version.localeCompare(a.model_version, undefined, { numeric: true }));
    const latest = sorted[0];
    // карточки вместо таблицы: 6 колонок не влезают в телефон,
    // а карточка держит метрики в 2 колонки — ничего не обрезается
    sorted.forEach(vm => {
      const isLatest = vm.model_version === latest.model_version;
      html += '<div style="margin-bottom:8px;padding:10px 12px;border-radius:14px;background:' + (isLatest ? '#f0f9ff' : '#f7f9fc') + ';border:1px solid ' + (isLatest ? '#bcd4ff' : '#e6ebf4') + '">';
      html += '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">' +
        '<b style="font-size:13px">' + vm.model_version + (isLatest ? ' · текущая' : '') + '</b>' +
        '<span style="color:#71809c;font-size:10px;font-weight:700">проверено ' + (vm.verified || 0) + ' из ' + (vm.total || 0) + '</span></div>';
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:6px;font-size:11px;color:#5b6b86;font-weight:700">';
      html += '<div>Медиана: <b style="color:#14213d">' + fmtMin(vm.median_min) + '</b></div>';
      html += '<div>Попаданий: <b style="color:#14213d">' + (vm.success_pct === null || vm.success_pct === undefined ? '—' : vm.success_pct + '%') + '</b></div>';
      html += '<div>MAE: <b style="color:#14213d">' + fmtMin(vm.mae_min) + '</b></div>';
      html += '<div>P90: <b style="color:#14213d">' + fmtMin(vm.p90_min) + '</b></div>';
      html += '</div></div>';
    });
    
    // сравнение с предыдущей версией — честно по всем 4 метрикам:
    // каждая голосует сама (порог: 30 мин для времени, 2 п.п. для попаданий),
    // вердикт — по счёту голосов, а не по одной медиане
    if (sorted.length >= 2) {
      const prev = sorted[1];
      if (prev.verified >= 10 && latest.verified >= 10) {
        const pct = v => (v === null || v === undefined ? '—' : v + '%');
        const metrics = [
          { name: 'Медиана', prev: prev.median_min, last: latest.median_min, show: fmtMin, lessIsBetter: true, thr: 30 },
          { name: 'MAE', prev: prev.mae_min, last: latest.mae_min, show: fmtMin, lessIsBetter: true, thr: 30 },
          { name: 'P90', prev: prev.p90_min, last: latest.p90_min, show: fmtMin, lessIsBetter: true, thr: 30 },
          { name: 'Попаданий', prev: prev.success_pct, last: latest.success_pct, show: pct, lessIsBetter: false, thr: 2 }
        ];
        let wins = 0, losses = 0, rowsHtml = '';
        for (const m of metrics) {
          if (m.prev === null || m.prev === undefined || m.last === null || m.last === undefined) {
            rowsHtml += '<div>' + m.name + ': данных мало</div>';
            continue;
          }
          const diff = m.last - m.prev;
          const improved = m.lessIsBetter ? diff < -m.thr : diff > m.thr;
          const worsened = m.lessIsBetter ? diff > m.thr : diff < -m.thr;
          if (improved) wins++;
          if (worsened) losses++;
          let delta;
          if (!improved && !worsened) delta = '➖ в пределах погрешности';
          else if (m.lessIsBetter) delta = improved ? '✅ на ' + fmtMin(-diff) + ' меньше' : '⚠️ на ' + fmtMin(diff) + ' больше';
          else delta = improved ? '✅ на ' + diff + ' п.п. больше' : '⚠️ на ' + (-diff) + ' п.п. меньше';
          rowsHtml += '<div>' + m.name + ': ' + m.show(m.prev) + ' → ' + m.show(m.last) + ' · ' + delta + '</div>';
        }
        let verdict;
        if (wins > losses && losses === 0) verdict = '✅ <b>' + latest.model_version + '</b>: лучше по ' + wins + ' метрикам из 4, ни по одной не хуже';
        else if (wins > losses) verdict = '➕ <b>' + latest.model_version + '</b>: лучше по ' + wins + ' метрикам из 4, хуже по ' + losses;
        else if (wins === losses) verdict = '➡️ <b>Метрики спорят</b>: ' + latest.model_version + ' лучше по ' + wins + ', хуже по ' + losses;
        else verdict = '⚠️ <b>' + latest.model_version + '</b>: хуже по ' + losses + ' метрикам из 4, лучше по ' + wins;
        html += '<div style="margin-top:12px;padding:10px;background:#eef4ff;border-radius:10px;font-size:11px;line-height:1.6">';
        html += '<div style="font-weight:900;margin-bottom:4px">Сравнение: ' + latest.model_version + ' vs ' + prev.model_version + ' (проверено ' + latest.verified + ' vs ' + prev.verified + ')</div>';
        html += rowsHtml;
        html += '<div style="margin-top:6px;font-weight:800">' + verdict + '</div>';
        html += '<div class="note" style="margin-top:6px">Версии работали в разное время и на разных станциях: часть разницы — от рынка, а не от алгоритма. Полностью чистое сравнение — одновременные прогнозы (shadow-режим, в планах).</div>';
        html += '</div>';
      } else {
        html += '<div class="note" style="margin-top:8px">Для сравнения нужно ≥10 проверенных прогнозов в каждой версии. Сейчас: ' + latest.model_version + ' — ' + latest.verified + ', ' + prev.model_version + ' — ' + prev.verified + '.</div>';
      }
    } else {
      html += '<div class="note" style="margin-top:8px">Пока только одна версия — сравнение появится, когда накопятся данные для двух версий.</div>';
    }
  }
  html += '<div class="note" style="margin-top:8px"><b>Медиана</b> — половина прогнозов ошибается меньше, половина больше. <b>MAE</b> — средняя ошибка. <b>P90</b> — худшие 10% прогнозов. <b>Попадания</b> — доля прогнозов, попавших в окно возврата.</div>';
  html += '</div>';

  // самые уверенные
  html += '<div class="section"><h2>💪 Самые уверенные прогнозы</h2>';
  if (!topConf.length) html += '<div class="note">Пока пусто.</div>';
  topConf.forEach(t => {
    html += '<div class="row"><span class="nm">' + (t.station_name || 'АЗС') + '<small>' + fuelRu(t.fuel_type) + ' · ' + sourceRu(t.prediction_source) + addrPart(t) + '</small></span>' +
      '<span class="vl">' + t5(t.from_time) + '–' + t5(t.to_time) + ' · ' + fmtPct(t.confidence) + '</span></div>';
  });
  html += '</div>';

  // самые узкие окна
  html += '<div class="section"><h2>🎯 Самые узкие окна (где алгоритм увереннее всего во времени)</h2>';
  if (!narrow.length) html += '<div class="note">Пока пусто.</div>';
  narrow.forEach(n => {
    html += '<div class="row"><span class="nm">' + (n.station_name || 'АЗС') + '<small>' + fuelRu(n.fuel_type) + ' · ' + sourceRu(n.prediction_source) + addrPart(n) + '</small></span>' +
      '<span class="vl">' + t5(n.from_time) + '–' + t5(n.to_time) + ' · ' + fmtMin(n.width_min) + '</span></div>';
  });
  html += '<div class="note">После v1.10 узкие окна (4–6 часов) — норма для станций с ровным ритмом привозов.</div></div>';
  
  // график качества моделей
  html += '<div class="section"><h2>📈 Качество моделей по неделям</h2>';
  html += '<div class="chart-tabs">';
  html += '<button data-m="median_min" class="' + (chartMetric === 'median_min' ? 'on' : '') + '" onclick="setMetric(\'median_min\')">Медиана ошибки</button>';
  html += '<button data-m="mae_min" class="' + (chartMetric === 'mae_min' ? 'on' : '') + '" onclick="setMetric(\'mae_min\')">MAE</button>';
  html += '<button data-m="p90_min" class="' + (chartMetric === 'p90_min' ? 'on' : '') + '" onclick="setMetric(\'p90_min\')">P90 (худшие 10%)</button>';
  html += '<button data-m="success_pct" class="' + (chartMetric === 'success_pct' ? 'on' : '') + '" onclick="setMetric(\'success_pct\')">Попадания, %</button>';
  html += '</div>';
  html += '<div id="chartBox" class="chart"></div>';
  html += '<div id="chartLegend"></div>';
  html += '<div class="note"><b>Ось Y</b> — величина метрики (для ошибок меньше = лучше, для попаданий больше = лучше). <b>Ось X</b> — ISO-недели по дате проверки. <b>Толстая линия</b> — все версии вместе (общая). Точки рисуются только там, где в неделе ≥3 измеренных прогнозов — иначе это шум, а не тренд. Одна версия может пропадать с графика в неделях, где её прогнозов мало.</div>';
  html += '</div>';

  app.innerHTML = html;
  chartData = d;
  drawChart();
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
